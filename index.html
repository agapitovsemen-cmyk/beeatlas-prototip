/* ============================= UTIL ============================= */
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function deepClone(x){ return JSON.parse(JSON.stringify(x)); }
function ruPlural(n, one, few, many){
  const mod10 = Math.abs(n)%10, mod100 = Math.abs(n)%100;
  if(mod100>10 && mod100<20) return many;
  if(mod10>1 && mod10<5) return few;
  if(mod10===1) return one;
  return many;
}
function clampCell(text, cls){
  const t = escapeHtml(text);
  return `<div class="cell-clamp-wrap"><div class="cell-clamp${cls?(" "+cls):""}">${t}</div><div class="cell-tooltip">${t}</div></div>`;
}
function clampNameCell(name, code){
  return `${clampCell(name, "req-chip")}<div class="row-sub">${escapeHtml(code)}</div>`;
}
function scoreBadge(score){
  if(!score) return '<span class="empty-cell">—</span>';
  return `<span class="badge ${score.level}">${escapeHtml(score.label)}</span>`;
}
function statusBadge(status){
  const level = status==="Активен" ? "green" : "gray";
  return `<span class="badge ${level}">${escapeHtml(status)}</span>`;
}
function riskBadge(level,label){
  return `<span class="badge ${level}">${escapeHtml(label)}</span>`;
}

let toastTimer=null;
function showToast(msg){
  state.toast = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 4200);
}
function closeToast(){ state.toast=null; clearTimeout(toastTimer); render(); }

/* ============================= SHELL ============================= */
function renderShell(){
  const prevWizardScroll = document.querySelector(".wizard-body") ? document.querySelector(".wizard-body").scrollTop : null;
  const prevMainScroll = document.getElementById("mainScroll") ? document.getElementById("mainScroll").scrollTop : null;
  const app = document.getElementById("app");
  app.innerHTML = `
    <div data-theme="${state.theme}" style="display:flex;flex-direction:column;height:100vh;">
      ${Header()}
      <div class="body-row">
        ${Sidebar()}
        <div class="main" id="mainScroll">
          <div class="page ${state.activeSidebar==="e2e"?"page-full":""}" id="pageRoot"></div>
        </div>
      </div>
    </div>
    ${state.wizard ? WizardOverlay() : ""}
    ${state.hldWizard ? HldWizardOverlay() : ""}
    ${state.ucWizard ? UcWizardOverlay() : ""}
    ${state.createPanel ? CreatePanelWrap() : ""}
    ${state.sidePanel ? SidePanelWrap() : ""}
    ${state.cjOpen ? CjOverlay() : ""}
    ${state.appcat.sourceEditor ? AcSourceEditorOverlay() : ""}
    ${state.graph.typeEditor ? GraphTypeEditorOverlay() : ""}
    ${state.graph.addNode ? GraphAddNodeOverlay() : ""}
    ${state.graph.addRel ? GraphAddRelOverlay() : ""}
    ${state.toast ? Toast() : ""}
  `;
  document.documentElement.setAttribute("data-theme", state.theme);
  renderPage();
  bindGlobalEvents();
  if(prevWizardScroll!==null){ const wb = document.querySelector(".wizard-body"); if(wb) wb.scrollTop = prevWizardScroll; }
  if(prevMainScroll!==null){ const ms = document.getElementById("mainScroll"); if(ms) ms.scrollTop = prevMainScroll; }
}

function go(view, params){
  state.route = Object.assign({view}, params||{});
  state.popover=null;
  if(view==="project"){
    state.projectTab="data";
    state.projectDataSubTab="business";
    state.projectAgentsSubTab="internal";
  }
  render();
  const m = document.getElementById("mainScroll");
  if(m) m.scrollTop = 0;
}

  const m = document.getElementById("mainScroll");

}

}

function renderPage(){
  const root = document.getElementById("pageRoot");
  if(!root) return;
  const r = state.route;
  let html = "";
  if(state.activeSidebar === "home"){
    html = HomePage();
  } else if(state.activeSidebar === "cj"){
    html = CjLibraryPage();
  } else if(state.activeSidebar === "e2e"){
    html = E2eCatalogPage();
  } else if(state.activeSidebar === "appcat"){
    html = AppCatalogModule();
  } else if(state.activeSidebar === "companyarch"){
    html = CompanyArchModule();
  } else if(state.activeSidebar !== "projects"){
    html = PlaceholderPage();
  } else if(r.view==="projects"){
    html = ProjectsListPage();
  } else if(r.view==="project"){
    html = ProjectDetailPage(r.projectId);
  } else if(r.view==="agent-assessment"){
    html = AgentAssessmentPage(r.projectId);
  } else if(r.view==="assessment-detail"){
    html = AssessmentDetailPage(r.projectId, r.assessmentId);
  } else if(r.view==="agent-hld"){
    html = AgentHldPage(r.projectId);
  } else if(r.view==="hld-skeleton"){
    html = HldSkeletonDetailPage(r.projectId);
  } else if(r.view==="hld-report"){
    html = HldReportPage(r.projectId, r.reportType, r.reportId);
  } else if(r.view==="usecase-detail"){
    html = UseCaseDetailPage(r.projectId, r.ucId);
  } else {
    html = ProjectsListPage();
  }
  root.innerHTML = html;
}

function graphCanonNeighbors(nodeId){
  const out = GRAPH_CANON_EDGES.filter(e=>e.from===nodeId).map(e=>({dir:"out", label:e.label, node:graphNode(e.to)}));
  const inn = GRAPH_CANON_EDGES.filter(e=>e.to===nodeId).map(e=>({dir:"in", label:e.label, node:graphNode(e.from)}));
  return [...inn, ...out];
}

function rpProjectBlock(p){
  const ac = state.appcat;
  const key = "proj:"+p.id;
  const open = !!ac.relatedExpanded[key];
  return `
    <div class="rp-project">
      <div class="rp-project-head" data-action="ac-toggle-related" data-key="${key}">
        <span class="exp-row-btn ${open?"open":""}">${icon("chevronRight")}</span>
        ${icon("folder")}
        <span class="rp-project-title">${escapeHtml(p.name)}</span>
        ${rpStatusBadge(p.status)}
      </div>
      ${open ? `<div class="rp-uc-list">${p.useCases.map(uc=>rpUcCard(uc,p.id)).join("")}</div>` : ""}
    </div>
  `;
}

function rpUcCard(uc, projId){
  const ac = state.appcat;
  const key = "uc:"+projId+":"+uc.id;
  const open = !!ac.relatedExpanded[key];
  const rows = uc.interfaces.flatMap(ifc => ifc.operations.map(op => ({ifc, op})));
  return `
    <div class="card rp-uc-card">
      <div class="card-title-row" data-action="ac-toggle-related" data-key="${key}">
        <span class="exp-row-btn ${open?"open":""}">${icon("chevronRight")}</span>
        <span class="rp-uc-name">${escapeHtml(uc.title)}</span>
        <span class="rp-uc-code">${escapeHtml(uc.code)}</span>
        ${rpStatusBadge(uc.status)}
      </div>
      ${open ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Интерфейс</th><th>Операция</th><th>Статус</th></tr></thead>
            <tbody>

                <tr>

                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      ` : ""}
    </div>
  `;
}

function AcTreeNode(node, level){
  level = level || 1;
  const ac = state.appcat;
  const q = ac.listSearch.trim().toLowerCase();
  const open = !!ac.expanded[node.id] || !!q;
  let body = "";
  if(node.children){
    body = node.children.map(c=>AcTreeNode(c, level+1)).join("");
  } else if(node.appIds){
    let apps = node.appIds.map(findApp);
    if(q) apps = apps.filter(a=>a.name.toLowerCase().includes(q) || a.cmdb.toLowerCase().includes(q) || a.owner.toLowerCase().includes(q));
    if(!apps.length) return "";
    body = AcAppsTable(apps);
  }
  return `
    <div class="ac-tree-row lvl-${Math.min(level,2)}" data-action="ac-toggle-tree" data-id="${node.id}">
      <span class="chev ${open?"open":""}">${icon("chevronRight")}</span><span>${escapeHtml(node.label)}</span>
    </div>
    ${open ? `<div class="ac-tree-body">${body}</div>` : ""}
  `;
}

function findObsNode(id, list){
  for(const n of list){
    if(n.id===id) return n;
    if(n.children){ const f = findObsNode(id, n.children); if(f) return f; }
  }
  return null;
}

/* ---- graph layout + SVG rendering ---- */
function graphTrunc(s, n){ s=String(s); return s.length>n ? s.slice(0,n-1)+"…" : s; }

function graphLayeredPositions(customInstances){
  customInstances = customInstances || [];
  const nodeW=176, nodeH=64, colGap=36, rowGap=90, padTop=28;
  const satW=140, satH=44, satGap=22;
  const incoming = {};
  GRAPH_CANON_NODES.forEach(n=>{ incoming[n.id] = GRAPH_CANON_EDGES.filter(e=>e.to===n.id).map(e=>e.from); });
  const level = {};
  function calcLevel(id, seen){
    if(level[id]!==undefined) return level[id];
    const preds = (incoming[id]||[]).filter(p=>!seen.includes(p));
    if(!preds.length){ level[id]=0; return 0; }
    const l = 1 + Math.max(...preds.map(p=>calcLevel(p, seen.concat([id]))));
    level[id]=l;
    return l;
  }
  GRAPH_CANON_NODES.forEach(n=>calcLevel(n.id, []));
  const byLevel = {};
  GRAPH_CANON_NODES.forEach(n=>{ (byLevel[level[n.id]] = byLevel[level[n.id]]||[]).push(n); });
  const levels = Object.keys(byLevel).map(Number).sort((a,b)=>a-b);
  const customByParent = {};
  customInstances.forEach(inst=>{ (customByParent[inst.attachTo] = customByParent[inst.attachTo]||[]).push(inst); });

  // pass 1: compute each row's total width (canon nodes + their satellites, sequential)
  const rowWidths = levels.map(l=>{
    let w = 0;
    byLevel[l].forEach((n,i)=>{
      if(i>0) w += colGap;
      w += nodeW;
      (customByParent[n.id]||[]).forEach(()=>{ w += satGap + satW; });
    });
    return w;
  });
  const maxRowWidth = Math.max(...rowWidths, nodeW);

  const pos = {}, custPos = {};
  let y = padTop;
  levels.forEach((l, idx)=>{
    const arr = byLevel[l];
    const startX = (maxRowWidth-rowWidths[idx])/2;
    let x = startX;
    arr.forEach((n,i)=>{
      if(i>0) x += colGap;
      pos[n.id] = {x, y, w:nodeW, h:nodeH};
      x += nodeW;
      (customByParent[n.id]||[]).forEach(inst=>{
        x += satGap;
        custPos[inst.instanceId] = {x, y:y+(nodeH-satH)/2, w:satW, h:satH};
        x += satW;
      });
    });
    y += nodeH;
    if(idx < levels.length-1) y += rowGap;
  });
  y += padTop;
  return {pos, custPos, maxRowWidth, canvasHeight:y, nodeW, nodeH, satW, satH, padTop};
}

function graphAutoFitZoom(){
  const pane = document.querySelector(".graph-canvas-pane");
  if(!pane || !state.graph.selectedNodeId) return;
  const customInstances = state.graph.showCustomLayer ? visibleNodeInstances() : [];
  const {maxRowWidth, canvasHeight} = graphLayeredPositions(customInstances);
  const canvasWidth = maxRowWidth + 28*2;
  const availW = pane.clientWidth - 40, availH = pane.clientHeight - 40;
  if(canvasWidth<=0 || canvasHeight<=0 || availW<=0 || availH<=0) return;
  const z = Math.min(availW/canvasWidth, availH/canvasHeight, 1.6);
  state.graph.zoom = Math.max(0.3, Math.round(z*100)/100);
}

function graphAnchorPoints(a, b){
  const ac = {x:a.x+a.w/2, y:a.y+a.h/2}, bc = {x:b.x+b.w/2, y:b.y+b.h/2};
  if(Math.abs(ac.y-bc.y) >= Math.abs(ac.x-bc.x)){
    return ac.y<=bc.y ? [{x:ac.x,y:a.y+a.h},{x:bc.x,y:b.y}] : [{x:ac.x,y:a.y},{x:bc.x,y:b.y+b.h}];
  }
  return ac.x<=bc.x ? [{x:a.x+a.w,y:ac.y},{x:b.x,y:bc.y}] : [{x:a.x,y:ac.y},{x:b.x+b.w,y:bc.y}];
}

function graphEdgeSvg(fromBox, toBox, label, opts){
  opts = opts||{};
  const [p1,p2] = graphAnchorPoints(fromBox, toBox);
  if(opts.offsetX){ p1.x += opts.offsetX; p2.x += opts.offsetX; }
  const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
  const stroke = opts.dashed ? "var(--orange-text)" : "var(--border-strong)";
  const opacity = opts.dim ? 0.25 : 1;
  const dashAttr = opts.dashed ? ' stroke-dasharray="5 4"' : "";
  const markerAttr = opts.dashed ? "" : ' marker-end="url(#graphArrow)"';
  const lblW = label ? Math.max(24, label.length*5.6+14) : 0;
  return `
    <g opacity="${opacity}">
      <line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" stroke="${stroke}" stroke-width="1.4"${dashAttr}${markerAttr}/>
      ${label ? `
        <rect x="${(mx-lblW/2).toFixed(1)}" y="${(my-8).toFixed(1)}" width="${lblW.toFixed(1)}" height="16" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
        <text x="${mx.toFixed(1)}" y="${(my+3).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--text-secondary)">${escapeHtml(label)}</text>
      ` : ""}
    </g>
  `;
}

const GRAPH_TYPE_BRACKET = {CJ:"[CJ]", SoftwareSystem:"[SYSTEM]", Container:"[CONTAINER]"};

function graphCanonNodeSvg(n, box, selected, dim){
  const colors = {CJ:"var(--pink-text)", SoftwareSystem:"var(--blue-text)", Container:"var(--gray-text)"};
  const c = colors[n.type] || "var(--text-secondary)";
  const bracket = GRAPH_TYPE_BRACKET[n.type] || `[${n.type.toUpperCase()}]`;
  const sub = n.cmdb || n.mnemonic || "";
  return `
    <g class="graph-node-g ${dim?"dim":""}" data-action="graph-select-node" data-id="${n.id}">
      <title>${escapeHtml(n.label)}</title>
      <rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="6" fill="var(--bg)" stroke="${selected?"var(--blue)":"var(--border-strong)"}" stroke-width="${selected?2:1.2}"/>
      <text x="${box.x+12}" y="${box.y+19}" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" fill="${c}">${escapeHtml(bracket)}</text>
      <text x="${box.x+12}" y="${box.y+38}" font-size="13.5" font-weight="600" fill="var(--text)">${escapeHtml(graphTrunc(n.label,20))}</text>
      ${sub ? `<text x="${box.x+12}" y="${box.y+54}" font-size="11" fill="var(--text-tertiary)">${escapeHtml(sub)}</text>` : ""}
    </g>
  `;
}

function graphCustomNodeSvg(inst, box, dim){
  const t = findNodeType(inst.type);
  return `
    <g class="graph-node-g ${dim?"dim":""}" data-action="graph-select-node" data-id="${inst.attachTo}">

      <rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="9" fill="var(--bg)" stroke="var(--blue-text)" stroke-width="1.4" stroke-dasharray="4 3"/>
      <text x="${box.x+box.w/2}" y="${box.y+19}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text)">${escapeHtml(graphTrunc(inst.name,17))}</text>
      <text x="${box.x+box.w/2}" y="${box.y+35}" text-anchor="middle" font-size="10" fill="var(--text-secondary)">${escapeHtml(graphTrunc(t?t.name:inst.type,20))}</text>
    </g>
  `;
}

function GraphCanvasSvg(){
  const g = state.graph;
  const q = g.nodeSearch.trim().toLowerCase();
  const anyQuery = !!q && !g.selectedNodeId;
  function matches(label, cmdb){ return !anyQuery || label.toLowerCase().includes(q) || (cmdb||"").toLowerCase().includes(q); }
  function nodeDim(n){ return g.typeFilter[n.type]===false || (anyQuery && !matches(n.label, n.cmdb)); }

  const customInstances = g.showCustomLayer ? visibleNodeInstances() : [];
  const customRelInstances = g.showCustomLayer ? visibleRelInstances() : [];

  const padX = 28;
  const {pos, custPos, maxRowWidth, canvasHeight:layoutHeight, nodeW, nodeH, satW, satH} = graphLayeredPositions(customInstances);
  const canvasWidth = maxRowWidth + padX*2;
  const canvasHeight = layoutHeight;

  const boxes = {};
  GRAPH_CANON_NODES.forEach(n=>{ const p=pos[n.id]; boxes[n.id] = {x:padX+p.x, y:p.y, w:nodeW, h:nodeH}; });
  const custBoxes = {};
  customInstances.forEach(inst=>{ const p=custPos[inst.instanceId]; if(p) custBoxes[inst.instanceId] = {x:padX+p.x, y:p.y, w:satW, h:satH}; });

  let body = `<defs>
    <marker id="graphArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--border-strong)"/>
    </marker>
  </defs>`;

  GRAPH_CANON_EDGES.forEach(e=>{
    const fromN = graphNode(e.from), toN = graphNode(e.to);
    const dim = nodeDim(fromN) && nodeDim(toN);
    body += graphEdgeSvg(boxes[e.from], boxes[e.to], e.label, {dim});
  });

  customInstances.forEach(inst=>{
    const anchorBox = boxes[inst.attachTo];
    if(anchorBox) body += graphEdgeSvg(anchorBox, custBoxes[inst.instanceId], "", {dashed:true});
  });
  customRelInstances.forEach(r=>{
    const fromBox = boxes[r.from] || custBoxes[r.from];
    const toBox = boxes[r.to] || custBoxes[r.to];
    if(fromBox && toBox){
      const t = findRelType(r.type);
      body += graphEdgeSvg(fromBox, toBox, t?t.name:r.type, {dashed:true, offsetX:14});
    }
  });

  GRAPH_CANON_NODES.forEach(n=>{
    body += graphCanonNodeSvg(n, boxes[n.id], state.graph.selectedNodeId===n.id, nodeDim(n));
  });
  customInstances.forEach(inst=>{
    const dim = anyQuery && !matches(inst.name, "");
    body += graphCustomNodeSvg(inst, custBoxes[inst.instanceId], dim);
  });

  const zoom = g.zoom || 1;
  const renderW = canvasWidth*zoom, renderH = canvasHeight*zoom;
  return `<svg id="graphCanvasSvgEl" viewBox="0 0 ${canvasWidth.toFixed(1)} ${canvasHeight.toFixed(1)}" style="display:block;width:${renderW.toFixed(1)}px;height:${renderH.toFixed(1)}px;flex:0 0 auto;">${body}</svg>`;
}

function GraphNodeDetail(node){

  const availNodeTypes = visibleNodeTypes().filter(t=>t.linkableNodes.includes(node.type));
  const availRelTypes = visibleRelTypes().filter(t=>t.nodePairs.some(p=>p.from===node.type || p.to===node.type));
  const addNodeAttr = availNodeTypes.length ? "" : ` disabled title="Нет доступных типов кастомных нод для этого элемента"`;
  const addRelAttr = availRelTypes.length ? "" : ` disabled title="Нет доступных типов связей для этого элемента"`;
  const identityRows = [
    ["Тип", node.type],
    ["CMDB", node.cmdb],

  ].filter(([,v])=>v);
  return `
    <div class="page-title-row" style="margin-bottom:var(--space-5);">
      <h2 style="margin:0;">${escapeHtml(node.label)}</h2>
    </div>

    <div class="ac-kv" style="margin-bottom:var(--space-5);">

      <button class="btn btn-outline btn-sm" data-action="graph-open-add-node" data-id="${node.id}"${addNodeAttr}>${icon("plus")} Добавить ноду</button>
      <button class="btn btn-outline btn-sm" data-action="graph-open-add-rel" data-id="${node.id}"${addRelAttr}>${icon("plus")} Добавить связь</button>

        <div class="table-wrap">
          <table>
            <thead><tr><th>Направление</th><th>Связь</th><th>Элемент</th><th>Тип</th></tr></thead>
            <tbody>
              ${neighbors.map(n=>`
                <tr>
                  <td>${n.dir==="out"?"Исходящая":"Входящая"}</td>
                  <td>${escapeHtml(n.label)}</td>
                  <td><span class="proj-link" data-action="graph-select-node" data-id="${n.node.id}">${escapeHtml(n.node.label)}</span></td>
                  <td>${escapeHtml(n.node.type)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      ` : `<p style="color:var(--text-secondary);">Нет связей канона.</p>`}
    </div>

    <div class="toggle-wrap" style="margin-bottom:var(--space-6);">
      <div class="toggle ${g.showCustomLayer?"on":""}" data-action="graph-toggle-custom-layer"><div class="knob"></div></div>
      <span>Кастомный слой</span>
    </div>

    ${g.showCustomLayer ? `
      <div class="section">
        <h2>Кастомные ноды</h2>
        ${customNodes.length ? customNodes.map(GraphCustomNodeCard).join("") : `<p style="color:var(--text-secondary);">Нет видимых кастомных нод на этом элементе.</p>`}
      </div>
      <div class="section">
        <h2>Кастомные связи</h2>
        ${customRels.length ? `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Тип</th><th>От</th><th>К</th><th>Атрибуты</th></tr></thead>
              <tbody>
                ${customRels.map(r=>{
                  const t = findRelType(r.type);
                  const fromNode = graphNode(r.from), toNode = graphNode(r.to);
                  return `<tr>
                    <td>${escapeHtml(t?t.name:r.type)}</td>
                    <td>${escapeHtml(fromNode?fromNode.label:r.from)}</td>
                    <td>${escapeHtml(toNode?toNode.label:r.to)}</td>
                    <td>${Object.entries(r.attributes).map(([k,v])=>`${escapeHtml((t&&t.attributes[k])||k)}: ${escapeHtml(String(v))}`).join(", ")||"—"}</td>

function GraphTypesPage(){
  const g = state.graph;
  const isNode = g.typeKind==="node";
  const list = isNode ? visibleNodeTypes() : visibleRelTypes();
  const buckets = GRAPH_TYPE_TREE_ROOTS.map(root => ({
    root,
    items: isNode
      ? list.filter(t=>t.linkableNodes.includes(root.id))
      : list.filter(t=>t.nodePairs.some(p=>p.from===root.id)),
  }));
  const bucketed = new Set();
  buckets.forEach(b=>b.items.forEach(t=>bucketed.add(t.code)));
  const orphans = list.filter(t=>!bucketed.has(t.code));
  return `
    <div class="filters-row">
      <div style="display:flex;gap:var(--space-2);">
        <div class="home-chip ${isNode?"active":""}" data-action="graph-set-type-kind" data-kind="node">Типы нод</div>

      <button class="btn btn-primary" data-action="graph-new-type">${icon("plus")} ${isNode?"Новый тип ноды":"Новый тип связи"}</button>
    </div>
    ${list.length ? `
      <div class="ac-tree">
        ${buckets.map(b=>GraphTypeTreeRoot(b.root, b.items, isNode)).join("")}
        ${orphans.length ? GraphTypeTreeRoot({id:"__other__", label:"Другое"}, orphans, isNode) : ""}
      </div>
    ` : `<p style="color:var(--text-secondary);">Нет типов в этой группе.</p>`}
  `;
}

function GraphAddRelOverlay(){
  const st = state.graph.addRel;
  if(!st) return "";
  const anchor = graphNode(st.anchorId);
  const options = visibleRelTypes().filter(t=>t.nodePairs.some(p=>p.from===anchor.type || p.to===anchor.type));
  if(!st.draft.typeCode && options.length) st.draft.typeCode = options[0].code;
  const type = findRelType(st.draft.typeCode);
  let otherOptions = [];
  let anchorRole = st.draft.anchorRole;
  if(type){
    const asFrom = type.nodePairs.find(p=>p.from===anchor.type);
    const asTo = type.nodePairs.find(p=>p.to===anchor.type);
    if(!anchorRole) anchorRole = asFrom ? "from" : "to";
    if(!st.draft.anchorRole) st.draft.anchorRole = anchorRole;
    const pair = anchorRole==="from" ? asFrom : asTo;
    if(pair) otherOptions = GRAPH_CANON_NODES.filter(n=>n.id!==anchor.id && n.type===(anchorRole==="from"?pair.to:pair.from));
  }
  return `
    <div class="wizard-overlay">
      <div class="wizard-head">
        <div class="proj-link" style="display:flex;align-items:center;gap:var(--space-2);color:var(--text);font-weight:600;" data-action="graph-close-add-rel">${icon("chevronLeft")} Назад</div>

            ${options.map(o=>`<option value="${o.code}" ${st.draft.typeCode===o.code?"selected":""}>${escapeHtml(o.name)}</option>`).join("")}
          </select>
        </div>
        <div class="field-block">
          <label class="field-label">Направление</label>
          <select class="select" id="garRoleSelect">
            ${type && type.nodePairs.some(p=>p.from===anchor.type) ? `<option value="from" ${anchorRole==="from"?"selected":""}>«${escapeHtml(anchor.label)}» → другой элемент</option>` : ""}
            ${type && type.nodePairs.some(p=>p.to===anchor.type) ? `<option value="to" ${anchorRole==="to"?"selected":""}>другой элемент → «${escapeHtml(anchor.label)}»</option>` : ""}
          </select>
        </div>
        <div class="field-block">
          <label class="field-label">Второй элемент</label>
          <select class="select" id="garOtherSelect">
            <option value="">— выберите —</option>
            ${otherOptions.map(o=>`<option value="${o.id}" ${st.draft.otherId===o.id?"selected":""}>${escapeHtml(o.label)} (${escapeHtml(o.type)})</option>`).join("")}
          </select>
        </div>
        ${type ? Object.entries(type.attributes).map(([k,label])=>`
          <div class="field-block"><label class="field-label">${escapeHtml(label)}</label><input class="input" id="garAttr-${escapeHtml(k)}" data-gar-attr="${escapeHtml(k)}" value="${escapeHtml(st.draft.attributes[k]||"")}"/></div>
        `).join("") : ""}
       </div>
      </div>
      <div class="wizard-foot">
        <div style="max-width:909px;width:100%;margin:0 auto;display:flex;gap:var(--space-3);justify-content:flex-end;">
          <button class="btn btn-outline" data-action="graph-close-add-rel">Отмена</button>
          <button class="btn btn-primary" data-action="graph-save-add-rel" ${st.draft.otherId ? "":"disabled"}>Отправить заявку</button>
        </div>
      </div>
    </div>
  `;
}

const CJ_FILTER_TYPE_OPTIONS = ["E2E","B2C"];
const CJ_FILTER_FORMAT_OPTIONS = ["BPMN","Beeatlas"];
function cjFilterChannelOptions(){
  return [...new Set(CJ_LIBRARY.flatMap(c=>c.channels==="—"?[]:c.channels.split(", ")))];
}
function cjFilterProductOptions(){
  return [...new Set(CJ_LIBRARY.map(c=>c.app).filter(a=>a!=="—"))];
}
function cjActiveFilterCount(){
  const f = state.cjFilters;
  return (f.withGrafana?1:0) + (f.product?1:0) + (f.status?1:0) + (f.format?1:0) + (f.channel?1:0) + (f.type?1:0);
}
function filteredCjLibrary(){
  const q = state.cjSearch.trim().toLowerCase();
  const f = state.cjFilters;
  return CJ_LIBRARY.filter(c=>{
    if(q && !(c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q))) return false;
    if(f.withGrafana && !c.extraBadges.some(b=>b.t==="GRAFANA")) return false;
    if(f.product && c.app!==f.product) return false;
    if(f.status && c.status!==f.status) return false;
    if(f.format && !c.extraBadges.some(b=>b.t===f.format)) return false;
    if(f.type && !c.tags.includes(f.type)) return false;
    if(f.channel && !c.channels.includes(f.channel)) return false;
    return true;
  });
}

  return `

const CJ_FIELD_ROWS = [
  {key:"biName", label:"Наименование BI"},
  {key:"biId", label:"Идентификатор BI"},
  {key:"description", label:"Описание"},
  {key:"characteristic", label:"Характеристики"},
  {key:"lifecycle", label:"Статус стадии ЖЦ"},
  {key:"scenario", label:"Сценарий"},
  {key:"steps", label:"Шаги сценария BI"},
  {key:"channels", label:"Каналы"},
  {key:"tags", label:"Теги"},
  {key:"docs", label:"Документация"},
  {key:"metrics", label:"Метрики"},
];

// Emits the matrix row-major (label cell, then one cell per stage, repeat) rather than
// column-by-column, so each logical row is a single CSS grid row and its height — driven
// by whichever cell has the most content that tick — applies to every column at once.
function CjMatrix(cj){
  const stages = cj.stages;
  return `
    <div class="cj-matrix" style="grid-template-columns:176px repeat(${stages.length},minmax(280px,1fr));">
      <div class="cj-field-col-head">Этапы ${icon("chevronDown")}</div>
      ${stages.map(s=>`
        <div class="cj-stage-head ${s.color}">
          ${escapeHtml(s.name)}
          <span style="display:flex;align-items:center;gap:6px;">${icon("chevronDown")}${icon("moreVertical")}</span>
        </div>`).join("")}

      ${CJ_FIELD_ROWS.map(f=>`
        <div class="cj-field-row">${escapeHtml(f.label)}</div>
        ${stages.map(s=>CjStageFieldCell(s,f.key)).join("")}
      `).join("")}

      <div class="cj-below-links">
        <a data-action="cj-noop">Показать скрытые</a>
        <a data-action="cj-noop">Свернуть CJ</a>
      </div>
    </div>
  `;
}

function CjStageFieldCell(stage, key){
  switch(key){
    case "biName": return `<div class="cj-stage-cell">${escapeHtml(stage.biName)}</div>`;
    case "biId": return `<div class="cj-stage-cell"><span style="color:var(--blue);font-weight:600;">${escapeHtml(stage.biId)}</span></div>`;
    case "description": return `<div class="cj-stage-cell wrap">${escapeHtml(stage.description)}</div>`;
    case "characteristic": return `<div class="cj-stage-cell"><span class="badge ${stage.characteristic.c}">${escapeHtml(stage.characteristic.t)}</span></div>`;
    case "lifecycle": return `<div class="cj-stage-cell"><span class="badge ${stage.lifecycle.c}">${escapeHtml(stage.lifecycle.t)}</span></div>`;
    case "scenario": return `<div class="cj-stage-cell wrap">${stage.scenario.map(l=>escapeHtml(l)).join("<br>")}</div>`;
    case "steps": return `<div class="cj-stage-cell cj-scenario-cell">${CjScenarioCell(stage)}</div>`;
    case "channels": return `<div class="cj-stage-cell">${escapeHtml(stage.channels)}</div>`;
    case "tags": return `<div class="cj-stage-cell wrap"><div class="cj-card-tags">${stage.tags.map(t=>`<span class="cj-tag">${escapeHtml(t)}</span>`).join("")}</div></div>`;
    case "docs": return `<div class="cj-stage-cell"><a data-action="cj-noop" style="color:var(--blue);">${escapeHtml(stage.docs)}</a></div>`;
    case "metrics": return `<div class="cj-stage-cell wrap">${escapeHtml(stage.metrics)}</div>`;
    default: return `<div class="cj-stage-cell"></div>`;
  }
}

// A BI Step's "Шаги сценария BI" cell can hold several scenarios (several distinct call
// chains, e.g. "Сценарий 1"/"Сценарий 2" — not just one). Each scenario in turn can have
// up to 3 sources (Ручная привязка / Use Case / E2E). Expanding a scenario chip always
// reveals its source list (even when there's only one source, for a consistent model);
// clicking any source opens its call data in a side sheet (CjSourcePanel) rather than
// inline, so editing the manual source and viewing a read-only source both go through
// the same side-sheet flow instead of two different UI shapes.
function CjScenarioCell(stage){
  const numbered = stage.scenarios.length>1;
  return stage.scenarios.map((sc,i)=>CjScenarioRow(stage, sc, i, numbered)).join("");
}

function CjScenarioRow(stage, sc, idx, numbered){
  const key = stage.id+":"+sc.id;
  const expanded = !!state.cjExpanded[key];
  const label = numbered ? `Сценарий ${idx+1}` : "Сценарий";
  return `
    <div class="cj-scenario-group">
      <div class="cj-scenario-chip" data-action="cj-toggle-expand" data-key="${key}">
        <span class="ic">${icon("gear")}</span>
        <span class="txt"><span class="n">${label}</span><br><span class="id">ID.00.00.00.98</span></span>
        <span class="chev">${icon(expanded?"chevronDown":"chevronRight")}</span>
      </div>
      ${expanded ? `<div class="cj-scenario-body">${CjSourceBadgeList(stage, sc)}</div>` : ""}
    </div>
  `;
}

function CjSourceBadgeList(stage, sc){
  const hasManual = sc.sources.some(s=>s.type==="manual");
  return `
    <div class="cj-source-list">
      ${cjScenarioDivergent(sc) ? `<div class="cj-source-warn">${icon("alertTriangle")} Реализации по источникам расходятся</div>` : ""}
      ${sc.sources.map(s=>{
        const meta = CJ_SOURCE_META[s.type];
        return `
          <div class="cj-source-badge" data-action="cj-open-source" data-stage="${stage.id}" data-scenario="${sc.id}" data-source="${s.id}">
            <span class="dot ${meta.dot}"></span>
            <span class="lbl"><span class="t">${meta.label}</span><br><span class="n">${escapeHtml(s.label)}</span></span>
            ${icon("chevronRight")}
          </div>`;
      }).join("")}
      ${!hasManual ? `
        <div class="cj-source-badge add" data-action="cj-add-manual-source" data-stage="${stage.id}" data-scenario="${sc.id}">
          ${icon("plus")}
          <span class="lbl"><span class="n">Добавить ручную привязку</span></span>
        </div>` : ""}
    </div>
  `;
}

// A source can chain several calls (Вызов 1, Вызов 2, ...), each carrying its own
// realization (Приложение/Техническая возможность/Endpoint/Интерфейс) — matching the
// source mockup's "Вызов 1f → call detail" nesting, just flattened into a list of call
// blocks here rather than the mockup's collapsible tree, since the sequence-diagram/SLA
// editing chrome around it is out of scope for this prototype.
function CjCallEditFields(calls){
  return calls.map((c,i)=>`
    <div class="cj-call-edit-group">
      <div class="cj-call-edit-title-row">
        <div class="cj-call-edit-title">Вызов ${i+1}</div>
        ${calls.length>1 ? `<button class="icon-btn" data-action="cj-remove-call" data-idx="${i}" title="Удалить вызов">${icon("x")}</button>` : ""}
      </div>
      <div class="field-block">
        <label class="field-label">Приложение</label>
        <input class="input" id="cjCall-${i}-app" data-call-idx="${i}" data-call-field="app" value="${escapeHtml(c.app)}" placeholder="Например, Beeatlas">
      </div>
      <div class="field-block">
        <label class="field-label">Техническая возможность</label>
        <input class="input" id="cjCall-${i}-capability" data-call-idx="${i}" data-call-field="capability" value="${escapeHtml(c.capability)}" placeholder="Что делает этот вызов">
      </div>
      <div class="field-block">
        <label class="field-label">Endpoint</label>
        <input class="input" id="cjCall-${i}-endpoint" data-call-idx="${i}" data-call-field="endpoint" value="${escapeHtml(c.endpoint)}" placeholder="POST /...">
      </div>
      <div class="field-block">
        <label class="field-label">Интерфейс</label>
        <input class="input" id="cjCall-${i}-iface" data-call-idx="${i}" data-call-field="iface" value="${escapeHtml(c.iface)}" placeholder="REST">
      </div>
    </div>
  `).join("");
}

function CjBranchCreatePanel(){
  const p = state.cjBranchPanel;
  const cjId = state.cjOpen.cjId;
  const branches = cjBranchList(cjId);
  const name = p.name.trim();
  const reserved = ["design","develop","main"];
  const existing = branches.map(b=>b.id.toLowerCase());
  const taken = !!name && (reserved.includes(name.toLowerCase()) || existing.includes(name.toLowerCase()));
  const canCreate = !!name && !taken;
  return `
    <div class="backdrop enter" data-action="cj-close-branch-create"></div>
    <div class="side-panel enter">
      <div class="side-head">
        <h2>Новая ветка</h2>
        <button class="wizard-close" data-action="cj-close-branch-create">${icon("x")}</button>
      </div>
      <div class="side-body">
        <div class="field-block">
          <label class="field-label">Название ветки*</label>
          <input class="input${taken?" error":""}" id="cjBranchName" value="${escapeHtml(p.name)}" placeholder="Например, ivanov-fix-st4">
          ${taken?`<div style="color:var(--red-text);font-size:12.5px;margin-top:4px;">Ветка с таким названием уже существует</div>`:""}
        </div>
        <div class="field-block">
          <label class="field-label">Клонировать состав из ветки</label>
          <select class="select" id="cjBranchParentSelect">
            ${branches.map(b=>`<option value="${b.id}" ${p.parent===b.id?"selected":""}>${escapeHtml(b.id)}</option>`).join("")}
          </select>
        </div>
        <div class="readonly-note" style="align-items:flex-start;">
          ${icon("info")}
          <span>Новая ветка получит полную независимую копию состава выбранной ветки. Дальнейшие изменения в одной ветке не затронут другую.</span>
        </div>
      </div>
      <div class="side-foot">
        <button class="btn btn-outline" data-action="cj-close-branch-create">Отменить</button>
        <button class="btn btn-primary" data-action="cj-branch-create-submit" ${canCreate?"":"disabled"}>Создать</button>
      </div>
    </div>
  `;
}

function CjMergePanel(){
  const p = state.cjMergePanel;
  // the whole panel is rebuilt from scratch on every click inside it (source/target/
  // strategy pills all trigger a full render()) — only play the open animation on the
  // very first paint, or every one of those clicks replays it and the screen flashes.
  const firstPaint = !p._entered;
  p._entered = true;
  const cjId = state.cjOpen.cjId;
  const branches = cjBranchList(cjId);
  const srcStats = cjTreeStats(cjBranchTree(cjId, p.source));
  const tgtStats = cjTreeStats(cjBranchTree(cjId, p.target));
  const canMerge = !!p.source && !!p.target && p.source!==p.target;
  return `
    <div class="backdrop${firstPaint?" enter":""}" data-action="cj-close-merge"></div>
    <div class="side-panel${firstPaint?" enter":""}">
      <div class="side-head">
        <div class="cj-merge-title-wrap">
          <h2>Объединение веток</h2>
          <button class="icon-btn cj-merge-help-btn" data-action="toggle-popover" data-popover="cj-merge-help" title="Как это работает">${icon("info")}</button>
          ${state.popover==="cj-merge-help" ? `
            <div class="popover cj-merge-help-popover">
              <div class="pv-title">Как работает объединение</div>
              <ul class="cj-merge-help-list">
                <li><b>Откуда → Куда</b> — из какой ветки берём изменения и в какую их вносим.</li>
                <li><b>Добавление</b> — добавит только то, чего нет в целевой ветке; то, что там уже есть, не трогает.</li>
                <li><b>Замена</b> — полностью заменит состав целевой ветки составом исходной.</li>
              </ul>
            </div>` : ""}
        </div>
        <button class="wizard-close" data-action="cj-close-merge">${icon("x")}</button>
      </div>
      <div class="side-body">
        <div class="field-block">
          <label class="field-label">Откуда (source)</label>
          <div class="cj-branch-pills">
            ${branches.map(b=>`<div class="cj-branch-pill ${p.source===b.id?"active":""}" data-action="cj-merge-set-source" data-branch="${b.id}">${escapeHtml(b.id)}</div>`).join("")}
          </div>
        </div>
        <div class="field-block">
          <label class="field-label">Куда (target)</label>
          <div class="cj-branch-pills">
            ${branches.map(b=>b.id===p.source
              ? `<div class="cj-branch-pill disabled" title="Совпадает с источником">${escapeHtml(b.id)}</div>`
              : `<div class="cj-branch-pill ${p.target===b.id?"active":""}" data-action="cj-merge-set-target" data-branch="${b.id}">${escapeHtml(b.id)}</div>`
            ).join("")}
          </div>
        </div>

        <div class="cj-merge-compare">
          <div class="col">
            <div class="hd">${escapeHtml(p.source)}</div>
            <div class="sub">Откуда</div>
            <div class="row">${srcStats.stages} ${ruPlural(srcStats.stages,"этап","этапа","этапов")}</div>
            <div class="row">${srcStats.scenarios} ${ruPlural(srcStats.scenarios,"сценарий","сценария","сценариев")}</div>
            <div class="row">${srcStats.sources} ${ruPlural(srcStats.sources,"источник","источника","источников")}</div>
          </div>
          <div class="arrow">${icon("chevronRight")}</div>
          <div class="col">
            <div class="hd">${escapeHtml(p.target)}</div>
            <div class="sub">Куда</div>
            <div class="row">${tgtStats.stages} ${ruPlural(tgtStats.stages,"этап","этапа","этапов")}</div>
            <div class="row">${tgtStats.scenarios} ${ruPlural(tgtStats.scenarios,"сценарий","сценария","сценариев")}</div>
            <div class="row">${tgtStats.sources} ${ruPlural(tgtStats.sources,"источник","источника","источников")}</div>

              <div class="t">Добавление (add)</div>

      </div>
    </div>
  `;
}

/* ============================= CJ BPMN VIEW ============================= */
function bpmnWrapLines(text, maxChars, maxLines){
  const words = text.split(" ");
  const lines = [];
  let cur = "";
  for(const w of words){
    const test = cur ? cur+" "+w : w;
    if(test.length > maxChars && cur){
      lines.push(cur);
      cur = w;
      if(lines.length===maxLines) break;
    } else {
      cur = test;
    }
  }
  if(lines.length<maxLines && cur) lines.push(cur);
  const usedLen = lines.join(" ").length;
  if(usedLen < text.length){
    let last = lines[lines.length-1];
    if(last.length>maxChars-1) last = last.slice(0,maxChars-1);
    lines[lines.length-1] = last.replace(/\s+\S*$/,"") + "…";
  }
  return lines;
}

function CjBpmnTopDiagram(cj){
  const boxW=220, boxH=90, gapX=64, padX=48, padTop=48;
  const laneCenterY = padTop+boxH/2;
  let x = padX;
  const startCx = x+18, startCy=laneCenterY;
  x += 36+gapX;
  const nodes = cj.stages.map(st=>{
    const n = {stage:st, x, y:laneCenterY-boxH/2};
    x += boxW+gapX;
    return n;
  });
  const endCx = x+18, endCy=laneCenterY;
  const totalW = endCx+18+padX;
  const totalH = padTop*2+boxH;

  let s = `<svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" style="display:block;width:${totalW}px;height:${totalH}px;flex:none;">`;
  s += `<defs><marker id="bpmnArrowTop" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--text-tertiary)"/></marker></defs>`;
  s += `<circle cx="${startCx}" cy="${startCy}" r="18" fill="var(--bg)" stroke="var(--text)" stroke-width="1.6"/>`;
  if(nodes.length) s += `<line x1="${startCx+18}" y1="${startCy}" x2="${nodes[0].x}" y2="${nodes[0].y+boxH/2}" stroke="var(--text-tertiary)" stroke-width="1.4" marker-end="url(#bpmnArrowTop)"/>`;
  nodes.forEach((n,i)=>{
    s += `<g data-action="cj-bpmn-drill" data-stage="${n.stage.id}" style="cursor:pointer;">
      <title>${escapeHtml(n.stage.name)} — открыть внутренний процесс</title>
      <rect x="${n.x}" y="${n.y}" width="${boxW}" height="${boxH}" rx="10" fill="var(--stage-${n.stage.color})" stroke="var(--border-strong)" stroke-width="1.3"/>
      <text x="${n.x+boxW/2}" y="${n.y+boxH/2-2}" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--text)">${escapeHtml(n.stage.name)}</text>
      <text x="${n.x+boxW/2}" y="${n.y+boxH/2+16}" text-anchor="middle" font-size="11.5" fill="var(--text-secondary)">${escapeHtml(n.stage.biName||"")}</text>
      <rect x="${n.x+boxW/2-8}" y="${n.y+boxH-8}" width="16" height="16" rx="3" fill="var(--bg)" stroke="var(--border-strong)" stroke-width="1.2"/>
      <line x1="${n.x+boxW/2-4}" y1="${n.y+boxH}" x2="${n.x+boxW/2+4}" y2="${n.y+boxH}" stroke="var(--text-secondary)" stroke-width="1.3"/>
      <line x1="${n.x+boxW/2}" y1="${n.y+boxH-4}" x2="${n.x+boxW/2}" y2="${n.y+boxH+4}" stroke="var(--text-secondary)" stroke-width="1.3"/>
    </g>`;
    if(i<nodes.length-1){
      const next = nodes[i+1];
      s += `<line x1="${n.x+boxW}" y1="${n.y+boxH/2}" x2="${next.x}" y2="${next.y+boxH/2}" stroke="var(--text-tertiary)" stroke-width="1.4" marker-end="url(#bpmnArrowTop)"/>`;
    }
  });
  if(nodes.length){
    const last = nodes[nodes.length-1];
    s += `<line x1="${last.x+boxW}" y1="${last.y+boxH/2}" x2="${endCx-18}" y2="${endCy}" stroke="var(--text-tertiary)" stroke-width="1.4" marker-end="url(#bpmnArrowTop)"/>`;
  }
  s += `<circle cx="${endCx}" cy="${endCy}" r="18" fill="var(--bg)" stroke="var(--text)" stroke-width="3"/>`;
  s += `</svg>`;
  return s;
}

function CjBpmnStageDiagram(cj, stage){
  const boxW=180, boxH=80, gapX=48, padX=48, bandPad=16, laneH=180, bandLabelH=28, padTop=32;
  const biW=200;
  const laneY = padTop+bandLabelH;
  const laneCenterY = laneY+laneH/2;

  let x = padX;
  const startCx = x+18, startCy=laneCenterY;
  x += 36+gapX;
  const biX = x;
  x += biW+gapX;

  const steps = (stage.scenario||[]).map(t=>t.replace(/^\d+\.\s*/,""));
  const nodes = steps.map(text=>{
    const n = {text, x, y:laneCenterY-boxH/2};
    x += boxW+gapX;
    return n;
  });
  const endCx = x+18, endCy=laneCenterY;
  const totalW = endCx+18+padX;
  const totalH = laneY+laneH+40;

  let s = `<svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" style="display:block;width:${totalW}px;height:${totalH}px;flex:none;">`;
  s += `<defs><marker id="bpmnArrowStage" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--text-tertiary)"/></marker></defs>`;

  s += `<rect x="${padX-16}" y="${laneY}" width="${totalW-2*(padX-16)}" height="${laneH}" rx="10" fill="var(--bg-alt)" stroke="var(--border)"/>`;
  s += `<text x="${padX-6}" y="${laneY-10}" font-size="12" font-weight="700" fill="var(--text-tertiary)" style="text-transform:uppercase;">Клиент</text>`;

  s += `<rect x="${biX-bandPad}" y="${laneY+10}" width="${biW+bandPad*2}" height="${laneH-20}" rx="10" fill="var(--stage-${stage.color})" opacity=".55"/>`;
  s += `<text x="${biX-bandPad+10}" y="${laneY+26}" font-size="12" font-weight="700" fill="var(--text)">${escapeHtml(stage.name)}</text>`;

  s += `<circle cx="${startCx}" cy="${startCy}" r="18" fill="var(--bg)" stroke="var(--text)" stroke-width="1.6"/>`;
  s += `<line x1="${startCx+18}" y1="${startCy}" x2="${biX}" y2="${laneCenterY}" stroke="var(--text-tertiary)" stroke-width="1.4" marker-end="url(#bpmnArrowStage)"/>`;

  s += `<g><title>${escapeHtml(stage.biName||"")} (${escapeHtml(stage.biId||"")})</title>
    <rect x="${biX}" y="${laneCenterY-boxH/2}" width="${biW}" height="${boxH}" rx="10" fill="var(--bg)" stroke="var(--blue)" stroke-width="2"/>
    <text x="${biX+biW/2}" y="${laneCenterY-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--blue)">BI</text>
    ${bpmnWrapLines(stage.biName||"",22,2).map((l,li)=>`<text x="${biX+biW/2}" y="${laneCenterY+10+li*14}" text-anchor="middle" font-size="12" fill="var(--text)">${escapeHtml(l)}</text>`).join("")}
  </g>`;

  if(nodes.length){
    s += `<line x1="${biX+biW}" y1="${laneCenterY}" x2="${nodes[0].x}" y2="${nodes[0].y+boxH/2}" stroke="var(--text-tertiary)" stroke-width="1.4" marker-end="url(#bpmnArrowStage)"/>`;
  }
  nodes.forEach((n,i)=>{
    const lines = bpmnWrapLines(n.text, 24, 3);
    s += `<g><title>${escapeHtml(n.text)}</title>
      <rect x="${n.x}" y="${n.y}" width="${boxW}" height="${boxH}" rx="10" fill="var(--bg)" stroke="var(--border-strong)" stroke-width="1.3"/>
      ${lines.map((l,li)=>`<text x="${n.x+boxW/2}" y="${n.y+boxH/2 - (lines.length-1)*8 + li*16 + 5}" text-anchor="middle" font-size="12.5" fill="var(--text)">${escapeHtml(l)}</text>`).join("")}
    </g>`;
    if(i<nodes.length-1){
      const next = nodes[i+1];
      s += `<line x1="${n.x+boxW}" y1="${n.y+boxH/2}" x2="${next.x}" y2="${next.y+boxH/2}" stroke="var(--text-tertiary)" stroke-width="1.4" marker-end="url(#bpmnArrowStage)"/>`;
    }
  });
  const lastRightX = nodes.length ? nodes[nodes.length-1].x+boxW : biX+biW;
  s += `<line x1="${lastRightX}" y1="${laneCenterY}" x2="${endCx-18}" y2="${endCy}" stroke="var(--text-tertiary)" stroke-width="1.4" marker-end="url(#bpmnArrowStage)"/>`;
  s += `<circle cx="${endCx}" cy="${endCy}" r="18" fill="var(--bg)" stroke="var(--text)" stroke-width="3"/>`;
  s += `</svg>`;
  return s;
}

function filteredProjects(){
  return state.projects.filter(p=>{
    if(state.search && !p.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    const archQ = (state.archFilterFull || state.archFilter).replace(/…$/,"").trim().toLowerCase();
    if(archQ && !p.architect.toLowerCase().includes(archQ)) return false;
    if(state.statusFilter!=="Все" && p.status!==state.statusFilter) return false;
    if(state.onlyMine && !p.mine) return false;
    return true;
  });
}

const NAME_MAX = 219;
function openCreatePanel(){
  state.createPanel = {name:"", jira:"", error:null};
  render();
  setTimeout(()=>{ const el=document.getElementById("createNameInput"); if(el) el.focus(); },10);
}
function closeCreatePanel(){ state.createPanel=null; render(); }

function CreatePanel(){
  const cp = state.createPanel;
  const len = cp.name.length;
  const dup = state.projects.some(p=>p.name.trim().toLowerCase()===cp.name.trim().toLowerCase()) && cp.name.trim().length>0;
  const tooLong = len > NAME_MAX;
  const hasError = dup || tooLong;
  const counter = tooLong ? `${len}/0` : `${len}/${NAME_MAX}`;
  const canCreate = cp.name.trim().length>0 && !hasError;
  return `
    <div class="side-head">
      <h2>Создание проекта</h2>
      <button class="wizard-close" data-action="close-create">${icon("x")}</button>
    </div>
    <div class="side-body">
      <div class="field-block">
        <label class="field-label">Название проекта</label>
        <input class="input ${hasError?"error":""}" id="createNameInput" value="${escapeHtml(cp.name)}" placeholder="Введите название"/>
        <div style="display:flex;justify-content:space-between;margin-top:var(--space-2);">
          <span class="error-text">${dup ? "Проект с таким названием уже существует" : (tooLong ? "Превышено допустимое количество символов" : "")}</span>
          <span class="char-counter" style="margin:0;">${counter}</span>
        </div>
      </div>
      <div class="field-block">
        <label class="field-label" style="display:none;"></label>
        <input class="input" id="createJiraInput" value="${escapeHtml(cp.jira)}" placeholder="Ссылка на Jira task"/>
      </div>
    </div>
    <div class="side-foot">
      <button class="btn btn-outline" data-action="close-create">Закрыть</button>
      <button class="btn btn-primary" data-action="submit-create" ${canCreate?"":"disabled"}>Создать</button>
    </div>
  `;
}

function CreatePanelWrap(){
  const cp = state.createPanel;
  const enterCls = cp._entered ? "" : " enter";
  cp._entered = true;
  return `<div class="backdrop${enterCls}" data-action="close-create"></div><div class="side-panel${enterCls}">${CreatePanel()}</div>`;
}

function submitCreate(){
  const cp = state.createPanel;
  if(!cp || !cp.name.trim()) return;
  const p = freshProject(cp.name.trim(), "PROJ-" + Math.floor(1000+Math.random()*8999));
  state.projects.unshift(p);
  state.createPanel = null;
  go("project", {projectId:p.id});
  showToast("Проект создан");
}

function ucVerifyInterfaces(pid, ucId){
  const p = findProject(pid);
  const u = findUseCase(p, ucId);
  if(!u || !u.interfaces || !u.interfaces.length){
    showToast("Нет плановых интерфейсов для сверки");
    return;
  }
  u.verifying = true;
  render();
  setTimeout(()=>{
    let foundCount = 0;
    u.interfaces.forEach((iface, i)=>{
      if(iface.check !== "Не сверено") return;
      if(i % 2 === 0){
        iface.check = "Найден в архитектуре v2." + (4 + i);
        foundCount++;
        const scenario = u.scenarios.find(s=>s.api===iface.name && s.part===iface.part);
        if(scenario) scenario.status = "confirmed";
      } else {
        iface.check = "Не найден в архитектуре";
      }
    });
    u.verifying = false;
    render();
    setTimeout(bindTocScroll, 30);
    showToast(foundCount>0
      ? `Сверка завершена: ${foundCount} из ${u.interfaces.length} интерфейсов найдено в продуктовых архитектурах`
      : "Сверка завершена: совпадений с продуктовыми архитектурами не найдено");
  }, 900);
}

  {type:"validate", title:"Валидация HLD", desc:"Загрузить HLD и проверить полноту, согласованность и SLA относительно BeeAtlas", icon:"shield"},
  {type:"trace", title:"Сверка с требованиями", desc:"Построить матрицу трассировки HLD к исходным бизнес-требованиям", icon:"target"},
  {type:"arch", title:"Сверка с архитектурами систем", desc:"Сравнить решение HLD с детальными архитектурами дорабатываемых систем", icon:"layers"},

function reportSummary(type, r){
  if(type==="impact") return `${r.frChanges.length+r.nfrChanges.length} изменений требований, ${r.newTc.length} новых ТС`;
  if(type==="validate") return `Статус: ${r.overallStatus==="green"?"Зелёный":r.overallStatus==="yellow"?"Жёлтый":"Красный"}, KPI ${r.kpi}%`;
  if(type==="trace") return `${r.matrix.filter(x=>!x.mapped).length} требований без сопоставления`;
  if(type==="arch") return `${r.discrepancies.filter(x=>x.severity!=="green").length} расхождений`;
  return "";
}

function hldDiagramSvg(systems){
  const n = systems.length;
  const cx = 460, cy = 130, r = 105;
  const nodes = systems.map((s,i)=>{
    const a = (Math.PI*2*i/n) - Math.PI/2;
    return {x: cx + r*Math.cos(a), y: cy + r*Math.sin(a), name: s.code, isNew: s.status==="new"};
  });
  const center = {x:cx, y:cy};
  const lines = nodes.map(n=>`<line x1="${center.x}" y1="${center.y}" x2="${n.x}" y2="${n.y}" stroke="var(--border-strong)" stroke-width="1.5"/>`).join("");
  const dots = nodes.map(n=>`
    <g>
      <title>${escapeHtml(n.name)}</title>
      <circle cx="${n.x}" cy="${n.y}" r="30" fill="${n.isNew?'var(--orange-bg)':'var(--bg-alt)'}" stroke="${n.isNew?'#e8951a':'var(--border-strong)'}" stroke-width="1.5"/>
      <text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--text)">${escapeHtml(n.name.length>10?n.name.slice(0,9)+"…":n.name)}</text>
    </g>
  `).join("");
  return `<svg viewBox="0 0 920 260" style="width:100%;height:auto;display:block;">
    ${lines}
    <circle cx="${center.x}" cy="${center.y}" r="38" fill="var(--yellow)"/>
    <text x="${center.x}" y="${center.y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">Решение</text>
    ${dots}
  </svg>`;
}

/* toc scroll spy */
function bindTocScroll(){
  const containers = [document.getElementById("mainScroll"), document.querySelector(".wizard-body")].filter(Boolean);
  containers.forEach(scrollEl=>{
    const items = Array.from(scrollEl.querySelectorAll(".toc-item"));
    if(!items.length) return;
    scrollEl.onscroll = function(){
      let activeId = items[0].dataset.target;
      for(const it of items){
        const sec = document.getElementById(it.dataset.target);
        if(sec && sec.getBoundingClientRect().top - scrollEl.getBoundingClientRect().top < 140){
          activeId = it.dataset.target;
        }
      }
      items.forEach(it=>it.classList.toggle("active", it.dataset.target===activeId));
    };
  });
}

function WizardOverlay(){
  const w = state.wizard;
  const step = WIZARD_STEPS[w.stepIndex].key;
  const centerCls = w.loading ? " wizard-body-center" : "";
  const contentCentered = (step==="business" || w.loading) ? " centered" : "";
  return `<div class="wizard-overlay">
    <div class="wizard-head">
      <h2>Проведение оценки</h2>
      <button class="wizard-close" data-action="close-wizard">${icon("x")}</button>
    </div>
    <div class="wizard-body${centerCls}">
      <div class="wizard-stepper-wrap">${Stepper(w.stepIndex)}</div>
      <div class="wizard-step-content${contentCentered}">${WizardStepContent(w)}</div>
    </div>
    <div class="wizard-foot">${WizardStepFooter(w)}</div>
  </div>`;
}

function Stepper(activeIndex){
  return `<div class="stepper">
    ${WIZARD_STEPS.map((s,i)=>{
      const cls = i<activeIndex ? "done" : (i===activeIndex ? "active" : "");
      return `<div class="step ${cls}">
        <div class="circle">${i<activeIndex ? icon("check") : (i+1)}</div>
        <div class="stxt"><div class="s-lbl">Шаг ${i+1}</div><div class="s-name">${s.label}</div></div>
      </div>`;
    }).join("")}
  </div>`;
}

function WizardStepContent(w){
  const step = WIZARD_STEPS[w.stepIndex].key;
  if(w.loading){
    return WizardLoadingPanel(w);
  }
  if(step==="business") return WizardStepBusiness(w);
  if(step==="requirements") return WizardStepRequirements(w);
  if(step==="tc") return WizardStepTc(w);
  if(step==="result") return WizardStepResult(w);
  return "";
}

function WizardFooter(backAction, nextLabel, nextAction, nextDisabled){
  return `
    ${backAction ? `<button class="btn btn-outline" data-action="${backAction}">Назад</button>` : ""}
    <button class="btn btn-primary" data-action="${nextAction}" ${nextDisabled?"disabled":""}>${nextLabel}</button>
  `;
}

function WizardStepFooter(w){
  if(w.loading){
    return `
      <button class="btn btn-outline" data-action="wiz-back" ${w.stepIndex===0?"disabled":""}>Назад</button>
      <button class="btn btn-outline" data-action="wiz-abort-loading">Прервать</button>
    `;
  }
  const step = WIZARD_STEPS[w.stepIndex].key;
  const backBtn = step==="business" ? "" : `<button class="btn btn-outline" data-action="wiz-back">Назад</button>`;
  const restartBtn = `<button class="btn btn-outline" data-action="wiz-restart-step" data-step="${step}">Перезапустить шаг</button>`;
  if(step==="business"){
    const canGo = w.data.bpUrl.trim().length>0;
    return `${backBtn}${restartBtn}<button class="btn btn-primary" data-action="wiz-to-requirements" ${canGo?"":"disabled"}>Выявить требования</button>`;
  }
  if(step==="requirements") return `${backBtn}${restartBtn}<button class="btn btn-primary" data-action="wiz-to-tc">Выявить ТС</button>`;
  if(step==="tc") return `${backBtn}${restartBtn}<button class="btn btn-primary" data-action="wiz-to-result" ${w.data.tc.some(c=>c.decision)?"":"disabled"}>Провести оценку</button>`;
  if(step==="result"){
    return `
      ${backBtn}
      ${restartBtn}
      <button class="btn btn-outline" data-action="export">Экспорт</button>
      <button class="btn btn-primary" data-action="wiz-publish">Публикация в confluence</button>
    `;
  }
  return "";
}

/* Запускает переход/пересчёт шага визарда с экраном загрузки; applyFn выполняет фактическое
   изменение данных и должен сам проставить нужный w.stepIndex, если это переход на другой шаг. */
function startWizardLoading(info, delay, applyFn, doneMsg){
  const w = state.wizard;
  w.loading = true;
  w.loadingInfo = info;
  render();
  w.loadingTimer = setTimeout(()=>{
    w.loadingTimer = null;
    applyFn();
    w.loading = false;
    w.loadingInfo = null;
    render();
    if(doneMsg) showToast(doneMsg);
    setTimeout(bindTocScroll,30);
  }, delay);
}

/* Как startWizardLoading, но последовательно показывает несколько стадий (каждая — своя
   подпись/подзаголовок) перед применением результата — чтобы длительный анализ ощущался
   как процесс, а не как один короткий спиннер. */
function startWizardLoadingStaged(stages, applyFn, doneMsg){
  const w = state.wizard;
  w.loading = true;
  let i = 0;
  const nextStage = ()=>{
    if(i>=stages.length){
      w.loadingTimer = null;
      applyFn();
      w.loading = false;
      w.loadingInfo = null;
      render();
      if(doneMsg) showToast(doneMsg);
      setTimeout(bindTocScroll,30);
      return;
    }
    w.loadingInfo = stages[i];
    render();
    const delay = stages[i].delay || 700;
    i++;
    w.loadingTimer = setTimeout(nextStage, delay);
  };
  nextStage();
}

function finishAssessmentAndSave(){
  const w = state.wizard;
  const p = findProject(w.projectId);
  const a = {
    id: uid("as"),
    name: "Name-0" + ((p.agents.assessment.history.length||0) + (p.agents.assessment.current?1:0) + 1),
    author: ARCHITECT, date: NOW_DATE, tshirt:"L",
    fr: w.data.fr, nfr: w.data.nfr, questions: w.data.questions,
    tcCandidates: w.data.tc,
    bcTc: buildLegacyBcTc(w.data.tc),
    risks: RISKS,
  };
  if(p.agents.assessment.current){
    p.agents.assessment.history.unshift(p.agents.assessment.current);
  }
  p.agents.assessment.current = a;
  p.agents.assessment.status = "passed";
  p.assessmentScore = {label:"Средняя оценка L", level:"orange"};
  return a;
}

const HLD_WIZARD_STEPS = [
  {key:"sources", label:"Источники"},
  {key:"compose", label:"Состав каркаса"},

];

function startHldWizard(projectId){
  const p = findProject(projectId);
  if(!p) return;
  if(p.agents.assessment.status!=="passed"){
    showToast("Недостаточно данных: сначала проведите оценку требований в агенте «Оценка»");
    return;
  }
  const a = p.agents.assessment.current;
  state.hldWizard = {
    projectId,
    stepIndex:0,
    loading:false,
    data:{
      fr: a.fr.map(x=>Object.assign({},x)),
      nfr: a.nfr.map(x=>Object.assign({},x)),
      systems: HLD_SYSTEMS_POOL.map(x=>Object.assign({id:uid("sys"), checked:true},x)),
      tc: a.bcTc.map(x=>Object.assign({},x,{checked:true})),
      useCases: USE_CASES_POOL.map(x=>Object.assign({id:uid("uc")},x)),
      pageTitle: "HLD — " + p.name,
      parentUrl: "https://bwiki.beeline.ru/x/6wifFQ",

  const w = state.hldWizard;

function HldWizardStepFooter(w){
  if(w.loading) return "";
  const step = HLD_WIZARD_STEPS[w.stepIndex].key;
  if(step==="sources") return WizardFooter(null, "Сформировать каркас", "hldwiz-to-compose", false);
  if(step==="compose") return WizardFooter("hldwiz-back", "Перейти к публикации", "hldwiz-to-publish", false);
  if(step==="publish"){
    const canPublish = w.data.pageTitle.trim().length>0;
    return `
      <button class="btn btn-outline" data-action="hldwiz-back">Назад</button>
      <button class="btn btn-outline" data-action="export">${icon("upload")} Экспорт</button>
      <button class="btn btn-primary" data-action="hldwiz-publish" ${canPublish?"":"disabled"}>Опубликовать в Confluence</button>
    `;
  }
  return "";
}

function HldStepper(activeIndex){
  return `<div class="stepper">
    ${HLD_WIZARD_STEPS.map((s,i)=>{
      const cls = i<activeIndex ? "done" : (i===activeIndex ? "active" : "");
      return `<div class="step ${cls}">
        <div class="circle">${i<activeIndex ? icon("check") : (i+1)}</div>
        <div class="stxt"><div class="s-lbl">Шаг ${i+1}</div><div class="s-name">${s.label}</div></div>
      </div>`;
    }).join("")}
  </div>`;
}

function HldWizardStepContent(w){
  const step = HLD_WIZARD_STEPS[w.stepIndex].key;
  if(w.loading){
    return `<div class="search-loading" style="padding-top:var(--space-10);">
      <div class="spinner"></div>
      <div>Формирование каркаса…</div>
    </div>`;
  }
  if(step==="sources") return HldStepSources(w);
  if(step==="compose") return HldStepCompose(w);
  if(step==="publish") return HldStepPublish(w);
  return "";
}

/* ============================= HLD: ДОПОЛНИТЕЛЬНЫЕ ПРОВЕРКИ (панели + отчёты) ============================= */
function openHldFlow(type, projectId){
  state.sidePanel = {type:"hld-"+type, projectId, text:"", url:"", source:"url", fileName:"", loading:false};
  render();
}

function submitHldFlow(){
  const sp = state.sidePanel;
  const type = sp.type.replace("hld-","");
  sp.loading = true;
  render();
  setTimeout(()=>{
    const p = findProject(sp.projectId);
    let report;
    if(type==="impact") report = makeImpactReport();
    else if(type==="validate") report = makeValidateReport(sp.source==="file" ? (sp.fileName||"HLD.docx") : sp.url);
    else if(type==="trace") report = makeTraceReport();
    else if(type==="arch") report = makeArchReport();
    p.agents.hld.reports[type].unshift(report);
    state.sidePanel = null;
    go("hld-report", {projectId:sp.projectId, reportType:type, reportId:report.id});
    showToast(hldFlowDoneMsg(type, report));
  }, 1100);
}
function hldFlowDoneMsg(type, r){
  if(type==="impact") return "Impact-анализ завершён";
  if(type==="validate") return "Валидация завершена. Статус: " + (r.overallStatus==="green"?"Зелёный":r.overallStatus==="yellow"?"Жёлтый":"Красный");
  if(type==="trace") return "Сверка с требованиями завершена";
  if(type==="arch") return "Сверка с архитектурами систем завершена";
  return "";
}

/* ============================= WIZARD: ИМПОРТ USECASE ============================= */
const UC_WIZARD_STEPS = [
  {key:"setup", label:"Данные сценария"},
  {key:"import", label:"Процесс импорта"},
  {key:"result", label:"Разбор и решения"},
  {key:"outcome", label:"Результат"},
];

function startUcWizard(projectId){
  const p = findProject(projectId);
  if(!p) return;
  const nextNum = (p.useCases||[]).length + 1;
  state.ucWizard = {
    projectId,
    stepIndex: 0,
    loading: false,
    importing: false,
    timer: null,
    data:{
      mode:"new",
      ucCode: "UC-" + String(nextNum).padStart(3,"0"),
      ucName:"",
      existingUcId: (p.useCases && p.useCases[0]) ? p.useCases[0].id : "",
      cjStepCode:"",
      plantUml:"",
      stages: UC_IMPORT_STAGES.map(s=>Object.assign({status:"pending"}, s)),
      parts: [],
    },
  };
  render();
}
function ruPlural(n, one, few, many){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod100 > 10 && mod100 < 20) return many;
  if(mod10 === 1) return one;
  if(mod10 > 1 && mod10 < 5) return few;
  return many;
}

function closeUcWizard(){
  const w = state.ucWizard;
  if(!w) return;
  const step = UC_WIZARD_STEPS[w.stepIndex].key;
  if(step==="import" || step==="result" || step==="outcome") logUcInterruptedRun(w, step);
  if(w.timer) clearInterval(w.timer);
  state.ucWizard = null;
  render();
}

function logUcInterruptedRun(w, step){
  const p = findProject(w.projectId);
  if(!p) return;
  const existing = w.data.mode==="existing" ? findUseCase(p, w.data.existingUcId) : null;
  const code = w.data.mode==="new" ? w.data.ucCode : (existing ? existing.code : w.data.ucCode);
  let notices;
  if(step==="import"){
    const runningStage = w.data.stages.find(s=>s.status==="running") || w.data.stages.slice().reverse().find(s=>s.status==="done") || w.data.stages[0];
    notices = ["Импорт прерван пользователем на этапе «" + runningStage.label + "»"];
  } else if(step==="result"){
    const unresolvedCount = w.data.parts.filter(x=>!x.mapped && !x.decision).length;
    notices = [unresolvedCount
      ? `Импорт прерван пользователем на этапе «Разбор и решения» — ${unresolvedCount} ${ruPlural(unresolvedCount,"часть","части","частей")} без решения`
      : "Импорт прерван пользователем на этапе «Разбор и решения» до подтверждения применения"];
  } else {
    notices = ["Импорт прерван пользователем на этапе «Результат» до подтверждения применения сценария"];
  }
  p.ucImportRuns = p.ucImportRuns || [];
  p.ucImportRuns.push({
    id: uid("run"), ucCode: code, date: NOW_DATE, source:"Ручной импорт (PlantUML)", status:"Прерван",
    rawPlantUml: w.data.plantUml, notices,
  });
}

function UcStepper(activeIndex){
  return `<div class="stepper">
    ${UC_WIZARD_STEPS.map((s,i)=>{
      const cls = i<activeIndex ? "done" : (i===activeIndex ? "active" : "");
      return `<div class="step ${cls}">

function UcWizardStepContent(w){
  const step = UC_WIZARD_STEPS[w.stepIndex].key;
  if(w.loading){
    return `<div class="search-loading" style="padding-top:var(--space-10);"><div class="spinner"></div><div>Обработка…</div></div>`;
  }
  if(step==="setup") return UcStepSetup(w);
  if(step==="import") return UcStepImport(w);
  if(step==="result") return UcStepResult(w);
  if(step==="outcome") return UcStepOutcome(w);
  return "";
}

function UcWizardStepFooter(w){
  if(w.loading) return "";
  const step = UC_WIZARD_STEPS[w.stepIndex].key;
  if(step==="setup"){
    const modeOk = w.data.mode==="new" ? w.data.ucName.trim().length>0 : !!w.data.existingUcId;
    const canGo = modeOk && w.data.plantUml.trim().length>0;
    return WizardFooter(null, "Импорт в Staging", "uc-wiz-to-import", !canGo);
  }
  if(step==="import"){
    return `<button class="btn btn-outline" data-action="uc-abort-import">Прервать импорт</button>`;
  }
  if(step==="result"){
    const unresolvedCount = w.data.parts.filter(x=>!x.mapped && !x.decision).length;
    const hint = unresolvedCount
      ? `Осталось ${unresolvedCount} ${ruPlural(unresolvedCount,"часть","части","частей")} без решения`
      : "Все части разрешены — можно перейти к результату";
    return `
      <span style="margin-right:auto;font-size:13px;color:var(--text-secondary);align-self:center;">${hint}</span>
      <button class="btn btn-outline" data-action="uc-wiz-restart">Переделать сценарий</button>
      <button class="btn btn-primary" data-action="uc-wiz-to-outcome" ${unresolvedCount?"disabled":""}>Далее</button>
    `;
  }
  if(step==="outcome"){
    return `
      <button class="btn btn-outline" data-action="uc-wiz-restart">Переделать сценарий</button>
      <button class="btn btn-primary" data-action="uc-confirm-apply">Применить сценарий</button>

  }
  return "";
}

function ucDerivedScenarios(parts){
  return parts.map(x=>{
    if(x.mapped && !x.dynamicCode) x.dynamicCode = "SEQ-" + Math.floor(10+Math.random()*89);
    return {
      part: x.part, participant: x.participant, action: x.action, api: x.api, call: x.call,
      tcName: x.mapped ? x.tcName : (x.tcName || null),
      tcCode: x.mapped ? x.tcCode : (x.tcCode || null),
      dynamic: x.mapped ? x.dynamicCode : (x.dynamic || null),
      status: x.mapped ? "confirmed" : x.decision,
    };
  });
}

function ucDerivedPlannedInterfaces(parts){
  return parts.filter(x=>x.decision==="planned").map(x=>({
    name: x.api, part: x.part, check:"Не сверено",
    bc: x.bc || null, containerName: x.containerName || null, interfaceCode: x.interfaceCode || null, protocol: x.protocol || null,
  }));
}

function ucPreviewFromWizard(w){
  const p = findProject(w.projectId);

  const stepMeta = d.cjStepCode ? CJ_STEP_POOL.find(s=>s.code===d.cjStepCode) : null;
  const existing = d.mode==="existing" ? findUseCase(p, d.existingUcId) : null;
  return {
    name: d.mode==="new" ? d.ucName.trim() : (existing ? existing.name : ""),
    source: "Ручной импорт", updated: NOW_DATE,
    cj: stepMeta ? {code:stepMeta.cjCode, name:stepMeta.cjName} : {code:"—", name:"Без привязки к CJ"},
    cjStep: stepMeta ? {code:stepMeta.code, name:stepMeta.name} : {code:"—", name:"—"},
    scenarios: ucDerivedScenarios(d.parts),
    interfaces: (d.mode==="existing" && existing ? (existing.interfaces||[]) : []).concat(ucDerivedPlannedInterfaces(d.parts)),
  };
}

function ucWizardRestart(){
  const w = state.ucWizard;
  w.data.parts = [];
  w.data.stages = UC_IMPORT_STAGES.map(s=>Object.assign({status:"pending"}, s));
  w.stepIndex = UC_WIZARD_STEPS.findIndex(s=>s.key==="setup");
  render();
}

function ucWizardRunImport(){
  const w = state.ucWizard;
  w.stepIndex = UC_WIZARD_STEPS.findIndex(s=>s.key==="import");
  w.data.stages = UC_IMPORT_STAGES.map(s=>Object.assign({status:"pending"}, s));
  w.data.stages[0].status = "running";
  w.importing = true;
  render();
  let i = 0;
  w.timer = setInterval(()=>{
    w.data.stages[i].status = "done";
    i++;
    if(i < w.data.stages.length){
      w.data.stages[i].status = "running";
      render();
    } else {
      clearInterval(w.timer);
      w.timer = null;
      w.importing = false;
      w.data.parts = UC_IMPORT_PART_POOL.map((x,idx)=>Object.assign({id:uid("part"), part:"P-0"+(idx+1)}, x));
      w.stepIndex = UC_WIZARD_STEPS.findIndex(s=>s.key==="result");
      render();
      setTimeout(bindTocScroll,30);
    }
  }, 650);
}

function ucConfirmApply(){
  const w = state.ucWizard;
  const p = findProject(w.projectId);
  const d = w.data;
  const stepMeta = d.cjStepCode ? CJ_STEP_POOL.find(s=>s.code===d.cjStepCode) : null;

  const scenarios = ucDerivedScenarios(d.parts);
  const newInterfaces = ucDerivedPlannedInterfaces(d.parts);

  const notices = d.parts.filter(x=>!x.mapped).map(x=>{
    if(x.decision==="specified") return `${x.part}: указан существующий интерфейс архитектором (${x.api})`;
    if(x.decision==="planned") return `${x.part}: отмечен как плановый интерфейс (${x.api})`;
    return `${x.part}: ${x.note || "часть не сопоставлена"}`;
  });
  if(!notices.length) notices.push("Все части сопоставлены с известными системами ландшафта автоматически");

  let uc, code;
  if(d.mode==="existing"){
    uc = findUseCase(p, d.existingUcId);
    uc.scenarios = scenarios;
    uc.interfaces = (uc.interfaces||[]).concat(newInterfaces);
    uc.updated = NOW_DATE;
    uc.rawPlantUml = d.plantUml;
    if(stepMeta){ uc.cj = {code:stepMeta.cjCode, name:stepMeta.cjName}; uc.cjStep = {code:stepMeta.code, name:stepMeta.name}; }
    code = uc.code;
  } else {
    code = d.ucCode;
    uc = {
      id: uid("uc"), code, name: d.ucName.trim(), status:"published", source:"Ручной импорт",
      updated: NOW_DATE,
      cj: stepMeta ? {code:stepMeta.cjCode, name:stepMeta.cjName} : {code:"—", name:"Без привязки к CJ"},
      cjStep: stepMeta ? {code:stepMeta.code, name:stepMeta.name} : {code:"—", name:"—"},
      scenarios, interfaces:newInterfaces, rawPlantUml:d.plantUml,
    };
    p.useCases = p.useCases || [];
    p.useCases.unshift(uc);
  }

  const run = {
    id: uid("run"), ucCode: code, date: NOW_DATE, source:"Ручной импорт (PlantUML)", status:"Применён",
    rawPlantUml: d.plantUml, notices,
  };
  p.ucImportRuns = p.ucImportRuns || [];
  p.ucImportRuns.push(run);

  const projectId = p.id, ucId = uc.id;
  state.ucWizard = null;
  showToast("Сценарий применён в канонической модели BeeAtlas");
  openUseCase(projectId, ucId);
}

function toggleResultSelect(id){

/* Кладёт вручную найденные ТС в синтетическую родительскую ВС «Добавлено вручную»,
   чтобы они отображались так же, как ТС, найденные при анализе каталога (ВС → вложенные ТС). */
function addManualReuseIntoCandidate(c, chosen){
  c.bcMatches = c.bcMatches || [];
  let manualBc = c.bcMatches.find(bc=>bc.code===MANUAL_BC_CODE);
  if(!manualBc){
    manualBc = {code:MANUAL_BC_CODE, name:MANUAL_BC_NAME, match:100, desc:"", expanded:true, tcNested:[]};
    c.bcMatches.push(manualBc);
  }
  manualBc.expanded = true;
  c.reuseTargets = c.reuseTargets || [];
  chosen.forEach(r=>{
    manualBc.tcNested.push({code:r.code, name:r.name, match:100, system:r.code.split(" ")[0], desc:""});
    c.reuseTargets.push({code:r.code, name:r.name, match:100, system:r.code.split(" ")[0], bcCode:MANUAL_BC_CODE, bcName:MANUAL_BC_NAME});
  });
  c.decision = "reuse";
  c.analyzed = true;
}
function submitAddResults(){
  const sp = state.sidePanel;
  const chosen = (sp.results||[]).filter(r=>sp.selected[r.id]);
  if(!chosen.length) return;
  let landedId;
  if(sp.candidateId){
    const c = state.wizard.data.tc.find(x=>x.id===sp.candidateId);
    if(c){
      addManualReuseIntoCandidate(c, chosen);
      landedId = c.id;
      showToast("ТС добавлена в кандидата «" + c.name + "»");
    }
  } else {
    chosen.forEach(r=>{
      const cand = {
        id: uid("cand"), name: r.name, taskDesc:"", fr:[],
        analyzed:false, decision:null, system:null, bcMatches:[],
      };
      addManualReuseIntoCandidate(cand, [r]);
      state.wizard.data.tc.push(cand);
      landedId = cand.id;
    });
    showToast("Новый кандидат ТС добавлен в конец списка");
  }
  state.sidePanel = null;
  render();
  if(landedId){
    setTimeout(()=>{
      const el = document.getElementById("cand-"+landedId);
      if(el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"center"});
    }, 30);
  }
}

/* Remember which page/tab the user is on, so a browser refresh reopens the same
   place instead of bouncing back to Home. Only navigation-shaped fields are kept —
   never modals/wizards/search-in-progress, and never a "projects" deep-link (project
   IDs are regenerated by seed() on every load, so a remembered project/assessment/
   report id would point at nothing after a refresh — the projects list is safe). */
const LOCATION_KEY = "beeatlas_location_v1";
function saveLocation(){
  try{
    const snapshot = {
      activeSidebar: state.activeSidebar,
      route: state.route && state.route.view==="projects" ? state.route : null,
      appcat: {
        detailId: state.appcat.detailId,
        tab: state.appcat.tab,
        generalSub: state.appcat.generalSub,
        fitnessSub: state.appcat.fitnessSub,
        ifaceMode: state.appcat.ifaceMode,
        techDetail: state.appcat.techDetail,
      },
    };
    sessionStorage.setItem(LOCATION_KEY, JSON.stringify(snapshot));
  } catch(e){}
}
function loadLocation(){
  try{
    const raw = sessionStorage.getItem(LOCATION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

let searchDebTimer=null;
let archDebTimer=null;
function bindGlobalEvents(){
  document.body.onclick = function(e){
    const t = e.target.closest("[data-action]");
    if(!t) {
      // close popovers on outside click
      if(state.popover){ state.popover=null; render(); }
      return;
    }
    const action = t.dataset.action;
    handleAction(action, t, e);
  };
  document.body.onmousedown = function(e){
    const handle = e.target.closest('[data-resize="graph-detail"]');
    if(!handle) return;
    e.preventDefault();
    const startX = e.clientX;
    const startWidth = state.graph.detailWidth;
    const panel = document.getElementById("graphDetailOuter");
    const clamp = w => Math.max(280, Math.min(640, w));
    function onMove(ev){
      const w = clamp(startWidth + (startX - ev.clientX));
      if(panel) panel.style.width = w + "px";
    }
    function onUp(ev){
      state.graph.detailWidth = clamp(startWidth + (startX - ev.clientX));
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      render();
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  };
  document.body.oninput = function(e){
    handleInput(e.target);
  };
  document.body.onkeydown = function(e){
    if(e.key === "Escape"){
      if(state.cjSourcePanel){ state.cjSourcePanel=null; render(); }
      else if(state.cjMergePanel){ state.cjMergePanel=null; render(); }
      else if(state.cjBranchPanel){ state.cjBranchPanel=null; render(); }
      else if(state.cjBranchDeleteConfirm){ state.cjBranchDeleteConfirm=null; render(); }
      else if(state.cjBpmnOpen){ state.cjBpmnOpen=false; state.cjBpmnStage=null; render(); }
      else if(state.cjCreatePanel){ state.cjCreatePanel=null; render(); }
      else if(state.cjFiltersOpen){ state.cjFiltersOpen=false; render(); }
      else if(state.cjVersionsOpen){ state.cjVersionsOpen=false; render(); }
      else if(state.cjOpen){ state.cjOpen=null; render(); }
      else if(state.sidePanel){ state.sidePanel=null; render(); }
      else if(state.createPanel){ state.createPanel=null; render(); }
      else if(state.wizard){ /* keep wizard open on escape to avoid accidental loss */ }
    }
  };

  document.body.addEventListener("dragover", function(e){
    if(e.target.closest && e.target.closest('[data-dropzone="bpmn"]')){
      e.preventDefault();
      if(state.cjCreatePanel && !state.cjCreatePanel.dragOver){ state.cjCreatePanel.dragOver = true; render(); }
    }
  });
  document.body.addEventListener("dragleave", function(e){
    if(e.target.closest && e.target.closest('[data-dropzone="bpmn"]')){
      if(state.cjCreatePanel && state.cjCreatePanel.dragOver){ state.cjCreatePanel.dragOver = false; render(); }
    }
  });
  document.body.addEventListener("drop", function(e){
    if(e.target.closest && e.target.closest('[data-dropzone="bpmn"]')){
      e.preventDefault();
      if(state.cjCreatePanel){
        state.cjCreatePanel.dragOver = false;
        const f = e.dataTransfer.files && e.dataTransfer.files[0];
        if(f) state.cjCreatePanel.bpmnFile = f.name;
        render();
      }
    }
  });

  const searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.addEventListener("focus", ()=>{ state.searchOpen = state.search.length>0; render(); reFocus("searchInput"); });
  }
  const archInputEl = document.getElementById("archInput");
  if(archInputEl){
    archInputEl.addEventListener("focus", ()=>{ state.archOpen = state.archFilter.length>0; state.archFocused=true; render(); reFocus("archInput"); });
    archInputEl.addEventListener("blur", ()=>{ state.archFocused=false; render(); });
  }
  bindTocScroll();
  const dropTarget = document.querySelector(".side-panel .side-body");
  if(dropTarget) dropTarget.scrollTop = 0;
  initAcTabsScroll();
}

function syncAcTabsWrap(wrap){
  const track = wrap.querySelector(".ac-tabs-track");
  if(!track) return;
  const max = track.scrollWidth - track.clientWidth;
  wrap.classList.toggle("can-left", track.scrollLeft > 4);
  wrap.classList.toggle("can-right", track.scrollLeft < max - 4);
}
function initAcTabsScroll(){
  document.querySelectorAll(".ac-tabs-wrap").forEach(wrap=>{
    const track = wrap.querySelector(".ac-tabs-track");
    if(!track) return;
    // every render() replaces this DOM node from scratch (scrollLeft resets to 0) —
    // re-align the strip on the active tab instead of snapping back to the start.
    const active = track.querySelector(".page-tab.active");
    if(active) active.scrollIntoView({block:"nearest", inline:"nearest"});
    syncAcTabsWrap(wrap);
    track.addEventListener("scroll", ()=>syncAcTabsWrap(wrap), {passive:true});
  });
}

function reFocus(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); const v=el.value; el.value=""; el.value=v; }
}

    clearTimeout(searchDebTimer);

    state.archFilter = el.value;
    state.archFilterFull = "";
    clearTimeout(archDebTimer);
