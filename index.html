<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>beeatlas (прототип)</title>
<style>
  /* Design tokens sourced from the Yellowbe design platform (yellowbe.beeline.ru/backoffice/tokens),
     mapped onto this file's existing variable names so every component that already
     consumes them picks up the real brand values without a markup rewrite. */
  :root{
    --bg:#ffffff;
    --bg-alt:#f9f9f9;
    --sidebar-bg:#ffffff;
    --border:rgba(25,28,52,.12);
    --border-strong:rgba(25,28,52,.18);
    --text:rgba(9,11,22,.94);
    --text-secondary:rgba(25,28,52,.7);
    --text-tertiary:rgba(25,28,52,.48);
    --yellow:#fdd835;
    --yellow-hover:#fdc435;
    --yellow-disabled:#fce780;
    --blue:#1a73e8;
    --green-bg:#e7f6eb; --green-text:#2ca853; --green-border:#bcdfc4;
    --gray-bg:#f1f1f3; --gray-text:#5e6071;
    --orange-bg:#fff4e1; --orange-text:#ff9419; --orange-border:#f5d8a3;
    --blue-bg:#e3f2ff; --blue-text:#1a73e8;
    --red-bg:#ffecef; --red-text:#ff5555;
    --pink-bg:#fae4f7; --pink-text:#bc00b8;
    --input-bg:rgba(25,28,52,.1);
    --shadow: 0px 6px 38px rgba(0,0,0,.16), 0px 0px 10px rgba(0,0,0,.08);
    --shadow-sm: 0px 2px 10px rgba(0,0,0,.08), 0px 2px 8px rgba(0,0,0,.08);
    --radius: 16px;
    --radius-sm: 12px;
    --header-h: 64px;
    --sidebar-w: 272px;
    /* spacing scale — 4px grid (Yellowbe size-spacing-x1..x10), use for padding/margin/gap everywhere */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-7: 32px;
    --space-8: 40px;
    --space-9: 64px;
    --space-10: 96px;
    --stage-c1:#e3f5e8;
    --stage-c2:#fbf3d4;
    --stage-c3:#f8e3f5;
    --stage-c4:#e0edfb;
  }
  [data-theme="dark"]{
    --bg:#141414;
    --bg-alt:#212121;
    --sidebar-bg:#0f0f0f;
    --border:rgba(255,255,255,.2);
    --stage-c1:#1c3324;
    --stage-c2:#3a3018;
    --stage-c3:#38203a;
    --stage-c4:#1c2c3f;
    --border-strong:rgba(255,255,255,.48);
    --text:rgba(255,255,255,.87);
    --text-secondary:rgba(255,255,255,.6);
    --text-tertiary:rgba(255,255,255,.38);
    --blue:#5cb5ff;
    --green-bg:#10301a; --green-text:#78ce8e; --green-border:#1e4a2c;
    --gray-bg:#36383c; --gray-text:#d1d2d6;
    --orange-bg:#3d392a; --orange-text:#ffbd55; --orange-border:#5a5237;
    --blue-bg:#132338; --blue-text:#5cb5ff;
    --red-bg:#371313; --red-text:#f37678;
    --pink-bg:#370f37; --pink-text:#df59d1;
    --input-bg:rgba(255,255,255,.14);
    --shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Beeline Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  svg{width:20px;height:20px;flex:0 0 auto;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:#ffe58a;}

  /* ---------- Layout shell ---------- */
  #app{display:flex;flex-direction:column;height:100vh;}
  .header{
    height:var(--header-h);
    flex:0 0 auto;
    display:flex;align-items:center;
    padding:0 var(--space-7);
    border-bottom:1px solid var(--border);
    gap:var(--space-7);
    background:var(--bg);
    position:relative;
    z-index:20;
  }
  .brand{display:flex;align-items:center;gap:var(--space-3);font-weight:700;font-size:20px;white-space:nowrap;}
  .header-spacer{flex:1;}
  .header-right{display:flex;align-items:center;gap:var(--space-6);}
  .header-link{display:flex;align-items:center;gap:var(--space-2);color:var(--blue);font-size:14.5px;font-weight:500;}
  .header-link svg{width:17px;height:17px;}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;border:none;background:transparent;
    display:inline-flex;align-items:center;justify-content:center;color:var(--text);
    position:relative;
  }
  .icon-btn:hover{background:var(--bg-alt);}
  .icon-btn svg{width:20px;height:20px;}
  .avatar{
    width:36px;height:36px;border-radius:50%;background:#ff7a45;color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;
  }
  .popover{
    position:absolute; top:52px; right:0; background:var(--bg); border:1px solid var(--border);
    border-radius:var(--radius-sm); box-shadow:var(--shadow); padding:var(--space-4); min-width:220px; z-index:50;
    font-size:14px;
  }
  .popover .pv-title{font-weight:600;margin-bottom:var(--space-2);}
  .popover .pv-muted{color:var(--text-secondary);}
  .popover .pv-item{padding:var(--space-2) var(--space-2);border-radius:8px;}
  .popover .pv-item:hover{background:var(--bg-alt);}

  .body-row{flex:1;display:flex;min-height:0;}
  .sidebar{
    width:var(--sidebar-w); flex:0 0 auto; background:var(--sidebar-bg);
    border-right:1px solid var(--border); overflow-y:auto; padding:var(--space-5) var(--space-4) var(--space-8);
    transition:width .18s ease, padding .18s ease;
  }
  .sidebar.collapsed{width:64px;padding:var(--space-5) var(--space-3) var(--space-8);}
  .sidebar.collapsed .navlabel, .sidebar.collapsed .navtext{display:none;}
  .sidebar-toggle{
    width:32px;height:32px;border:none;background:transparent;border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:var(--text);margin-bottom:var(--space-5);
  }
  .sidebar-toggle:hover{background:var(--bg-alt);}
  .navgroup{margin-bottom:var(--space-6);}
  .navlabel{
    font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--text-tertiary);
    text-transform:uppercase;padding:0 var(--space-3);margin-bottom:var(--space-2);
  }
  .navitem{
    display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:9px;
    color:var(--text-secondary);font-size:14.5px;cursor:pointer;position:relative;
  }
  .navitem svg{width:19px;height:19px;flex:0 0 auto;margin-top:1px;}
  .navtext{white-space:normal;line-height:1.3;}
  .navitem:hover{background:var(--bg-alt);}
  .navitem.active{color:var(--text);font-weight:700;}
  .navitem.active::before{
    content:"";position:absolute;left:-14px;top:6px;bottom:6px;width:3px;background:var(--yellow);border-radius:3px;
  }
  .sidebar.collapsed .navitem.active::before{left:-10px;}

  .main{flex:1;min-width:0;overflow-y:auto;background:var(--bg);}
  .page{max-width:1360px;margin:0 auto;padding:var(--space-7);}
  .page.page-full{max-width:none;margin:0;padding:0;height:100%;display:flex;flex-direction:column;}

  /* ---------- Home page ---------- */
  .home-search-row{display:flex;gap:var(--space-4);margin-bottom:var(--space-4);}
  .home-search-box{flex:1;display:flex;align-items:center;gap:var(--space-3);background:var(--bg-alt);border-radius:var(--radius);padding:0 var(--space-5);}
  .home-search-box svg{color:var(--text-tertiary);flex:0 0 auto;}
  .home-search-input{flex:1;border:none;background:transparent;font-size:16px;color:var(--text);outline:none;padding:var(--space-4) 0;}
  .home-search-input::placeholder{color:var(--text-tertiary);}
  .home-search-send{width:52px;height:52px;border-radius:var(--radius);border:none;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .home-search-send:hover{opacity:.88;}
  .home-search-send svg{width:19px;height:19px;}
  .home-chip-row{display:flex;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-9);}
  .home-chip{border:1px solid var(--border-strong);border-radius:999px;padding:var(--space-2) var(--space-5);font-size:14px;color:var(--text-secondary);white-space:nowrap;cursor:pointer;background:var(--bg);}
  .home-chip:hover{background:var(--bg-alt);}
  .home-chip.active{background:var(--yellow);border-color:var(--yellow);color:rgba(0,0,0,.87);font-weight:600;}
  .home-h2{font-size:22px;margin:0 0 var(--space-5);}
  .home-mine-row{display:flex;gap:var(--space-5);margin-bottom:var(--space-9);flex-wrap:wrap;}
  .home-mine-card{flex:1;min-width:260px;}
  .home-mine-title{font-weight:700;font-size:16px;margin-bottom:var(--space-4);}
  .home-mine-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);}
  .home-mine-title-row .home-mine-title{margin-bottom:0;}
  .home-mine-app-row{display:flex;align-items:center;gap:var(--space-2);}
  .home-mine-app-row svg{width:16px;height:16px;color:var(--text-tertiary);}
  .home-mine-more{display:flex;align-items:center;gap:4px;color:var(--blue);font-size:14px;cursor:pointer;margin-top:var(--space-5);}
  .home-mine-more svg{width:14px;height:14px;}
  .home-mine-more:hover{text-decoration:underline;}
  .home-mine-list{margin:var(--space-2) 0 0;padding-left:var(--space-5);font-size:14.5px;line-height:1.9;}

  .home-services-columns{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-6);align-items:stretch;}
  @media (max-width:1200px){ .home-services-columns{grid-template-columns:repeat(2,1fr);} }
  .home-group-col{display:flex;flex-direction:column;gap:var(--space-6);}
  .home-group-card{display:block;}
  .home-group-title{font-weight:700;font-size:16px;margin-bottom:var(--space-4);}
  .home-svc-row{display:flex;gap:var(--space-4);padding:var(--space-3);margin:0 calc(var(--space-3) * -1);border-radius:var(--radius-sm);cursor:pointer;}
  .home-svc-row:hover{background:var(--bg-alt);}
  .home-svc-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .home-svc-icon svg{width:20px;height:20px;}
  .home-svc-pink{background:var(--pink-bg);color:var(--pink-text);}
  .home-svc-orange{background:var(--orange-bg);color:var(--orange-text);}
  .home-svc-blue{background:var(--blue-bg);color:var(--blue-text);}
  .home-svc-green{background:var(--green-bg);color:var(--green-text);}
  .home-svc-gray{background:var(--gray-bg);color:var(--gray-text);}
  .home-svc-title{font-weight:700;font-size:15px;margin-bottom:var(--space-1);}
  .home-svc-soon{font-size:11px;font-weight:600;color:var(--text-tertiary);background:var(--gray-bg);border-radius:6px;padding:2px 6px;margin-left:var(--space-2);vertical-align:middle;}
  .home-svc-desc{font-size:13.5px;color:var(--text-secondary);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .breadcrumb{display:flex;align-items:center;gap:var(--space-2);color:var(--blue);font-size:14.5px;margin-bottom:var(--space-4);flex-wrap:wrap;}
  .breadcrumb .sep{color:var(--text-tertiary);}
  .breadcrumb .current{color:var(--text-secondary);}
  .breadcrumb a:hover{text-decoration:underline;}

  .page-title-row{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6);}
  .page-title-row h1{font-size:28px;margin:0;}
  .page-title-row .actions{margin-left:auto;display:flex;gap:var(--space-3);}

  .badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 var(--space-2);border-radius:12px;font-size:13px;font-weight:500;white-space:nowrap;}
  .badge svg{width:13px;height:13px;}
  .badge.green{background:var(--green-bg);color:var(--green-text);}
  .badge.gray{background:var(--gray-bg);color:var(--gray-text);}
  .badge.orange{background:var(--orange-bg);color:var(--orange-text);}
  .badge.blue{background:var(--blue-bg);color:var(--blue-text);}
  .badge.red{background:var(--red-bg);color:var(--red-text);}
  .badge.pink{background:var(--pink-bg);color:var(--pink-text);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
    border-radius:var(--radius-sm);border:1px solid transparent;padding:var(--space-3) var(--space-5);font-size:14.5px;font-weight:500;
    background:var(--bg-alt);color:var(--text);white-space:nowrap;
  }
  .btn svg{width:17px;height:17px;}
  .btn-primary{background:var(--yellow);color:rgba(0,0,0,.87);}
  .btn-primary:hover{background:var(--yellow-hover);}
  .btn-primary:disabled{background:var(--yellow-disabled);color:#9a8a3a;cursor:not-allowed;}
  .btn-outline{background:var(--bg);border:1px solid var(--border-strong);color:var(--text);}
  .btn-outline:hover{background:var(--bg-alt);}
  .btn-outline:disabled{color:var(--text-tertiary);border-color:var(--border);cursor:not-allowed;}
  .btn-outline:disabled:hover{background:var(--bg);}
  .btn-ghost{background:transparent;color:var(--text);}
  .btn-ghost:hover{background:var(--bg-alt);}
  .btn-ghost:disabled{color:var(--text-tertiary);cursor:not-allowed;}
  .btn-ghost:disabled:hover{background:transparent;}
  .btn-sm{padding:var(--space-2) var(--space-4);font-size:13.5px;border-radius:9px;}
  .btn-icon-only{padding:var(--space-3);width:44px;}

  .field-label{font-size:13px;color:var(--text-secondary);margin-bottom:var(--space-2);display:block;}
  .input, .textarea, .select{
    width:100%;border:1px solid transparent;background:var(--input-bg);border-radius:var(--radius-sm);
    padding:var(--space-3) var(--space-4);font-size:15px;color:var(--text);outline:none;
  }
  .input::placeholder, .textarea::placeholder{color:var(--text-tertiary);}
  .input.error, .textarea.error{border-color:var(--red-text);background:var(--red-bg);}
  [data-theme="dark"] .input.error, [data-theme="dark"] .textarea.error{background:#2a1616;}
  .error-text{color:#e5484d;font-size:12.5px;margin-top:var(--space-2);}
  .textarea{resize:vertical;min-height:110px;line-height:1.5;}
  .char-counter{font-size:12px;color:var(--text-tertiary);text-align:right;margin-top:var(--space-2);}
  .field-block{margin-bottom:var(--space-5);}
  .field-with-icon{position:relative;}
  .field-with-icon svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-tertiary);}
  .field-with-icon .input{padding-left:var(--space-8);}
  .field-with-icon .clear-x{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text-tertiary);width:20px;height:20px;display:flex;align-items:center;justify-content:center;}

  /* floating-label field (used in Архитектор filter, create/publish panels) */
  .ffield{position:relative;}
  .ffield-label{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text-tertiary);
    pointer-events:none;transition:top .1s ease,font-size .1s ease,transform .1s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 32px);
  }
  .ffield.filled .ffield-label{top:15px;font-size:12px;color:var(--text-secondary);transform:none;}
  .ffield .ffield-input{padding-top:var(--space-3);padding-bottom:var(--space-3);position:relative;background:transparent;}
  .ffield.filled .ffield-input{padding-top:var(--space-6);padding-bottom:var(--space-2);}
  .ffield-box{background:var(--input-bg);border-radius:11px;border:1px solid transparent;}
  .ffield-box.focus{background:var(--bg);border-color:var(--text);}

  /* filters row */
  .filters-row{display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap;}
  .filters-row .search-wrap{flex:1;min-width:260px;position:relative;}
  .filters-row .arch-input{width:230px;}
  .select-wrap{position:relative;width:180px;}
  .select-wrap select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-top:var(--space-6);padding-bottom:var(--space-2);padding-right:var(--space-8);}
  .select-wrap svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;pointer-events:none;color:var(--text-secondary);}
  .select-wrap .ffield-label{top:15px;font-size:12px;color:var(--text-secondary);transform:none;}
  .archsuggest-item{padding:var(--space-3) var(--space-5);cursor:pointer;}
  .archsuggest-item:hover{background:var(--bg-alt);}
  .archsuggest-item .a-name{font-weight:700;font-size:14.5px;}
  .archsuggest-item .a-email{font-size:12.5px;color:var(--text-secondary);margin-top:var(--space-1);}
  .toggle-wrap{display:flex;align-items:center;gap:var(--space-3);white-space:nowrap;font-size:14.5px;}
  .toggle{width:38px;height:22px;border-radius:20px;background:var(--gray-bg);position:relative;cursor:pointer;border:1px solid var(--border-strong);flex:0 0 auto;}
  .toggle.on{background:var(--yellow);border-color:var(--yellow);}
  .toggle .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle.on .knob{left:18px;}
  .reset-link{color:var(--blue);font-size:14px;cursor:pointer;white-space:nowrap;}
  .reset-link:hover{text-decoration:underline;}

  .suggest-dropdown{
    position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg);
    border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);
    z-index:30;overflow:hidden;
  }
  .suggest-loading{padding:var(--space-6);color:var(--text-secondary);font-size:14.5px;}
  .suggest-empty{padding:var(--space-6);color:var(--text-secondary);font-size:14.5px;}
  .suggest-item{padding:var(--space-3) var(--space-5);cursor:pointer;display:flex;align-items:center;gap:var(--space-3);}
  .suggest-item:hover{background:var(--bg-alt);}
  .suggest-item svg{width:16px;height:16px;color:var(--text-tertiary);flex:0 0 auto;}
  .suggest-item .s-name{font-size:14.5px;color:var(--text);}

  /* table */
  .table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;overflow-y:hidden;}
  table{width:100%;border-collapse:collapse;font-size:14.5px;}
  thead th{
    text-align:left;font-weight:700;font-size:14px;color:var(--text);
    padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap;
  }
  tbody td{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--bg-alt);}
  .proj-link{color:var(--blue);font-weight:600;cursor:pointer;}
  .proj-link:hover{text-decoration:underline;}
  .row-sub{color:var(--text-secondary);font-size:13px;margin-top:var(--space-1);}
  .empty-cell{color:var(--text-tertiary);}

  .table-wrap-fit{border:1px solid var(--border);border-radius:var(--radius);overflow:visible;}
  table.fixed-table{table-layout:fixed;width:100%;}
  table.fixed-table thead th{white-space:normal;}
  table.fixed-table tbody td{overflow:visible;}
  .cell-clamp-wrap{position:relative;}
  .cell-clamp{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;text-overflow:ellipsis;word-break:break-word;line-height:1.4;
  }
  .cell-clamp.clamp-5{-webkit-line-clamp:5;}
  .cell-tooltip{
    display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:60;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow);padding:var(--space-3) var(--space-3);font-size:13px;line-height:1.5;font-weight:400;
    white-space:normal;max-width:280px;min-width:160px;color:var(--text);
  }
  .cell-clamp-wrap:hover .cell-tooltip{display:block;}

  .pagination-row{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-6);padding:var(--space-4) var(--space-1) 0;color:var(--text-secondary);font-size:13.5px;}
  .pagination-row .pg-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text);}
  .pagination-row .pg-btn:disabled{opacity:.4;cursor:not-allowed;}
  .pagination-row .pg-btn svg{width:15px;height:15px;}

  /* cards */
  .card{border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-6) var(--space-6);background:var(--bg);}
  .section{margin-bottom:var(--space-8);}
  .section h2{font-size:19px;margin:0 0 var(--space-4);}
  .section-head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);flex-wrap:wrap;gap:var(--space-3);}

  .agents-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);}
  .agent-card{border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-6);cursor:pointer;background:var(--bg);transition:border-color .12s;}
  .agent-card:hover{border-color:var(--border-strong);}
  .agent-card .a-icon{width:38px;height:38px;border-radius:10px;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-4);}
  .agent-card .a-icon svg{width:20px;height:20px;}
  .agent-card .a-name{font-weight:600;font-size:15.5px;margin-bottom:var(--space-2);}

  /* project page: tabs + pill toggle + v2 agent cards */
  .page-tabs{display:flex;gap:var(--space-7);border-bottom:1px solid var(--border);margin-bottom:var(--space-6);}
  .page-tab{padding:0 0 var(--space-4);font-size:15px;color:var(--text-secondary);cursor:pointer;font-weight:600;position:relative;}
  .page-tab.active{color:var(--text);}
  .page-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--yellow);}

  .pill-toggle{display:flex;gap:var(--space-3);margin-bottom:var(--space-6);flex-wrap:wrap;}
  .pill-item{padding:var(--space-3) var(--space-5);border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;background:var(--gray-bg);color:var(--gray-text);white-space:nowrap;}
  .pill-item.active{background:var(--yellow);color:#1a1a1a;}

  .agents-grid-v2{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5);}
  @media (max-width:1100px){ .agents-grid-v2{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:680px){ .agents-grid-v2{grid-template-columns:1fr;} }
  .agent-card-v2{padding:var(--space-6);display:flex;flex-direction:column;}
  .agent-card-v2-title{color:var(--blue);font-weight:700;font-size:16.5px;margin-bottom:var(--space-3);cursor:pointer;}
  .agent-card-v2-title:hover{text-decoration:underline;}
  .agent-card-v2-sub{color:var(--text-secondary);font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .agent-card-v2-foot{margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--border);}

  .business-block{margin-bottom:var(--space-6);}
  .business-block h3{font-size:15px;margin:0 0 var(--space-2);}
  .business-block p{margin:0;color:var(--text);line-height:1.6;}
  .business-block .muted{color:var(--text-tertiary);}
  .business-block .cj-link{display:block;color:var(--blue);margin-bottom:var(--space-2);}
  .business-block .cj-link:hover{text-decoration:underline;}

  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--space-10) var(--space-5);}
  .empty-state .box-illustration{width:130px;height:130px;margin-bottom:var(--space-6);}
  .empty-state h3{font-size:19px;margin:0 0 var(--space-5);}

  .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5);}
  .info-grid .lbl{font-size:13px;color:var(--text-secondary);margin-bottom:var(--space-2);}
  .info-grid .val{font-size:15px;font-weight:600;}

  .stat-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);}
  .stat-tile{border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-6);}
  .stat-tile .big{font-size:30px;font-weight:800;margin-bottom:var(--space-2);}
  .stat-tile .big.orange-text{color:#e8951a;}
  .stat-tile .lbl{color:var(--text-secondary);font-size:14px;}

  .tshirt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);}
  .tshirt-card{border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-6);text-align:center;}
  .tshirt-card .sz{font-size:30px;font-weight:800;color:var(--text-tertiary);margin-bottom:var(--space-3);}
  .tshirt-card .lvl{font-size:13px;color:var(--text-tertiary);text-transform:none;margin-bottom:var(--space-3);}
  .tshirt-card .desc{font-size:12.5px;color:var(--text-secondary);line-height:1.5;text-align:left;}
  .tshirt-card.active{background:var(--orange-bg);border-color:var(--orange-border);}
  .tshirt-card.active .sz{color:var(--orange-text);}
  .tshirt-card.active .lvl{color:var(--orange-text);}
  .tshirt-card.active .desc{color:#8a5a15;}

  .justif-banner{background:var(--orange-bg);border-radius:var(--radius);padding:var(--space-5) var(--space-6);font-size:14.5px;line-height:1.6;color:#6b4a10;}
  .justif-banner b{display:block;margin-bottom:var(--space-1);color:#6b4a10;}

  .with-toc{display:flex;gap:var(--space-7);align-items:flex-start;}
  .toc-col{width:230px;flex:0 0 auto;position:sticky;top:20px;}
  .toc-item{padding:var(--space-3) var(--space-4);font-size:14px;color:var(--text-secondary);cursor:pointer;border-left:2px solid transparent;line-height:1.4;}
  .toc-item.active{color:var(--text);font-weight:700;border-left-color:var(--yellow);background:var(--bg-alt);}
  .content-col{flex:1;min-width:0;}

  .req-chip{color:var(--blue);}
  .req-name{color:var(--text);font-weight:600;}
  .req-list-cell div{margin-bottom:var(--space-1);font-size:13.5px;}

  .view-toggle{display:flex;gap:2px;background:var(--gray-bg);border-radius:10px;padding:3px;flex:0 0 auto;}
  .view-toggle-btn{width:32px;height:28px;border:none;background:transparent;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
  .view-toggle-btn svg{width:16px;height:16px;}
  .view-toggle-btn.active{background:var(--bg);color:var(--text);box-shadow:var(--shadow-sm);}
  .view-toggle-btn:hover:not(.active){color:var(--text);}

  .req-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-4);}
  .req-card{padding:var(--space-4) var(--space-5);}

  .uc-card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;}
  .uc-card-body{display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-4);}
  .uc-card-body .field-label{margin-bottom:var(--space-1);}

  .checkbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;background:var(--bg);}
  .checkbox.checked{background:var(--yellow);border-color:var(--yellow);}
  .checkbox svg{width:13px;height:13px;display:none;color:#1a1a1a;}
  .checkbox.checked svg{display:block;}
  .del-x{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);cursor:pointer;}
  .del-x:hover{background:var(--bg-alt);color:var(--text);}
  .del-x svg{width:15px;height:15px;}

  .risk-card{border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-5) var(--space-6);display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-4);margin-bottom:var(--space-4);}
  .risk-card .r-name{font-weight:700;margin-bottom:var(--space-2);}
  .risk-card .r-desc{color:var(--text-secondary);font-size:14px;margin-bottom:var(--space-2);}
  .risk-card .r-mit{color:var(--text-tertiary);font-size:13px;}

  .qlist-item{display:flex;justify-content:space-between;align-items:flex-start;padding:var(--space-4) var(--space-1);border-bottom:1px solid var(--border);gap:var(--space-3);}
  .qlist-item:last-child{border-bottom:none;}
  .qlist-item .q-label{color:var(--text-secondary);font-size:13px;margin-bottom:var(--space-1);}
  .qlist-item .q-text{font-size:15px;}
  .qlist-box{border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-2) var(--space-6);}

  .footer-bar{
    position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);
    padding:var(--space-5) 0;display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-7);
  }

  /* wizard modals: footer always pinned to the bottom of the screen, outside the scrollable body */
  .wizard-foot{
    flex:0 0 auto;background:var(--bg);border-top:1px solid var(--border);
    padding:var(--space-5) var(--space-8);display:flex;gap:var(--space-3);justify-content:flex-end;
  }

  .wizard-step-content{margin-top:var(--space-7);}
  .wizard-step-content.centered{display:flex;flex-direction:column;align-items:center;}
  .wizard-body-center{display:flex;flex-direction:column;}
  .wizard-body-center > .wizard-stepper-wrap{flex:0 0 auto;}
  .wizard-body-center > *:last-child{flex:1;display:flex;flex-direction:column;justify-content:center;margin-left:auto;margin-right:auto;width:100%;}
  .wizard-body-center .wizard-step-content{margin-top:0;}

  .uc-wizard-body-center{display:flex;flex-direction:column;}
  .uc-wizard-body-center > .wizard-stepper-wrap{flex:0 0 auto;}
  .uc-wizard-body-center > .wizard-stepper-wrap .stepper{margin-bottom:0;}
  .uc-wizard-body-center > .uc-wizard-content-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;margin-top:var(--space-7);}

  /* stepper */
  .stepper{display:flex;align-items:flex-start;justify-content:center;gap:var(--space-9);padding-bottom:var(--space-5);border-bottom:1px solid var(--border);margin-bottom:var(--space-7);flex-wrap:wrap;}
  .step{display:flex;align-items:center;gap:var(--space-3);position:relative;padding-bottom:var(--space-4);}
  .step .circle{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:13.5px;color:var(--text-tertiary);flex:0 0 auto;}
  .step.done .circle{background:#dff5e4;border-color:#7bd39a;color:#1f8a4d;}
  .step.done .circle svg{width:15px;height:15px;}
  .step.active .circle{background:var(--yellow);border-color:var(--yellow);color:#1a1a1a;font-weight:700;}
  .step .stxt{line-height:1.35;}
  .step .stxt .s-lbl{font-size:12.5px;color:var(--text-tertiary);}
  .step .stxt .s-name{font-size:15px;color:var(--text-tertiary);}
  .step.active .stxt .s-name{color:var(--text);font-weight:700;}
  .step.done .stxt .s-name{color:var(--text);}
  .step.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--yellow);}

  .wizard-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;overflow:hidden;}
  .wizard-head{display:flex;align-items:center;justify-content:space-between;padding:var(--space-6) var(--space-8) var(--space-5);flex:0 0 auto;border-bottom:1px solid var(--border);}
  .wizard-head h2{font-size:19px;margin:0;font-weight:700;}
  .wizard-close{width:34px;height:34px;border:none;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text);}
  .wizard-close:hover{background:var(--bg-alt);}
  .wizard-close svg{width:20px;height:20px;}
  .wizard-body{flex:1;overflow-y:auto;padding:0 var(--space-8) var(--space-8);}
  .wizard-stepper-wrap{padding-top:var(--space-5);}

  /* side panel */
  .backdrop{position:fixed;inset:0;background:rgba(15,15,18,.45);z-index:300;}
  .backdrop.enter{animation:fadein .12s ease;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .side-panel{
    position:fixed;top:0;right:0;bottom:0;width:560px;max-width:92vw;background:var(--bg);
    box-shadow:var(--shadow);z-index:301;display:flex;flex-direction:column;
  }
  .side-panel.enter{animation:slidein .16s ease;}
  @keyframes slidein{from{transform:translateX(30px);opacity:.4}to{transform:translateX(0);opacity:1}}
  .side-head{padding:var(--space-7) var(--space-7) 0;flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);}
  .side-head h2{font-size:19px;margin:0 0 var(--space-2);}
  .side-head .side-desc{color:var(--text-secondary);font-size:14px;line-height:1.5;margin:0;}
  .side-body{flex:1;overflow-y:auto;padding:var(--space-6) var(--space-7);}
  .side-foot{padding:var(--space-5) var(--space-7);border-top:1px solid var(--border);display:flex;gap:var(--space-3);justify-content:flex-end;flex:0 0 auto;}

  .search-result-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-4) var(--space-4);display:flex;align-items:flex-start;gap:var(--space-3);margin-bottom:var(--space-3);cursor:pointer;}
  .search-result-card:hover{border-color:var(--border-strong);}
  .search-result-card .tag{font-size:11px;color:var(--text-tertiary);margin-bottom:var(--space-1);}
  .search-result-card .name{color:var(--blue);font-weight:600;font-size:15px;margin-bottom:var(--space-1);}
  .search-result-card .code{color:var(--text-secondary);font-size:12.5px;}
  .search-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-9) var(--space-3);color:var(--text);gap:var(--space-4);}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--gray-bg);border-top-color:var(--yellow);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .uc-stage-list{display:flex;flex-direction:column;}
  .uc-stage{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-1);}
  .uc-stage-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1.5px solid var(--border-strong);color:var(--text-tertiary);position:relative;font-size:13px;}
  .uc-stage-icon svg{width:14px;height:14px;}
  .uc-stage:not(:last-child) .uc-stage-icon::after{content:"";position:absolute;top:100%;left:50%;width:1.5px;height:var(--space-4);background:var(--border);transform:translateX(-50%);margin-top:8px;}
  .uc-stage.done .uc-stage-icon{background:#dff5e4;border-color:#7bd39a;color:#1f8a4d;}
  .uc-stage.running .uc-stage-icon{border-color:var(--yellow);}
  .uc-stage .mini-spinner{width:13px;height:13px;border-radius:50%;border:2px solid var(--gray-bg);border-top-color:var(--yellow);animation:spin .8s linear infinite;}
  .uc-stage-label{font-size:14.5px;color:var(--text-tertiary);flex:1;}
  .uc-stage-status{flex:0 0 auto;}
  .uc-stage.running .uc-stage-label{color:var(--text);font-weight:600;}
  .uc-stage.done .uc-stage-label{color:var(--text);}

  .uc-stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-4);margin-bottom:var(--space-6);}
  .uc-stat-card{border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-4) var(--space-5);background:var(--bg);}
  .uc-stat-card .val{font-size:26px;font-weight:700;line-height:1;margin-bottom:var(--space-2);}
  .uc-stat-card .lbl{display:flex;align-items:center;gap:var(--space-2);font-size:13px;color:var(--text-secondary);}
  .uc-stat-card .lbl .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .uc-stat-card .lbl .dot.green{background:var(--green-text);}
  .uc-stat-card .lbl .dot.blue{background:var(--blue);}
  .uc-stat-card .lbl .dot.gray{background:var(--gray-text);}
  .uc-stat-card .lbl .dot.orange{background:var(--orange-text);}

  .uc-unmapped-card{padding:var(--space-5) var(--space-6);margin-bottom:var(--space-4);}
  .uc-unmapped-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-1);}
  .uc-part-code{font-family:ui-monospace,monospace;font-size:12px;color:var(--text-secondary);margin-right:var(--space-2);}
  .uc-choice-group{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-1);}
  .uc-choice{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:var(--bg);}
  .uc-choice input[type=radio]{width:16px;height:16px;margin-top:var(--space-1);accent-color:var(--yellow);cursor:pointer;flex:0 0 auto;}
  .uc-choice b{font-size:14px;}
  .uc-choice.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset;}
  .uc-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-1) var(--space-4);margin-top:var(--space-4);}
  .uc-field-grid .field-block{margin-bottom:var(--space-3);}
  .uc-card-foot{display:flex;justify-content:flex-end;margin-top:var(--space-2);}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#1c1c1f;color:#fff;
    padding:var(--space-4) var(--space-5);border-radius:12px;display:flex;align-items:center;gap:var(--space-5);z-index:500;
    box-shadow:var(--shadow);font-size:14.5px;max-width:520px;line-height:1.45;animation:toastin .18s ease;
  }
  @keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  .toast .t-close{cursor:pointer;color:#b8b8bd;flex:0 0 auto;width:18px;height:18px;}
  .toast .t-close svg{width:18px;height:18px;}

  .fab{
    position:fixed;right:36px;bottom:36px;width:52px;height:52px;border-radius:50%;background:#17181a;
    display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow-sm);z-index:40;border:none;
  }
  .fab svg{width:24px;height:24px;}

  .placeholder-page{padding:var(--space-10) var(--space-5);text-align:center;color:var(--text-secondary);}

  /* ---------- CJ library ---------- */
  .cj-toolbar{display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap;}
  .cj-toolbar .search-wrap{flex:1;min-width:260px;position:relative;}
  .view-toggle{display:flex;border:1px solid var(--border-strong);border-radius:11px;overflow:hidden;flex:0 0 auto;}
  .view-toggle-btn{width:44px;height:44px;border:none;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);}
  .view-toggle-btn:not(:last-child){border-right:1px solid var(--border-strong);}
  .view-toggle-btn.active{background:var(--bg-alt);color:var(--text);}
  .cj-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--space-5);}
  .cj-card{cursor:pointer;display:flex;flex-direction:column;}
  .cj-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm);}
  .cj-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-4);}
  .cj-card-badges{display:flex;gap:var(--space-2);flex-wrap:wrap;}
  .cj-card-menu{color:var(--text-tertiary);flex:0 0 auto;padding:var(--space-1);}
  .cj-card-title{color:var(--blue);font-weight:700;font-size:16px;margin-bottom:var(--space-1);}
  .cj-card-code{color:var(--text-secondary);font-size:12.5px;margin-bottom:var(--space-3);}
  .cj-card-desc{font-size:13.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:var(--space-4);}
  .cj-card-desc .more-link{color:var(--blue);font-weight:600;display:block;margin-top:var(--space-1);}
  .cj-card-field{font-size:12px;color:var(--text-tertiary);margin-bottom:var(--space-1);}
  .cj-card-field-val{font-size:13.5px;color:var(--text);margin-bottom:var(--space-3);line-height:1.4;}
  .cj-card-tags{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-4);}
  .cj-tag{background:var(--gray-bg);color:var(--gray-text);border-radius:20px;padding:2px var(--space-3);font-size:12px;font-weight:600;}
  .cj-card-date{margin-top:auto;padding-top:var(--space-3);border-top:1px solid var(--border);font-size:12px;color:var(--text-tertiary);}
  .cj-card-branch-state{margin-top:var(--space-2);font-size:12px;display:flex;align-items:center;gap:6px;color:var(--text-secondary);}
  .cj-card-branch-state svg{width:13px;height:13px;flex:0 0 auto;}
  .cj-card-branch-state.empty{color:var(--text-tertiary);font-style:italic;}
  .cj-card.branch-empty{border-style:dashed;}
  .cj-card.branch-empty .cj-card-title,.cj-card.branch-empty .cj-card-desc,.cj-card.branch-empty .cj-card-field-val{opacity:.55;}

  /* branch-context switch — sits below search/filters, since search/filters run across
     all branches at once; the chips only narrow which branch's composition state shows
     on each card. Reuses .cj-branch-pill (same chip look as the CJ_DETAIL branch bar). */
  .cj-library-branch-row{display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-6);}

  /* ---------- CJ detail overlay ---------- */
  .cj-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;overflow:hidden;}
  .cj-head{flex:0 0 auto;display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--border);}
  .cj-head-back{width:34px;height:34px;border:none;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text);flex:0 0 auto;}
  .cj-head-back:hover{background:var(--bg-alt);}
  .cj-head-titles{margin-right:var(--space-2);}
  .cj-head-titles h2{font-size:16.5px;margin:0;line-height:1.3;}
  .cj-head-titles .sub{font-size:12.5px;color:var(--text-secondary);}
  .cj-head-spacer{flex:1;}
  .cj-head-actions{display:flex;align-items:center;gap:var(--space-3);flex-wrap:nowrap;}
  .cj-menu-wrap{position:relative;}
  .cj-menu{position:absolute;top:42px;left:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);min-width:220px;z-index:60;padding:var(--space-2);}
  .cj-menu-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border-radius:8px;font-size:14px;color:var(--text);cursor:pointer;}
  .cj-menu-item:hover{background:var(--bg-alt);}
  .cj-menu-item svg{width:17px;height:17px;color:var(--text-secondary);}

  /* ---------- CJ branches (design/develop/main + user) ---------- */
  .cj-branch-bar{flex:0 0 auto;display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-6);border-bottom:1px solid var(--border);background:var(--bg-alt);flex-wrap:wrap;}
  .cj-branch-pills{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;}
  .cj-branch-pill-wrap{position:relative;}
  .cj-branch-pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;background:var(--bg);border:1px solid var(--border-strong);color:var(--text-secondary);}
  .cj-branch-pill:hover{border-color:var(--text-tertiary);}
  .cj-branch-pill.active{background:var(--yellow);border-color:var(--yellow);color:#1a1a1a;}
  .cj-branch-pill.user{border-style:dashed;}
  .cj-branch-pill.disabled{opacity:.4;cursor:not-allowed;border-style:dashed;}
  .cj-branch-pill .empty-dot{width:6px;height:6px;border-radius:50%;background:var(--text-tertiary);flex:0 0 auto;}
  .cj-branch-pill.active .empty-dot{background:#1a1a1a;opacity:.5;}
  .cj-branch-pill .del{display:flex;color:inherit;opacity:.55;}
  .cj-branch-pill .del svg{width:12px;height:12px;}
  .cj-branch-pill .del:hover{opacity:1;}
  .cj-branch-add{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;border:1px dashed var(--border-strong);background:transparent;color:var(--blue);}
  .cj-branch-add svg{width:14px;height:14px;}
  .cj-branch-add:hover{border-color:var(--blue);}
  .cj-branch-del-confirm{position:absolute;top:calc(100% + 6px);left:0;z-index:80;width:240px;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:var(--space-4);}
  .cj-branch-del-confirm .txt{font-size:13px;color:var(--text);margin-bottom:var(--space-3);line-height:1.4;}
  .cj-branch-del-confirm .row{display:flex;gap:var(--space-2);justify-content:flex-end;}

  .cj-merge-title-wrap{position:relative;display:flex;align-items:center;gap:6px;}
  .cj-merge-help-btn{width:24px;height:24px;}
  .cj-merge-help-btn svg{width:16px;height:16px;}
  .cj-merge-help-popover{top:32px;left:0;right:auto;width:280px;}
  .cj-merge-help-list{margin:0;padding-left:18px;font-size:13px;color:var(--text-secondary);line-height:1.6;}
  .cj-merge-help-list li{margin-bottom:var(--space-2);}
  .cj-merge-help-list li:last-child{margin-bottom:0;}

  .cj-merge-compare{display:flex;align-items:stretch;gap:var(--space-3);margin-top:var(--space-5);}
  .cj-merge-compare .col{flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-4);}
  .cj-merge-compare .col .hd{font-weight:700;font-size:13.5px;}
  .cj-merge-compare .col .sub{font-size:11.5px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.03em;margin-bottom:var(--space-2);}
  .cj-merge-compare .col .row{font-size:12.5px;color:var(--text-secondary);line-height:1.6;}
  .cj-merge-compare .arrow{display:flex;align-items:center;color:var(--text-tertiary);flex:0 0 auto;}
  .cj-merge-strategy{display:flex;flex-direction:column;gap:var(--space-3);}
  .cj-merge-strategy-card{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:var(--space-4);cursor:pointer;}
  .cj-merge-strategy-card .t{font-weight:700;font-size:13.5px;margin-bottom:4px;}
  .cj-merge-strategy-card .d{font-size:12.5px;color:var(--text-secondary);line-height:1.45;}
  .cj-merge-strategy-card.active{border-color:var(--yellow);background:var(--bg-alt);}

  .cj-matrix-wrap{flex:1;min-height:0;overflow:auto;padding:var(--space-5) var(--space-6);}
  /* CSS grid (not independent flex columns) so every row's height stays in sync across
     the field-label column and all stage columns — content of differing length in one
     column no longer pushes only that column out of alignment with the others. */
  /* stage columns use minmax(280px,1fr) so they stretch to fill the viewport on wide
     screens; width:100% + min-width:min-content lets the grid still shrink-wrap and
     trigger horizontal scroll (via .cj-matrix-wrap's overflow:auto) once there are more
     stages than fit at their minimum width, instead of pinning to content width always. */
  .cj-matrix{display:grid;grid-auto-rows:minmax(52px,auto);align-items:stretch;width:100%;min-width:min-content;}
  .cj-field-col-head{position:sticky;left:0;background:var(--bg);z-index:6;height:52px;display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--text-secondary);gap:var(--space-2);}
  .cj-field-row{position:sticky;left:0;background:var(--bg);z-index:6;display:flex;align-items:center;font-size:13.5px;color:var(--text-secondary);padding:var(--space-3) var(--space-4) var(--space-3) 0;border-bottom:1px solid var(--border);}
  .cj-stage-head{height:52px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);padding:0 var(--space-4);font-weight:700;font-size:14px;border-radius:10px 10px 0 0;color:var(--text);border-right:1px solid var(--border);}
  .cj-stage-head.c1{background:#e3f5e8;}
  .cj-stage-head.c2{background:#fbf3d4;}
  .cj-stage-head.c3{background:#f8e3f5;}
  .cj-stage-head.c4{background:#e0edfb;}
  [data-theme="dark"] .cj-stage-head.c1{background:#1c3324;}
  [data-theme="dark"] .cj-stage-head.c2{background:#3a3018;}
  [data-theme="dark"] .cj-stage-head.c3{background:#38203a;}
  [data-theme="dark"] .cj-stage-head.c4{background:#1c2c3f;}
  .cj-stage-cell{display:flex;align-items:center;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border);border-right:1px solid var(--border);font-size:13.5px;line-height:1.45;}
  .cj-stage-cell.empty{color:var(--text-tertiary);}
  .cj-stage-cell.wrap{align-items:flex-start;}
  .cj-below-links{position:sticky;left:0;background:var(--bg);z-index:6;padding:var(--space-4) 0 0 0;display:flex;gap:var(--space-5);font-size:14px;}
  .cj-below-links a{color:var(--blue);}

  .cj-scenario-cell{flex-direction:column;align-items:stretch;gap:var(--space-3);padding:var(--space-3) var(--space-4);}
  /* the scenario chip and its sources are one visual card — the chip is the card's header
     row and the (expanded) source list is nested inside the same border, on a slightly
     different background, so sources read as "belonging to" the scenario rather than as
     independent siblings floating below it. */
  .cj-scenario-group{border:1px solid var(--border);border-radius:10px;background:var(--bg);overflow:hidden;}
  .cj-scenario-chip{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);cursor:pointer;position:relative;background:var(--bg);}
  .cj-scenario-chip:hover{background:var(--bg-alt);}
  .cj-scenario-body{border-top:1px solid var(--border);background:var(--bg-alt);padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2);}
  .cj-scenario-chip .ic{width:26px;height:26px;border-radius:50%;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .cj-scenario-chip .ic svg{width:15px;height:15px;}
  .cj-scenario-chip .txt{flex:1;min-width:0;}
  .cj-scenario-chip .txt .n{font-size:13.5px;font-weight:600;}
  .cj-scenario-chip .txt .id{font-size:11.5px;color:var(--text-tertiary);}
  .cj-scenario-chip .pencil{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);flex:0 0 auto;}
  .cj-scenario-chip .pencil:hover{background:var(--bg-alt);color:var(--text);}
  .cj-scenario-chip .pencil svg{width:15px;height:15px;}
  .cj-scenario-chip .chev{width:16px;height:16px;color:var(--text-tertiary);flex:0 0 auto;}
  .cj-scenario-chip .chev svg{width:16px;height:16px;}
  .cj-field-col-head svg{width:14px;height:14px;}
  .cj-stage-head svg{width:16px;height:16px;}

  .cj-source-list{display:flex;flex-direction:column;gap:var(--space-2);}
  .cj-source-badge{display:flex;align-items:center;gap:var(--space-2);border:1px solid var(--border);border-radius:10px;padding:var(--space-2) var(--space-3);cursor:pointer;background:var(--bg);}
  .cj-source-badge:hover{border-color:var(--border-strong);}
  .cj-source-badge svg{width:15px;height:15px;color:var(--text-tertiary);flex:0 0 auto;}
  .cj-source-badge .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .cj-source-badge .dot.manual{background:var(--gray-text);}
  .cj-source-badge .dot.usecase{background:var(--blue);}
  .cj-source-badge .dot.e2e{background:#9c2aa0;}
  .cj-source-badge .lbl{flex:1;min-width:0;font-size:13px;}
  .cj-source-badge .lbl .t{color:var(--text-tertiary);font-size:11px;}
  .cj-source-badge .lbl .n{font-weight:600;font-size:13px;}
  .cj-source-badge.add{border-style:dashed;background:transparent;}
  .cj-source-badge.add svg{color:var(--blue);}
  .cj-source-badge.add .lbl .n{color:var(--blue);}
  .cj-source-warn{display:flex;align-items:center;gap:var(--space-2);font-size:12px;color:var(--orange-text);background:var(--orange-bg);border-radius:8px;padding:var(--space-2) var(--space-3);}
  .cj-source-warn svg{width:14px;height:14px;flex:0 0 auto;}

  .cj-source-back{display:flex;align-items:center;gap:var(--space-1);color:var(--blue);font-size:12.5px;cursor:pointer;margin-bottom:var(--space-1);}
  .cj-source-back svg{width:14px;height:14px;}
  .cj-call-card{border:1px solid var(--border);border-radius:10px;padding:var(--space-3) var(--space-4);background:var(--bg-alt);}
  .cj-call-card-title{font-size:11px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.03em;margin-bottom:var(--space-2);}
  .cj-call-card .row{display:flex;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-2);}
  .cj-call-card .row:last-child{margin-bottom:0;}
  .cj-call-card .lbl{font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;}
  .cj-call-card .val{font-size:13px;color:var(--text);}
  .cj-call-card .val.link{color:var(--blue);}
  .readonly-note{display:flex;align-items:center;gap:var(--space-2);font-size:12px;color:var(--text-tertiary);}
  .readonly-note svg{width:14px;height:14px;flex:0 0 auto;}
  .readonly-note a{color:var(--blue);font-weight:600;}
  .cj-call-edit-group{border:1px solid var(--border);border-radius:10px;padding:var(--space-4);margin-bottom:var(--space-4);}
  .cj-call-edit-group:last-child{margin-bottom:0;}
  .cj-call-edit-title{font-size:13px;font-weight:700;margin-bottom:var(--space-3);}
  .cj-call-edit-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3);}
  .cj-call-edit-title-row .cj-call-edit-title{margin-bottom:0;}
  .cj-call-edit-title-row .icon-btn{width:28px;height:28px;}
  .cj-call-edit-title-row .icon-btn svg{width:15px;height:15px;}

  @media (max-width:1100px){
    .agents-grid{grid-template-columns:repeat(2,1fr);}
    .stat-tiles{grid-template-columns:repeat(2,1fr);}
    .tshirt-grid{grid-template-columns:repeat(2,1fr);}
    .with-toc{flex-direction:column;}
    .toc-col{width:100%;position:static;display:flex;flex-wrap:wrap;gap:var(--space-1);}
  }

  /* ============================= APP CATALOG ============================= */
  .ac-tree{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .ac-tree-row{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-4) var(--space-5);cursor:pointer;border-bottom:1px solid var(--border);font-size:14.5px;font-weight:600;}
  .ac-tree-row:last-child{border-bottom:none;}
  .ac-tree-row:hover{background:var(--bg-hover);}
  .ac-tree-row.lvl-1{padding-left:var(--space-5);}
  .ac-tree-row.lvl-2{padding-left:var(--space-8);font-weight:500;}
  .ac-tree-row .chev{width:18px;height:18px;flex:0 0 auto;color:var(--text-tertiary);transition:transform .12s;}
  .ac-tree-row .chev.open{transform:rotate(90deg);}
  .ac-tree-body{border-bottom:1px solid var(--border);background:var(--bg-alt);}
  .ac-tree-body:last-child{border-bottom:none;}
  .ac-tree-body .table-wrap{border:none;border-radius:0;border-top:1px solid var(--border);}
  .ac-tree-body table{background:var(--bg);}

  .exp-row-btn{width:22px;height:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);cursor:pointer;border-radius:6px;}
  .exp-row-btn:hover{background:var(--bg-hover);}
  .exp-row-btn svg{width:16px;height:16px;transition:transform .12s;}
  .exp-row-btn.open svg{transform:rotate(90deg);}
  .exp-row-btn.none{visibility:hidden;}
  tr.exp-detail-row > td{padding:0;border-bottom:1px solid var(--border);}
  .exp-detail{position:relative;padding:var(--space-5) var(--space-5) var(--space-5) var(--space-6);background:var(--bg-alt);}
  .exp-detail::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--yellow);}
  .exp-detail .table-wrap{background:var(--bg);margin-bottom:var(--space-4);}
  .exp-detail .table-wrap:last-child{margin-bottom:0;}
  .exp-detail-note{font-size:13px;color:var(--text-secondary);margin-bottom:var(--space-3);}
  .exp-cell{display:flex;align-items:center;gap:var(--space-2);}

  .tc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5);}
  @media (max-width:1200px){ .tc-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:800px){ .tc-grid{grid-template-columns:1fr;} }
  .tc-card{border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);}
  .tc-card .tc-title{color:var(--blue);font-weight:600;font-size:14.5px;line-height:1.35;cursor:pointer;}
  .tc-card .tc-title:hover{text-decoration:underline;}
  .tc-card .tc-code{font-size:12.5px;color:var(--text-tertiary);}
  .tc-card .tc-domain-lbl{font-size:12.5px;color:var(--text-secondary);}
  .tc-card .tc-domain-val{font-size:13.5px;color:var(--blue);}
  .tc-card .tc-methods-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:600;font-size:14px;border-top:1px solid var(--border);padding-top:var(--space-3);}
  .tc-card .tc-methods-head svg{width:16px;height:16px;color:var(--text-tertiary);transition:transform .12s;}
  .tc-card .tc-methods-head.open svg{transform:rotate(180deg);}
  .tc-card .tc-method-item{color:var(--blue);font-size:13.5px;padding:var(--space-2) 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

  .pipe-run{border-bottom:1px solid var(--border);}
  .pipe-run:last-child{border-bottom:none;}
  .pipe-run-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-5);cursor:pointer;}
  .pipe-run-row:hover{background:var(--bg-hover);}
  .pipe-run-row .name{flex:1;font-size:14.5px;color:var(--blue);font-weight:600;}
  .pipe-run-row .src{width:160px;font-size:13.5px;color:var(--text-secondary);}
  .pipe-run-detail{position:relative;padding:var(--space-5) var(--space-6);background:var(--bg-alt);}
  .pipe-run-detail::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--yellow);}
  .pipe-run-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--space-5);}
  .pipe-run-head .eyebrow{font-size:11px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:var(--space-1);}
  .pipe-run-head .stage-name{font-size:15px;font-weight:700;margin-bottom:2px;}
  .pipe-run-head .stage-date{font-size:13px;color:var(--text-secondary);}
  .pipe-timeline{display:flex;align-items:center;gap:0;}
  .pipe-timeline .seg{flex:1;height:3px;background:var(--yellow);}
  .pipe-timeline .seg.pending{background:var(--border-strong);}
  .pipe-timeline .dot{width:10px;height:10px;border-radius:50%;background:var(--yellow);flex:0 0 auto;}
  .pipe-timeline .dot.pending{background:var(--border-strong);}
  .pipe-timeline .end{width:26px;height:26px;border-radius:50%;background:var(--green-text);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .pipe-timeline .end svg{width:14px;height:14px;}
  .pipe-timeline .end.fail{background:var(--red-text);}
  .pipe-timeline .end svg.x{width:14px;height:14px;}
  .pipe-run-foot{margin-top:var(--space-2);font-size:13.5px;color:var(--text-secondary);}

  .obs-tree-row{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--border);font-size:14px;}
  .obs-tree-row:last-child{border-bottom:none;}
  .obs-tree-row:hover{background:var(--bg-hover);}
  .obs-tree-row .lbl{flex:1;font-weight:600;}
  .obs-tree-row.lvl-1 .lbl{font-weight:600;padding-left:var(--space-5);}
  .obs-tree-row.lvl-2 .lbl{font-weight:500;padding-left:var(--space-8);}
  .obs-tree-row .link-col{width:340px;color:var(--blue);}
  .obs-tree-row .edit-btn{width:28px;height:28px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);border-radius:6px;cursor:pointer;}
  .obs-tree-row .edit-btn:hover{background:var(--bg-hover);color:var(--text);}
  .obs-tree-row .edit-btn svg{width:15px;height:15px;}
  .obs-tree-group{border-left:3px solid var(--yellow);}

  .ac-radio-group{display:flex;flex-direction:column;gap:var(--space-4);margin-bottom:var(--space-6);}
  .ac-radio{display:flex;align-items:center;gap:var(--space-3);cursor:pointer;font-size:15px;}
  .ac-radio .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-strong);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .ac-radio.checked .dot{border-color:var(--yellow);}
  .ac-radio.checked .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--yellow);}
  .ac-src-field{position:relative;margin-bottom:var(--space-4);}
  .ac-src-field label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:var(--space-2);}
  .ac-src-field .input{width:100%;padding-right:var(--space-8);}
  .ac-src-field .eye-ic{position:absolute;right:var(--space-4);top:38px;color:var(--text-tertiary);width:18px;height:18px;pointer-events:none;}

  /* Company architecture graph (custom nodes/relationships) — filters/search live in a horizontal
     toolbar above the diagram; the row below reuses .card for chrome on both panels. */
  .graph-toolbar{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-4);}
  .graph-toolbar-search{width:648px;flex:0 0 auto;}
  .graph-toolbar-search .input{font-size:13.5px;}
  .graph-toolbar-types{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;}
  .graph-chip{display:flex;align-items:center;gap:6px;padding:6px var(--space-4);border-radius:999px;border:1px solid var(--border-strong);font-size:13px;color:var(--text-secondary);cursor:pointer;background:var(--bg);white-space:nowrap;}

function buildStepUc(n, stepTitle){
  if(n%3===0) return null;
  return {
    code:'UC-'+(100+n),
    name:'Use Case: '+stepTitle,
    status: n%2===0 ? 'published':'draft',
    scenarios:[
      {part:'P-01', action:UC_ACTION_POOL[n%UC_ACTION_POOL.length], call:E2E_CALLS_ONLY[n%E2E_CALLS_ONLY.length], status:'confirmed'},
      {part:'P-02', action:UC_ACTION_POOL[(n+1)%UC_ACTION_POOL.length], call:E2E_CALLS_ONLY[(n+1)%E2E_CALLS_ONLY.length], status: n%2===0?'confirmed':'planned'}
    ]
  };
}

function pad2(n){ return (n<10?'0':'')+n; }
function daysAgoStr(d){
  var dt=new Date(Date.now()-d*86400000);
  function p(n){return (n<10?'0':'')+n;}
  return dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate())+', '+p(dt.getHours())+':'+p(dt.getMinutes());
}

function parsePlantUml(text){
  var lines=(text||'').split('\n');
  var seen=[]; var seenSet={};
  function addP(name){ if(name && !seenSet[name]){ seenSet[name]=true; seen.push(name); } }
  var messages=[];
  lines.forEach(function(raw){
    var l=raw.trim();
    if(!l || l.charAt(0)==="'") return;
    var pm=l.match(/^(participant|actor|boundary|control|entity|database|collections|queue)\s+"?([^">]+?)"?(\s+as\s+(\S+))?\s*$/i);
    if(pm){ addP(pm[4]||pm[2]); return; }
    var mm=l.match(/^"?([\w.\-]+)"?\s*(-->|->|<--|<-)\s*"?([\w.\-]+)"?\s*:\s*(.+)$/);
    if(mm){
      var from=mm[1], arrow=mm[2], to=mm[3], label=mm[4].trim();
      if(arrow==='<--'||arrow==='<-'){ var t=from; from=to; to=t; }
      addP(from); addP(to);
      messages.push({from:from,to:to,label:label});
    }
  });
  return {participants:seen, messages:messages};
}

var REST_RE=/\b(GET|POST|PUT|PATCH|DELETE)\s+[^\s:;,()]+/i;

function validatePlantUml(text){
  var parsed=parsePlantUml(text);
  if(parsed.messages.length===0){
    return {ok:false,blocking:true,error:'Не удалось распознать ни одного сообщения. Проверьте синтаксис PlantUML Sequence Diagram — например: "СистемаA -> СистемаB: GET /api/v1/order".'};
  }
  var recP=[], unrecP=[];
  var byKind={system:[],container:[],component:[]};
  parsed.participants.forEach(function(p){
    var norm=p.toUpperCase().replace(/^"|"$/g,'');
    var known=KNOWN_ALIASES_MAP[norm];
    if(known){ recP.push(p); byKind[known.kind].push(p); }
    else unrecP.push(p);
  });
  var recC=[], unrecC=[];
  var msgs=parsed.messages.map(function(m){
    var mt=REST_RE.exec(m.label);
    var ok=!!mt;
    (ok?recC:unrecC).push(m.label);
    return {from:m.from,to:m.to,label:m.label,ok:ok};
  });
  var lifelineOk={};
  recP.forEach(function(p){lifelineOk[p]=true;});
  unrecP.forEach(function(p){lifelineOk[p]=false;});
  return {
    ok:true, blocking:false,
    hasWarnings: unrecP.length>0 || unrecC.length>0,
    participants:parsed.participants,
    recognizedParticipants:recP, unrecognizedParticipants:unrecP,
    messages:msgs, recognizedCalls:recC, unrecognizedCalls:unrecC,
    lifelineOk:lifelineOk,
    byKind:byKind
  };
}

function withFocus(fn){
  var active=document.activeElement;
  var id=active&&active.id;
  var selStart=null, selEnd=null;
  if(active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA')){
    try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){}
  }
  fn();
  if(id){
    var el=document.getElementById(id);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function handleDroppedFile(file){
  if(!file) return;
  var p=state.panel; if(!p||p.type!=='uploadPlantuml') return;
  p.fileMeta={name:file.name,size:file.size,uploadedAt:null};
  p.fileProgress=0;
  render();
  var reader=new FileReader();
  reader.onload=function(){
    var text=String(reader.result||'');
    var steps=[30,62,88,100];
    var i=0;
    (function step(){
      if(!state.panel || state.panel.fileMeta!==p.fileMeta) return;
      p.fileProgress=steps[i];
      if(i===steps.length-1){
        p.value=text; p.err=null; p.report=null;
        p.fileProgress=null; p.fileMeta.uploadedAt=nowStr();
      }
      render();
      i++;
      if(i<steps.length) setTimeout(step,140);
    })();
  };
  reader.readAsText(file,'utf-8');
}
function onFileInputChange(input){
  handleDroppedFile(input.files&&input.files[0]);
}
function onDropzoneDrop(ev){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag');
  var f=ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files[0];
  handleDroppedFile(f);
}

  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

function textMatches(t,q){ return t.toLowerCase().indexOf(q)>=0; }

function renderCjList(){
  var q=state.cjSearch.trim().toLowerCase();
  var pubFilter=state.cjPublishFilter;
  var items=CJ_LIST.filter(function(cj){
    if(pubFilter==='published') return cj.published;
    if(pubFilter==='unpublished') return !cj.published;
    return true;
  });

  var out='';
  items.forEach(function(cj){
    var cjMatch = !q || textMatches(cj.title,q) || textMatches(cj.code,q);
    var biOut=[];
    cj.bi.forEach(function(bi){
      var biMatch = !q || cjMatch || textMatches(bi.title,q) || textMatches(bi.code,q);
      var steps=bi.steps.filter(function(s){
        return !q || cjMatch || biMatch || textMatches(s.title,q) || textMatches(s.code,q);
      });
      if(!q || cjMatch || biMatch || steps.length){ biOut.push({bi:bi,steps:steps}); }
    });
    if(q && !cjMatch && biOut.length===0) return;

    var forceOpen = !!q;
    var cjOpen = forceOpen || !!state.expanded[cj.id];
    var selCj = state.selected && state.selected.type==='cj' && state.selected.id===cj.id;

    out+='<div class="tree-row lvl-cj'+(selCj?' selected':'')+'" onclick="selectCj(\''+cj.id+'\')">'+
      '<span class="chev '+(cjOpen?'open':'')+'" onclick="event.stopPropagation();toggleExpand(\''+cj.id+'\')">'+ic('chev',16)+'</span>'+
      '<span class="badge cj">CJ</span>'+
      '<span class="rt">'+esc(cj.title)+'</span>'+
    '</div>';

    if(cjOpen){
      out+='<div class="tree-children">';
      (q?biOut:cj.bi.map(function(b){return {bi:b,steps:b.steps};})).forEach(function(entry){
        var bi=entry.bi, steps=entry.steps;
        var biOpen = forceOpen || !!state.expanded[bi.id];
        out+='<div class="tree-row lvl-bi" onclick="toggleExpand(\''+bi.id+'\')">'+
          '<span class="chev '+(biOpen?'open':'')+(steps.length?'':' none')+'">'+ic('chev',16)+'</span>'+
          '<span class="badge bi">BI</span>'+
          '<span class="rt">'+esc(bi.title)+'</span>'+
        '</div>';
        if(biOpen){
          out+='<div class="tree-children">';
          steps.forEach(function(s){
            var sel = state.selected && state.selected.type==='step' && state.selected.id===s.id;
            out+='<div class="tree-row lvl-step'+(sel?' selected':'')+'" onclick="selectStep(\''+s.id+'\')">'+
              '<span class="chev none">'+ic('chev',16)+'</span>'+
              '<span class="badge sp">SP</span>'+
              '<span class="rt">'+esc(s.title)+'</span>'+
            '</div>';
          });
          out+='</div>';
        }
      });
      out+='</div>';
    }
  });
  if(!out) out='<div class="empty-list">Нет совпадений</div>';
  return out;
}

function statusPillFor(e){
  if(!e.versions || !e.versions.length) return '<span class="pillstat neutral">Нет версий</span>';
  var last=e.versions[e.versions.length-1];
  return last.status==='ok' ? '<span class="pillstat ok">Валидно</span>' : '<span class="pillstat warn">Есть замечания</span>';
}
function renderE2eList(){
  var q=state.e2eSearch.trim().toLowerCase();
  var items=E2E_LIST_COMBINED.filter(function(e){ return !q || textMatches(e.title,q); });
  if(!items.length) return '<div class="empty-list">Нет совпадений</div>';
  return items.map(function(e){
    var sel=state.selected && state.selected.type==='e2e' && state.selected.id===e.id;
    var pill = (e.versions && e.versions.length) ? statusPillFor(e) : '';
    return '<div class="flat-row'+(sel?' selected':'')+'" onclick="selectE2e(\''+e.id+'\')">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;'+(e.mono?'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;':'')+'">'+
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(e.title)+'</span>'+pill+
      '</div>'+
    '</div>';
  }).join('');
}

/* ---- diagram tab ---- */
function buildSequenceSvgGeneric(lifelineNames,lifelineOkMap,messages,opts){
  opts=opts||{};
  var colW=opts.large?280:240;
  var n=Math.max(lifelineNames.length,1);
  var headerH=54, rowH=44, topPad=20, botPad=24;
  var width=n*colW;
  var height=headerH+topPad+Math.max(messages.length,1)*rowH+botPad;
  var idx={}; lifelineNames.forEach(function(nm,i){ idx[nm]=i; });
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'" font-family="ui-monospace,Menlo,Consolas,monospace">';
  s+='<defs>'+
    '<marker id="arrowok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--diagram-line,#5b5f6a)"/></marker>'+
    '<marker id="arrowwarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--warn-text,#93650A)"/></marker>'+
  '</defs>';
  var lineColor='var(--diagram-line,#5b5f6a)';
  var txtColor='var(--diagram-text,#16181d)';
  var warnColor='var(--warn-text,#93650A)';
  lifelineNames.forEach(function(nm,i){
    var cx=i*colW+colW/2;
    var ok = lifelineOkMap ? (lifelineOkMap[nm]!==false) : true;
    s+='<line x1="'+cx+'" y1="'+headerH+'" x2="'+cx+'" y2="'+(height-botPad+10)+'" stroke="'+lineColor+'" stroke-width="1" stroke-dasharray="4 4" opacity=".5"/>';
    s+='<rect x="'+(cx-95)+'" y="8" width="190" height="36" rx="8" fill="'+(ok?'var(--diagram-box,#EEF0F3)':'var(--warn-bg,#FFF6E0)')+'" stroke="'+(ok?'var(--diagram-boxb,#D6D9DE)':'var(--warn-border,#F5DFA0)')+'"/>';
    s+='<text x="'+cx+'" y="31" text-anchor="middle" font-size="12.5" font-weight="700" fill="'+(ok?txtColor:warnColor)+'">'+esc(nm.length>22?nm.slice(0,20)+'…':nm)+'</text>';
  });
  messages.forEach(function(m,i){
    var y=headerH+topPad+i*rowH+rowH/2;
    var fi=idx[m.from], ti=idx[m.to];
    if(fi===undefined||ti===undefined) return;
    var x1=fi*colW+colW/2, x2=ti*colW+colW/2;
    var ok = m.ok!==false;
    var col = ok?lineColor:warnColor;
    var marker = ok?'url(#arrowok)':'url(#arrowwarn)';
    var dash = ok?'':' stroke-dasharray="5 4"';
    var lbl = m.label.length>60 ? m.label.slice(0,58)+'…' : m.label;
    if(fi===ti){
      var loopW=46;
      s+='<path d="M'+x1+','+(y-8)+' h'+loopW+' v16 h-'+loopW+'" fill="none" stroke="'+col+'" stroke-width="1.4" marker-end="'+marker+'"'+dash+'/>';
      s+='<text x="'+(x1+6)+'" y="'+(y-13)+'" font-size="11.5" fill="'+col+'">'+esc(lbl)+'</text>';
    } else {
      s+='<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+col+'" stroke-width="1.4" marker-end="'+marker+'"'+dash+'/>';
      var lx=Math.min(x1,x2)+8;
      s+='<text x="'+lx+'" y="'+(y-7)+'" font-size="11.5" fill="'+col+'">'+esc(lbl)+'</text>';
    }
  });
  s+='</svg>';
  return s;
}
function buildDiagramSvg(large){
  var messages=DIAG_MESSAGES.map(function(m){
    return {from:DIAG_LIFELINES[m.from], to:DIAG_LIFELINES[m.to], label:m.label, ok:true};
  });
  return buildSequenceSvgGeneric(DIAG_LIFELINES,null,messages,{large:large});
}

function sortResultItems(items){
  return items.slice().sort(function(a,b){ return (a.ok===b.ok)?0:(a.ok?1:-1); });
}
function resultCategoryData(report){
  if(report.blocking){
    return RESULT_KINDS.map(function(k){ return {key:k.key,label:k.label,singular:k.singular,total:0,recognized:0,items:[]}; });
  }
  var map={
    participants:{items:report.participants.map(function(p){return {label:p,ok:report.lifelineOk[p]!==false};}), recognized:report.recognizedParticipants.length},
    calls:{items:report.messages.map(function(m){return {label:m.label,ok:m.ok!==false};}), recognized:report.recognizedCalls.length},
    system:{items:report.byKind.system.map(function(n){return {label:n,ok:true};}), recognized:report.byKind.system.length},
    container:{items:report.byKind.container.map(function(n){return {label:n,ok:true};}), recognized:report.byKind.container.length},
    component:{items:report.byKind.component.map(function(n){return {label:n,ok:true};}), recognized:report.byKind.component.length}
  };
  return RESULT_KINDS.map(function(k){
    var d=map[k.key];
    return {key:k.key,label:k.label,singular:k.singular,total:d.items.length,recognized:d.recognized,items:d.items};
  });
}
function scrollResultTo(key){
  var body=document.querySelector('.import-body');
  var sec=document.getElementById('result-sec-'+key);
  if(body&&sec){ body.scrollTo({top:sec.offsetTop-16,behavior:'smooth'}); }
  document.querySelectorAll('.result-anchor a').forEach(function(a){
    a.classList.toggle('active', a.getAttribute('data-anchor')===key);
  });
}
function renderResultBody(report){
  var cats=resultCategoryData(report);
  var banner;
  if(report.blocking){
    banner='<div class="err-box" style="background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-text);">'+ic('warn',16)+'<div>'+esc(report.error)+' <b>Блокирующая ошибка</b></div></div>';
  } else if(report.hasWarnings){
    banner='<div class="err-box" style="background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text);">'+ic('warn',16)+'<div>Есть замечания: часть участников или вызовов не распознана в ландшафте BeeAtlas. Версию всё равно можно сохранить.</div></div>';

function tcBestNested(candidate){
  let best = null;
  (candidate.bcMatches||[]).forEach(bc=>{
    (bc.tcNested||[]).forEach(t=>{
      if(!best || t.match>best.match) best = Object.assign({}, t, {bcCode:bc.code, bcName:bc.name});
    });
  });
  return best;
}

function tcCandidateCounts(list){
  return {
    reuse: list.filter(c=>c.decision==="reuse").length,
    create: list.filter(c=>c.decision==="new").length,
    skip: list.filter(c=>c.decision==="skip").length,
  };
}

/* Совместимость со старым форматом ВС↔ТС (используется страницей оценки и агентом «Каркас HLD») */
function buildLegacyBcTc(candidates){
  return candidates.filter(c=>c.decision==="reuse" || c.decision==="new").flatMap(c=>{
    if(c.decision==="reuse" && (c.reuseTargets||[]).length){
      return c.reuseTargets.map(target=>({
        bcName: target.bcName || "—", bcCode: target.bcCode || "—",
        tcName: c.name, tcCode: target.code,
        match: target.match + "%", apps: target.system || c.system || "—",
        owner: ARCHITECT, reqs: c.fr.map(f=>f.code+" "+f.desc+";"),
      }));
    }
    return [{
      bcName:"—", bcCode:"—", tcName: c.name, tcCode:"Новая ТС",
      match:"—", apps: c.system || "—", owner: ARCHITECT, reqs: c.fr.map(f=>f.code+" "+f.desc+";"),
    }];
  });
}

function cjMeta(cjId){ return CJ_META[cjId] || {title:"CJ", subtitle:"", status:""}; }
function cjBranchList(cjId){ return CJ_BRANCH_META[cjId] || []; }
function cjBranchTree(cjId, branchId){
  const b = CJ_BRANCHES[cjId] && CJ_BRANCHES[cjId][branchId];
  return b ? b.stages : [];
}
// Библиотечные карточки без собственного CJ_BRANCHES (весь набор, кроме cj1, в этом
// прототипе не интерактивен) трактуются так же, как того требует миграция из §3.1:
// весь их состав считается лежащим в main, design/develop — пусты.
function cjHasComposition(cjId, branchId){
  if(CJ_BRANCHES[cjId]) return cjBranchTree(cjId, branchId).length>0;
  // design никогда не бывает пустой (самая первая ветка жизненного цикла) — та же
  // договорённость действует и для карточек без собственного CJ_BRANCHES.
  return branchId==="main" || branchId==="design";
}
function activeCjStages(){
  return state.cjOpen ? cjBranchTree(state.cjOpen.cjId, state.cjOpen.branch) : [];
}
function cjTreeStats(stages){
  let scenarios=0, sources=0;
  stages.forEach(s=>(s.scenarios||[]).forEach(sc=>{ scenarios++; sources += (sc.sources||[]).length; }));
  return {stages: stages.length, scenarios, sources};
}
// Ветки полностью изолированы (§3.1) — merge на стороне staging, реализация здесь мутирует
// CJ_BRANCHES[cjId][target] напрямую, как это делал бы Publisher после успешного merge (§4.1).
function cjMergeExecute(cjId, source, target, strategy){
  const srcStages = deepClone(cjBranchTree(cjId, source));
  if(!CJ_BRANCHES[cjId]) CJ_BRANCHES[cjId] = {};
  if(strategy==="replace"){
    CJ_BRANCHES[cjId][target] = { stages: srcStages };
    return;
  }
  // add: только заполняет пробелы по (branch, id) — существующие элементы цели не трогает.
  if(!CJ_BRANCHES[cjId][target]) CJ_BRANCHES[cjId][target] = { stages: [] };
  const targetStages = CJ_BRANCHES[cjId][target].stages;
  srcStages.forEach(srcStage=>{
    const tgtStage = targetStages.find(s=>s.id===srcStage.id);
    if(!tgtStage){ targetStages.push(srcStage); return; }
    if(!tgtStage.scenarios) tgtStage.scenarios = [];
    (srcStage.scenarios||[]).forEach(srcSc=>{
      const tgtSc = tgtStage.scenarios.find(sc=>sc.id===srcSc.id);
      if(!tgtSc){ tgtStage.scenarios.push(srcSc); return; }
      if(!tgtSc.sources) tgtSc.sources = [];
      (srcSc.sources||[]).forEach(srcSrc=>{
        if(!tgtSc.sources.some(s=>s.id===srcSrc.id)) tgtSc.sources.push(srcSrc);
      });
    });
  });
}

function findCjStage(stageId){ return activeCjStages().find(s=>s.id===stageId); }
function findCjScenario(stageId, scenarioId){
  const stage = findCjStage(stageId);
  return stage.scenarios.find(s=>s.id===scenarioId);
}
function findCjSource(stageId, scenarioId, sourceId){
  return findCjScenario(stageId, scenarioId).sources.find(s=>s.id===sourceId);
}
// Sources "diverge" when their starting call (the first of possibly several) doesn't
// match — this mirrors the real rule from the architecture discussion: a BI Step is
// considered consistent with a linked E2E/Use Case when it starts from the same method.
function cjScenarioDivergent(sc){
  if(sc.sources.length<2) return false;
  const first = sc.sources[0].calls[0];
  return sc.sources.some(s=>{
    const c = s.calls[0];
    return c.app!==first.app || c.capability!==first.capability || c.endpoint!==first.endpoint;
  });
}
