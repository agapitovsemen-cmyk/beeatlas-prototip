  else if(e.target.id==="cjFilterStatusSelect"){ state.cjFilters.status = e.target.value; render(); }
  else if(e.target.id==="cjFilterFormatSelect"){ state.cjFilters.format = e.target.value; render(); }
  else if(e.target.id==="cjFilterTypeSelect"){ state.cjFilters.type = e.target.value; render(); }
  else if(e.target.id==="cjFilterChannelSelect"){ state.cjFilters.channel = e.target.value; render(); }
  else if(e.target.id==="cjBpmnFileInput"){
    const f = e.target.files && e.target.files[0];
    if(f && state.cjCreatePanel){ state.cjCreatePanel.bpmnFile = f.name; render(); }
  }
  else if(e.target.id==="acTechStatusSelect"){ state.appcat.techStatusFilter = e.target.value; render(); }
  else if(e.target.id==="acPatternTypeSelect"){ state.appcat.patternTypeFilter = e.target.value; render(); }
  else if(e.target.id==="acNfrSourceSelect"){ state.appcat.nfrSourceFilter = e.target.value; render(); }
  else if(e.target.id==="ganTypeSelect"){ state.graph.addNode.draft.typeCode = e.target.value; state.graph.addNode.draft.attributes = {}; render(); }
  else if(e.target.id==="garTypeSelect"){
    state.graph.addRel.draft.typeCode = e.target.value;
    state.graph.addRel.draft.anchorRole = null;
    state.graph.addRel.draft.otherId = "";
    state.graph.addRel.draft.attributes = {};
    render();
  }
  else if(e.target.id==="garRoleSelect"){ state.graph.addRel.draft.anchorRole = e.target.value; state.graph.addRel.draft.otherId = ""; render(); }
  else if(e.target.id==="garOtherSelect"){ state.graph.addRel.draft.otherId = e.target.value; render(); }
  else if(e.target.dataset.pairIdx!==undefined){ state.graph.typeEditor.draft.nodePairs[+e.target.dataset.pairIdx][e.target.dataset.pairField] = e.target.value; render(); }
});

function handleAction(action, el){
  switch(action){
    case "toggle-sidebar": state.sidebarCollapsed = !state.sidebarCollapsed; render(); break;
    case "toggle-theme": state.theme = state.theme==="light"?"dark":"light"; render(); break;
    case "toggle-popover": state.popover = state.popover===el.dataset.popover ? null : el.dataset.popover; render(); break;
    case "noop-doc": case "noop-ide": case "noop-logout":
      state.popover=null; showToast("Раздел вне рамок прототипа"); break;
    case "noop-assistant": showToast("Ассистент скоро будет доступен"); break;
    case "nav":
      state.activeSidebar = el.dataset.nav;
      if(el.dataset.nav==="projects") go("projects"); else go(el.dataset.nav);
      break;
    case "go-home": state.activeSidebar = "home"; go("home"); break;

    case "cj-reset-search": state.cjSearch=""; render(); break;
    case "cj-reset-search-all":
      state.cjSearch = "";
      state.cjFilters = {withGrafana:false, product:"", status:"", format:"", channel:"", type:""};
      render();
      break;
    case "cj-set-view": state.cjView = el.dataset.mode; render(); break;
    case "cj-open-filters": state.cjFiltersOpen = true; render(); break;
    case "cj-close-filters": state.cjFiltersOpen = false; render(); break;
    case "cj-toggle-with-grafana": state.cjFilters.withGrafana = !state.cjFilters.withGrafana; render(); break;
    case "cj-reset-filters":
      state.cjFilters = {withGrafana:false, product:"", status:"", format:"", channel:"", type:""};
      render();
      break;

    case "cj-open-create":
      state.cjCreatePanel = {name:"", portrait:"", owner:"", tags:"", techOwners:[""], bpmnFile:null, dragOver:false};
      render();
      break;
    case "cj-close-create": state.cjCreatePanel = null; render(); break;
    case "cj-browse-bpmn": document.getElementById("cjBpmnFileInput")?.click(); break;
    case "cj-remove-bpmn": state.cjCreatePanel.bpmnFile = null; render(); break;
    case "cj-add-tech-owner": state.cjCreatePanel.techOwners.push(""); render(); break;
    case "cj-remove-tech-owner": state.cjCreatePanel.techOwners.splice(+el.dataset.idx,1); render(); break;
    case "cj-submit-create": {
      const cp = state.cjCreatePanel;
      if(!cp.name.trim() || !cp.owner.trim() || !cp.bpmnFile) break;
      CJ_LIBRARY.unshift({
        id: uid("cj"), status:"Черновик", statusColor:"gray",
        extraBadges:[{t:"BPMN",c:"orange"}],
        name: cp.name.trim(), code:"CJ.00.00.00.00",
        desc:"Создан из файла " + cp.bpmnFile,
        app:"Beeatlas",
        channels:"—",
        tags: cp.tags.split(",").map(t=>t.trim()).filter(Boolean),
        date: NOW_DATE, clickable:false,
      });
      state.cjCreatePanel = null;
      showToast("CJ создан из файла BPMN");
      render();
      break;
    }

    case "open-cj":
      if(el.dataset.clickable!=="1"){ showToast("Показано в прототипе только для этого CJ"); break; }
      state.cjOpen = {cjId: el.dataset.id, branch: state.cjLibraryBranch};
      state.cjExpanded = {};
      state.cjSourcePanel = null;
      state.cjMenuOpen = false;
      state.cjVersionsOpen = false;
      render();
      break;
    case "close-cj":
      state.cjOpen = null; state.cjMenuOpen=false; state.cjVersionsOpen=false; state.cjSourcePanel=null;
      state.cjBranchPanel=null; state.cjMergePanel=null; state.cjBranchDeleteConfirm=null;
      render();
      break;
    case "cj-set-library-branch": state.cjLibraryBranch = el.dataset.branch; render(); break;
    case "cj-switch-branch": {
      state.cjOpen.branch = el.dataset.branch;
      state.cjExpanded = {};
      state.cjSourcePanel = null;
      state.cjBranchDeleteConfirm = null;
      render();
      break;
    }
    case "cj-open-branch-create": state.cjBranchPanel = {name:"", parent: state.cjOpen.branch}; render(); break;
    case "cj-close-branch-create": state.cjBranchPanel = null; render(); break;
    case "cj-branch-create-submit": {
      const p = state.cjBranchPanel;
      const cjId = state.cjOpen.cjId;
      const name = p.name.trim();
      const reserved = ["design","develop","main"];
      const existing = cjBranchList(cjId).map(b=>b.id.toLowerCase());
      if(!name || reserved.includes(name.toLowerCase()) || existing.includes(name.toLowerCase())) break;
      if(!CJ_BRANCHES[cjId]) CJ_BRANCHES[cjId] = {};
      CJ_BRANCHES[cjId][name] = { stages: deepClone(cjBranchTree(cjId, p.parent)) };
      cjBranchList(cjId).push({id:name, kind:"user", parent:p.parent, createdBy:ARCHITECT, createdAt:NOW_DATE});
      state.cjOpen.branch = name;
      state.cjBranchPanel = null;
      showToast(`Ветка «${name}» создана из «${p.parent}»`);
      render();
      break;
    }
    case "cj-branch-delete-ask": state.cjBranchDeleteConfirm = el.dataset.branch; render(); break;
    case "cj-branch-delete-cancel": state.cjBranchDeleteConfirm = null; render(); break;
    case "cj-branch-delete-do": {
      const cjId = state.cjOpen.cjId;
      const branchId = el.dataset.branch;
      const list = cjBranchList(cjId);
      const idx = list.findIndex(b=>b.id===branchId);
      if(idx>=0) list.splice(idx,1);
      if(CJ_BRANCHES[cjId]) delete CJ_BRANCHES[cjId][branchId];
      if(state.cjOpen.branch===branchId) state.cjOpen.branch = "main";
      state.cjBranchDeleteConfirm = null;
      showToast(`Ветка «${branchId}» удалена`);
      render();
      break;
    }
    case "cj-open-merge": {
      const cjId = state.cjOpen.cjId;
      const branches = cjBranchList(cjId).map(b=>b.id);
      const source = state.cjOpen.branch;
      const target = branches.find(b=>b!==source) || source;
      state.cjMergePanel = {source, target, strategy:"add"};
      render();
      break;
    }
    case "cj-close-merge": state.cjMergePanel = null; render(); break;
    case "cj-merge-set-source": {
      const p = state.cjMergePanel;
      p.source = el.dataset.branch;
      if(p.target===p.source){
        const alt = cjBranchList(state.cjOpen.cjId).map(b=>b.id).find(b=>b!==p.source);
        p.target = alt || p.source;
      }
      render();
      break;
    }
    case "cj-merge-set-target": {
      if(el.dataset.branch===state.cjMergePanel.source) break;
      state.cjMergePanel.target = el.dataset.branch;
      render();
      break;
    }
    case "cj-merge-set-strategy": state.cjMergePanel.strategy = el.dataset.strategy; render(); break;
    case "cj-merge-submit": {
      const p = state.cjMergePanel;
      if(!p.source || !p.target || p.source===p.target) break;
      cjMergeExecute(state.cjOpen.cjId, p.source, p.target, p.strategy);
      showToast(`Ветка «${p.source}» объединена с «${p.target}» (${p.strategy==="replace"?"замена":"добавление"})`);
      state.cjMergePanel = null;
      render();
      break;
    }
    case "cj-toggle-menu": state.cjMenuOpen = !state.cjMenuOpen; render(); break;
    case "cj-noop": state.cjMenuOpen=false; showToast("Не входит в состав переданных макетов"); break;
    case "cj-show-versions": state.cjMenuOpen=false; state.cjVersionsOpen=true; render(); break;
    case "cj-close-versions": state.cjVersionsOpen=false; render(); break;
    case "cj-open-bpmn": state.cjMenuOpen=false; state.cjBpmnOpen=true; state.cjBpmnStage=null; render(); break;
    case "cj-close-bpmn": state.cjBpmnOpen=false; state.cjBpmnStage=null; render(); break;
    case "cj-bpmn-drill": state.cjBpmnStage = el.dataset.stage; render(); break;
    case "cj-bpmn-up": state.cjBpmnStage = null; render(); break;
    case "cj-toggle-expand": {
      const key = el.dataset.key;
      state.cjExpanded[key] = !state.cjExpanded[key];
      render();
      break;
    }
    case "cj-open-source": {
      state.cjSourcePanel = {stageId: el.dataset.stage, scenarioId: el.dataset.scenario, sourceId: el.dataset.source, editing:false, draft:null};
      render();
      break;
    }
    case "cj-close-source-panel": state.cjSourcePanel=null; render(); break;
    case "cj-source-edit-start": {
      const p = state.cjSourcePanel;
      const src = findCjSource(p.stageId, p.scenarioId, p.sourceId);
      p.editing = true;
      p.draft = {calls: src.calls.map(c=>({app:c.app, capability:c.capability, endpoint:c.endpoint, iface:c.iface}))};
      render();
      break;
    }
    case "cj-source-cancel-edit": {
      const p = state.cjSourcePanel;
      if(p.creating){ state.cjSourcePanel = null; }
      else { p.editing = false; p.draft = null; }
      render();
      break;
    }
    case "cj-add-manual-source": {
      state.cjSourcePanel = {
        stageId: el.dataset.stage, scenarioId: el.dataset.scenario, sourceId: null,
        editing: true, creating: true,
        draft: { calls: [{app:"", capability:"", endpoint:"", iface:""}] },
      };
      render();
      break;
    }
    case "cj-add-call": {
      state.cjSourcePanel.draft.calls.push({app:"", capability:"", endpoint:"", iface:""});
      render();
      break;
    }
    case "cj-remove-call": {
      state.cjSourcePanel.draft.calls.splice(+el.dataset.idx, 1);
      render();
      break;
    }
    case "cj-source-save": {
      const p = state.cjSourcePanel;
      if(p.creating){
        const sc = findCjScenario(p.stageId, p.scenarioId);
        sc.sources.unshift({id:"m", type:"manual", label:"Ручная привязка", calls:p.draft.calls});
        state.cjSourcePanel = {stageId:p.stageId, scenarioId:p.scenarioId, sourceId:"m", editing:false, draft:null};
        showToast("Ручная привязка добавлена");
      } else {
        const src = findCjSource(p.stageId, p.scenarioId, p.sourceId);
        src.calls = p.draft.calls;
        p.editing = false; p.draft = null;
        showToast("Ручная привязка сохранена");
      }
      render();
      break;
    }

    case "open-project": go("project", {projectId: el.dataset.id}); break;
    case "open-project-assessment": openProjectAssessmentTab(el.dataset.id); break;
    case "open-project-usecase": openProjectUseCaseTab(el.dataset.id); break;
    case "open-usecase": openUseCase(el.dataset.id, el.dataset.uc); break;
    case "open-usecase-history": {
      openUseCase(el.dataset.id, el.dataset.uc);
      setTimeout(()=>{
        bindTocScroll();
        const target = document.getElementById("sec-history");
        const scrollEl = document.getElementById("mainScroll");
        if(target && scrollEl) scrollEl.scrollTo({top: target.offsetTop - 100, behavior:"smooth"});
      }, 30);
      break;
    }
    case "reset-uc-filters": state.ucSearch=""; state.ucSourceFilter="Все"; state.ucStatusFilter="Все"; render(); break;
    case "noop-uc-edit": showToast("Редактирование Use Case не входит в состав переданных макетов"); break;
    case "uc-verify-interfaces": ucVerifyInterfaces(el.dataset.id, el.dataset.uc); break;
    case "set-uc-view": state.ucView[el.dataset.section] = el.dataset.mode; render(); break;
    case "open-hub-interface": showToast(`Переход в карточку интерфейса «${el.dataset.call}» в Хабе приложений — вне периметра прототипа`); break;
    case "open-uc-dynamic": {
      const p = findProject(el.dataset.id);
      const u = findUseCase(p, el.dataset.uc);
      const s = u.scenarios.find(x=>x.part===el.dataset.part);
      state.sidePanel = {type:"uc-dynamic", seq: s.dynamic, plantUml: u.rawPlantUml || UC_SAMPLE_PLANTUML};
      render();
      break;
    }
    case "open-uc-cj-link": {
      const p = findProject(el.dataset.id);
      const u = findUseCase(p, el.dataset.uc);
      state.sidePanel = {type:"uc-cj-link", projectId: el.dataset.id, ucId: el.dataset.uc, stepCode: u.cjStep.code};
      render();
      break;
    }
    case "save-uc-cj-link": {
      const sp = state.sidePanel;
      const p = findProject(sp.projectId);
      const u = findUseCase(p, sp.ucId);
      const st = CJ_STEP_POOL.find(x=>x.code===sp.stepCode) || CJ_STEP_POOL[0];
      u.cj = {code: st.cjCode, name: st.cjName};
      u.cjStep = {code: st.code, name: st.name};
      state.sidePanel = null;
      render();
      showToast("Привязка к CJ обновлена");
      break;
    }
    case "open-agent": openAgent(el.dataset.id, el.dataset.agent); break;
    case "open-assessment": go("assessment-detail", {projectId: el.dataset.id, assessmentId: el.dataset.aid}); setTimeout(bindTocScroll,30); break;

    case "set-project-tab": state.projectTab = el.dataset.tab; render(); break;
    case "set-project-data-subtab": state.projectDataSubTab = el.dataset.sub; render(); break;
    case "set-project-agents-subtab": state.projectAgentsSubTab = el.dataset.sub; render(); break;
    case "launch-agent": {
      const key = el.dataset.agent, pid = el.dataset.id;
      if(key==="assessment") startWizard(pid);
      else if(key==="hld") startHldWizard(pid);
      else if(key==="usecase") startUcWizard(pid);
      else showToast("Запуск агента «" + AGENT_META[key].name + "» не входит в состав переданных макетов");
      break;
    }

    case "close-uc-wizard": {
      const wasActive = state.ucWizard && ["import","result","outcome"].includes(UC_WIZARD_STEPS[state.ucWizard.stepIndex].key);
      closeUcWizard();
      if(wasActive) showToast("Импорт прерван. Запуск сохранён в истории импорта");
      break;
    }
    case "uc-set-mode": state.ucWizard.data.mode = el.dataset.mode; render(); break;
    case "uc-wiz-back": { const w=state.ucWizard; w.stepIndex = Math.max(0, w.stepIndex-1); render(); break; }
    case "uc-fill-sample": state.ucWizard.data.plantUml = UC_SAMPLE_PLANTUML; render(); break;
    case "uc-wiz-to-import": ucWizardRunImport(); break;
    case "uc-abort-import": ucAbortImport(); break;
    case "uc-wiz-restart": ucWizardRestart(); break;
    case "uc-wiz-to-outcome": ucWizardGoOutcome(); break;
    case "uc-part-choice": {
      const part = state.ucWizard.data.parts.find(x=>x.id===el.dataset.id);
      if(part) part.choice = el.dataset.choice;
      render(); break;
    }
    case "uc-save-part-decision": {
      const part = state.ucWizard.data.parts.find(x=>x.id===el.dataset.id);
      if(!part || !ucPartCanSave(part)) break;
      if(part.choice==="redo"){
        ucWizardRestart();
        showToast("Отредактируйте PlantUML и запустите импорт заново");
        break;
      }
      part.decision = part.choice;
      if(part.decision==="specified"){
        part.tcName = "Уточнено архитектором: " + part.api;
        part.tcCode = "TC-" + Math.floor(200+Math.random()*700);
        part.dynamic = "SEQ-" + Math.floor(10+Math.random()*89);
      } else {
        part.tcName = "Плановый интерфейс: " + part.api;
        part.tcCode = null;
        part.dynamic = null;
      }
      render(); break;
    }
    case "uc-reset-part": {
      const part = state.ucWizard.data.parts.find(x=>x.id===el.dataset.id);
      if(part){
        part.decision=null; part.choice=null; part.tcName=null; part.tcCode=null; part.dynamic=null;
        part.bc=null; part.containerName=null; part.interfaceCode=null; part.protocol=null;
      }
      render(); break;
    }
    case "uc-confirm-apply": ucConfirmApply(); break;

    case "toggle-uc-run": state.ucHistoryOpenId = state.ucHistoryOpenId===el.dataset.id ? null : el.dataset.id; render(); break;
    case "export-uc": {
      state.popover = null;
      const format = el.dataset.format === "markdown" ? "Markdown" : "PlantUML";
      showToast(`Файл в формате ${format} сформирован и отправлен на скачивание`);
      break;
    }

    case "export": showToast("Файл сформирован и отправлен на скачивание"); break;

    case "open-create": openCreatePanel(); break;
    case "close-create": closeCreatePanel(); break;
    case "submit-create": submitCreate(); break;

    case "clear-search": state.search=""; state.searchOpen=false; render(); break;
    case "pick-suggestion": {
      const p = findProject(el.dataset.id);
      if(p){ state.search = p.name; state.searchOpen=false; }
      render();
      break;
    }
    case "reset-filters":
      state.search=""; state.archFilter=""; state.archFilterFull=""; state.statusFilter="Все"; state.onlyMine=false; state.searchOpen=false; state.archOpen=false;
      render(); break;
    case "pick-architect":
      state.archFilter = ARCHITECT_POOL.split(" ").slice(0,2).join(" ") + " …";
      state.archFilterFull = ARCHITECT_POOL;
      state.archOpen = false;
      render(); break;
    case "toggle-mine": state.onlyMine = !state.onlyMine; render(); break;

    case "start-wizard": startWizard(el.dataset.id); break;
    case "close-wizard": closeWizard(); break;
    case "set-req-view": state.wizard.data.reqViewMode = el.dataset.mode; render(); break;
    case "wiz-back": {
      const w = state.wizard;
      if(w.loadingTimer){ clearTimeout(w.loadingTimer); w.loadingTimer = null; }
      w.loading = false; w.loadingInfo = null;
      w.stepIndex = Math.max(0, w.stepIndex-1); render(); setTimeout(bindTocScroll,30); break;
    }
    case "wiz-abort-loading": {
      const w = state.wizard;
      if(w.loadingTimer){ clearTimeout(w.loadingTimer); w.loadingTimer = null; }
      w.loading = false; w.loadingInfo = null;
      render();
      showToast("Операция прервана");
      break;
    }
    case "wiz-to-requirements": {
      const w = state.wizard;
      startWizardLoading(
        {title:"Импортирую требования из текста или Confluence", tiles:[
          {lbl:"Источник", val: w.data.bpUrl.trim() ? "Confluence" : "Текст"},
          {lbl:"Объём текста", val: (w.data.bpText||w.data.bpUrl||"").length + " симв."},
        ]},
        900,
        ()=>{ w.stepIndex = WIZARD_STEPS.findIndex(s=>s.key==="requirements"); }
      );
      break;
    }
    case "wiz-to-tc": {
      const w = state.wizard;
      const pool = w.data.tc.length ? w.data.tc : makeTcCandidatePool();
      startWizardLoading(
        {title:"Выявление Technical Capability", tiles:[
          {lbl:"FR для анализа", val: w.data.fr.length},
          {lbl:"NFR для анализа", val: w.data.nfr.length},
          {lbl:"Кандидатов ТС", val: pool.length},
        ]},
        900,
        ()=>{ w.data.tc = pool; w.stepIndex = WIZARD_STEPS.findIndex(s=>s.key==="tc"); },
        "Сгенерировано кандидатов ТС: " + pool.length
      );
      break;
    }
    case "tc-analyze-catalog": {
      const w = state.wizard;
      const totalBc = w.data.tc.reduce((s,c)=>s+c.bcMatches.length,0);
      const tiles = [
        {lbl:"Кандидатов ТС", val: w.data.tc.length},
        {lbl:"БС в каталоге", val: totalBc},
      ];
      startWizardLoadingStaged(
        [
          {title:"Поиск ТС в каталоге бизнес-возможностей", subtitle:"Сканирование каталога бизнес-возможностей…", tiles, delay:900},
          {title:"Поиск ТС в каталоге бизнес-возможностей", subtitle:"Сопоставление кандидатов ТС с найденными БС…", tiles, delay:900},
          {title:"Поиск ТС в каталоге бизнес-возможностей", subtitle:"Формирование рекомендаций по переиспользованию…", tiles, delay:900},
        ],
        ()=>{
          w.data.tc.forEach(c=>{
            c.analyzed = true;
            const useful = c.bcMatches.filter(bc=>(bc.tcNested||[]).length>0);
            const best = tcBestNested(c);
            if(!useful.length){
              c.decision = "new";
            } else if(best && best.match>=50){
              c.decision = "reuse"; c.reuseTargets = [best];
              c.bcMatches.forEach(bc=>{ if(bc.code===best.bcCode) bc.expanded = true; });
            } else {
              c.decision = "skip";
            }
          });
          w.data.tcCatalogAnalyzed = true;
        },
        "Каталог проанализирован по всем кандидатам"
      );
      break;
    }
    case "wiz-restart-step": {
      const w = state.wizard;
      const step = el.dataset.step;
      const titles = {
        business:"Анализ бизнес-постановки",
        requirements:"Повторное выявление требований",
        tc:"Пересчёт кандидатов Technical Capability",
        result:"Повторное формирование оценки",
      };
      startWizardLoading(
        {title: titles[step] || "Обработка…", tiles:[]},
        900,
        ()=>{
          if(step==="requirements"){
            w.data.fr = FR_LIST.slice(0,12).map(x=>Object.assign({},x));
            w.data.nfr = NFR_LIST.slice(0,8).map(x=>Object.assign({},x));
            w.data.questions = DEFAULT_QUESTIONS.map(q=>({id:uid("q"),text:q}));
          } else if(step==="tc"){
            w.data.tc = makeTcCandidatePool();
            w.data.tcCatalogAnalyzed = false;
          }
        },
        "Шаг перезапущен, данные обновлены"
      );
      break;
    }
    case "tc-decide": {
      const c = state.wizard.data.tc.find(x=>x.id===el.dataset.cid);
      if(c){
        c.decision = el.dataset.decision;
        if(c.decision==="reuse" && !(c.reuseTargets||[]).length){
          const best = tcBestNested(c);
          c.reuseTargets = best ? [best] : [];
        }
      }
      render(); break;
    }
    case "tc-toggle-bc-expand": {
      const c = state.wizard.data.tc.find(x=>x.id===el.dataset.cid);
      const bc = c && c.bcMatches.find(b=>b.code===el.dataset.bc);
      if(bc) bc.expanded = !bc.expanded;
      render(); break;
    }
    case "tc-select-reuse": {
      const c = state.wizard.data.tc.find(x=>x.id===el.dataset.cid);
      const bc = c && c.bcMatches.find(b=>b.code===el.dataset.bc);
      const t = bc && bc.tcNested.find(x=>x.code===el.dataset.tc);
      if(c && bc && t){
        c.reuseTargets = c.reuseTargets || [];
        const idx = c.reuseTargets.findIndex(x=>x.bcCode===bc.code && x.code===t.code);
        if(idx>=0){
          c.reuseTargets.splice(idx,1);
        } else {
          c.reuseTargets.push(Object.assign({}, t, {bcCode:bc.code, bcName:bc.name}));
        }
        c.decision = c.reuseTargets.length ? "reuse" : null;
      }
      render(); break;
    }
    case "wiz-to-result": {
      const w = state.wizard;
      const counts = tcCandidateCounts(w.data.tc);
      startWizardLoading(
        {title:"Формирование оценки", tiles:[
          {lbl:"ТС отобрано", val: counts.reuse+counts.create},
          {lbl:"Пропущено кандидатов", val: counts.skip},
        ]},
        900,
        ()=>{
          w.stepIndex = WIZARD_STEPS.findIndex(s=>s.key==="result");
          finishAssessmentAndSave();
        },
        "Оценка завершена и сохранена в проекте. Теперь её можно опубликовать или скачать по клику на кнопку «Публикация»"
      );
      break;
    }
    case "wiz-publish": {
      const w = state.wizard;
      openPublishPanel(w.projectId, w.projectId ? (findProject(w.projectId).agents.assessment.current||{}).id : null);
      break;
    }

    case "del-question": {
      const w = state.wizard;
      w.data.questions = w.data.questions.filter(q=>q.id!==el.dataset.qid);
      render(); break;
    }

    case "open-add-tc": openAddBcTc("tc", el.dataset.cid); break;
    case "clear-panel-search": state.sidePanel.query=""; state.sidePanel.results=null; render(); break;
    case "toggle-result": toggleResultSelect(el.dataset.id); break;
    case "submit-add-results": submitAddResults(); break;

    case "open-publish": openPublishPanel(el.dataset.id, el.dataset.aid); break;
    case "submit-publish": submitPublish(); break;
    case "close-side": case "close-side-backdrop": state.sidePanel=null; render(); break;

    /* ---- Каркас HLD ---- */
    case "start-hld-wizard": startHldWizard(el.dataset.id); break;
    case "close-hld-wizard": closeHldWizard(); break;
    case "hldwiz-back": { const w=state.hldWizard; w.stepIndex=Math.max(0,w.stepIndex-1); render(); break; }
    case "hldwiz-to-compose": hldWizardAdvance("compose", 900); break;
    case "hldwiz-to-publish": { const w=state.hldWizard; w.stepIndex = HLD_WIZARD_STEPS.findIndex(s=>s.key==="publish"); render(); break; }
    case "hldwiz-publish": {
      finishHldAndSave();
      const pid = state.hldWizard.projectId;
      state.hldWizard = null;
      go("agent-hld", {projectId: pid});
      showToast("Каркас HLD сформирован и опубликован в Confluence");
      break;
    }
    case "toggle-hld-system": { const r=state.hldWizard.data.systems.find(x=>x.id===el.dataset.id); if(r) r.checked=!r.checked; render(); break; }
    case "toggle-hld-tc": { const r=state.hldWizard.data.tc.find(x=>x.id===el.dataset.id); if(r) r.checked=!r.checked; render(); break; }
    case "del-hld-tc": { state.hldWizard.data.tc = state.hldWizard.data.tc.filter(x=>x.id!==el.dataset.id); render(); break; }
    case "open-add-usecase": openAddUsecase(); break;
    case "del-usecase": { state.hldWizard.data.useCases = state.hldWizard.data.useCases.filter(x=>x.id!==el.dataset.id); render(); break; }
    case "submit-usecase": submitUsecase(); break;

    case "open-hld-skeleton": go("hld-skeleton", {projectId: el.dataset.id}); break;
    case "open-hld-flow": openHldFlow(el.dataset.flow, el.dataset.id); break;
    case "open-hld-report": go("hld-report", {projectId: el.dataset.pid, reportType: el.dataset.type, reportId: el.dataset.id}); break;
    case "hld-panel-source-url": state.sidePanel.source="url"; render(); break;
    case "hld-panel-source-file": state.sidePanel.source="file"; render(); break;
    case "hld-panel-fake-upload": state.sidePanel.fileName="HLD_v2.docx"; render(); break;
    case "submit-hld-flow": submitHldFlow(); break;

    case "publish-hld-report": {
      const p = findProject(el.dataset.pid);
      const r = p.agents.hld.reports.impact.find(x=>x.id===el.dataset.id);
      if(r){ r.published = true; render(); showToast("Результаты анализа опубликованы в Confluence"); }
      break;
    }
    case "val-save": {
      const p = findProject(el.dataset.pid);
      const r = p.agents.hld.reports.validate.find(x=>x.id===el.dataset.id);
      if(r){ r.saved = true; render(); showToast("HLD сохранён как провалидированный"); }
      break;
    }
    case "val-pick-system": showToast("Похожая система выбрана из справочника BeeAtlas"); break;
    case "val-mark-new": showToast("Система помечена как новая, создаваемая в рамках проекта"); break;
    case "val-create-task": showToast("Задача на заведение метода в ФДМ создана для команды-владельца"); break;
    case "arch-fix-hld": showToast("Открыт каркас HLD для внесения изменений"); break;
    case "arch-file-defect": showToast("Дефект заведён на команду-владельца системы"); break;

    case "toc-scroll": {
      const target = document.getElementById(el.dataset.target);
      const scrollEl = el.closest(".wizard-body") || document.getElementById("mainScroll");
      if(target && scrollEl){
        scrollEl.scrollTo({top: target.offsetTop - 100, behavior:"smooth"});
      }
      break;
    }

    /* ---- App catalog ---- */
    case "ac-toggle-tree": state.appcat.expanded[el.dataset.id] = !state.appcat.expanded[el.dataset.id]; render(); break;
    case "ac-tabs-scroll": {
      const wrap = el.closest(".ac-tabs-wrap");
      const track = wrap?.querySelector(".ac-tabs-track");
      if(track){ track.scrollLeft += el.dataset.dir==="left" ? -220 : 220; syncAcTabsWrap(wrap); }
      break;
    }
    case "ac-open-app":
      state.appcat.detailId = el.dataset.id; state.appcat.tab = "general"; state.appcat.generalSub = "info";
      render();
      break;
    case "ac-back-to-list": state.appcat.detailId = null; render(); break;
    case "ac-set-tab": state.appcat.tab = el.dataset.tab; render(); break;
    case "ac-set-general-sub": state.appcat.generalSub = el.dataset.sub; render(); break;
    case "ac-toggle-pipeline": { const k=el.dataset.id; state.appcat.pipelineExpanded[k]=!state.appcat.pipelineExpanded[k]; render(); break; }
    case "ac-set-fitness-sub": state.appcat.fitnessSub = el.dataset.sub; render(); break;
    case "ac-toggle-fitness": { const k=el.dataset.key; state.appcat.fitnessExpanded[k]=!state.appcat.fitnessExpanded[k]; render(); break; }
    case "ac-toggle-tc-ifaces": state.appcat.tcOnlyIfaces = !state.appcat.tcOnlyIfaces; render(); break;
    case "ac-reset-tc": state.appcat.tcSearch=""; state.appcat.tcOnlyIfaces=false; render(); break;
    case "ac-toggle-tc": { const k=el.dataset.id; state.appcat.tcExpanded[k]=!state.appcat.tcExpanded[k]; render(); break; }
    case "ac-set-iface-mode": state.appcat.ifaceMode = el.dataset.mode; render(); break;
    case "ac-toggle-iface": { const k=el.dataset.id; state.appcat.ifaceExpanded[k]=!state.appcat.ifaceExpanded[k]; render(); break; }
    case "ac-open-tech": state.appcat.techDetail = {id: el.dataset.id}; render(); break;
    case "ac-close-tech": state.appcat.techDetail = null; render(); break;
    case "ac-toggle-tech-ki": state.appcat.techKiOnly = !state.appcat.techKiOnly; render(); break;
    case "ac-reset-tech": state.appcat.techSearch=""; state.appcat.techStatusFilter="Все"; state.appcat.techKiOnly=false; render(); break;
    case "ac-reset-patterns": state.appcat.patternSearch=""; state.appcat.patternTypeFilter="Все"; render(); break;
    case "ac-reset-nfr": state.appcat.nfrSearch=""; state.appcat.nfrSourceFilter="Все"; render(); break;
    case "ac-toggle-obs": {
      const k=el.dataset.id;
      state.appcat.obsExpanded[k] = state.appcat.obsExpanded[k]===false ? true : false;
      render();
      break;
    }
    case "ac-open-source-editor": {
      const mode = el.dataset.mode;
      let level = "instance", values = {};
      if(mode==="edit"){
        const node = findObsNode(el.dataset.id, AC_OBS_TREE);
        if(node){
          level = node.level===1?"instance":node.level===2?"container":"interface";
          values[level] = node.label;
          values.template = "Prometheus-template-api-queries (spring+ histogramm)";
          values.source = "Prometheus-BeeInside";
        }
      }
      state.appcat.sourceEditor = {mode, kind:"button", level, values, sourceOpen:false};
      render();
      break;
    }
    case "ac-close-source-editor": state.appcat.sourceEditor = null; render(); break;
    case "ac-src-set-kind": state.appcat.sourceEditor.kind = el.dataset.kind; render(); break;
    case "ac-src-set-level": state.appcat.sourceEditor.level = el.dataset.level; render(); break;
    case "ac-src-pick-source":
      state.appcat.sourceEditor.values.source = "Prometheus-BeeInside";
      state.appcat.sourceEditor.sourceOpen = false;
      render();
      break;
    case "ac-src-save":
      state.appcat.sourceEditor = null;
      showToast("Источник сохранён");
      render();
      break;
    case "ac-toggle-related": {
      const k = el.dataset.key;
      state.appcat.relatedExpanded[k] = !state.appcat.relatedExpanded[k];
      render();
      break;
    }

    /* ---- Company architecture graph ---- */
    case "graph-set-page": state.graph.page = el.dataset.page; render(); break;
    case "graph-select-node": {
      const node = graphNode(el.dataset.id);
      state.graph.selectedNodeId = el.dataset.id;
      state.graph.nodeSearch = node ? node.label : "";
      render();
      requestAnimationFrame(()=>{ graphAutoFitZoom(); render(); });
      break;
    }
    case "graph-clear-selection": state.graph.selectedNodeId = null; state.graph.nodeSearch = ""; render(); break;
    case "graph-toggle-detail-collapsed":
      state.graph.detailCollapsed = !state.graph.detailCollapsed;
      render();
      requestAnimationFrame(()=>{ graphAutoFitZoom(); render(); });
      break;
    case "graph-toggle-type-filter": { const t=el.dataset.type; state.graph.typeFilter[t]=!state.graph.typeFilter[t]; render(); break; }
    case "graph-toggle-custom-layer": state.graph.showCustomLayer = !state.graph.showCustomLayer; render(); break;
    case "graph-zoom-in": state.graph.zoom = Math.min(Math.round(((state.graph.zoom||1)+0.15)*100)/100, 2.5); render(); break;
    case "graph-zoom-out": state.graph.zoom = Math.max(Math.round(((state.graph.zoom||1)-0.15)*100)/100, 0.3); render(); break;
    case "graph-zoom-fit": graphAutoFitZoom(); render(); break;
    case "graph-toggle-export-menu": state.graph.exportMenuOpen = !state.graph.exportMenuOpen; render(); break;
    case "graph-export": state.graph.exportMenuOpen = false; showToast(`Экспорт в ${el.dataset.format.toUpperCase()} — заглушка в прототипе`); render(); break;

    case "graph-open-add-node":
      state.graph.addNode = { attachTo: el.dataset.id, draft:{ typeCode:"", name:"", attributes:{} } };
      render();
      break;
    case "graph-close-add-node": state.graph.addNode = null; render(); break;
    case "graph-save-add-node": {
      const st = state.graph.addNode;
      const t = findNodeType(st.draft.typeCode);
      if(!t || !st.draft.name.trim()) break;
      CUSTOM_NODE_INSTANCES.push({
        instanceId: uid(t.code), type:t.code, name: st.draft.name.trim(),
        attributes: Object.assign({}, st.draft.attributes),
        attachTo: st.attachTo,
      });
      state.graph.addNode = null;
      showToast("Нода добавлена");
      render();
      break;
    }

    case "graph-open-add-rel":
      state.graph.addRel = { anchorId: el.dataset.id, draft:{ typeCode:"", anchorRole:null, otherId:"", attributes:{} } };
      render();
      break;
    case "graph-close-add-rel": state.graph.addRel = null; render(); break;
    case "graph-save-add-rel": {
      const st = state.graph.addRel;
      const t = findRelType(st.draft.typeCode);
      if(!t || !st.draft.otherId) break;
      const from = st.draft.anchorRole==="from" ? st.anchorId : st.draft.otherId;
      const to = st.draft.anchorRole==="from" ? st.draft.otherId : st.anchorId;
      CUSTOM_REL_INSTANCES.push({
        id: uid(t.code.toLowerCase()), type:t.code,
        attributes: Object.assign({}, st.draft.attributes),
        from, to,
      });
      state.graph.addRel = null;
      showToast("Связь добавлена");
      render();
      break;
    }

    case "graph-set-type-kind": state.graph.typeKind = el.dataset.kind; render(); break;
    case "graph-toggle-type-tree": state.graph.typeTreeExpanded[el.dataset.id] = !state.graph.typeTreeExpanded[el.dataset.id]; render(); break;
    case "graph-new-type":
      state.graph.typeEditor = {
        kind: state.graph.typeKind, editingCode: null,
        draft: {
          name:"", code:"", description:"", attributes:[],
          linkableNodes:[], relationshipType:"", relationshipDirection:"TO_CUSTOM",
          nodePairs:[],
        },
      };
      render();
      break;
    case "graph-edit-type": {
      const kind = el.dataset.kind, code = el.dataset.code;
      const t = kind==="node" ? findNodeType(code) : findRelType(code);
      if(!t) break;
      state.graph.typeEditor = {
        kind, editingCode: code,
        draft: {
          name:t.name, code:t.code, description:t.description,
          attributes: Object.entries(t.attributes).map(([k,v])=>({key:k, desc:v})),
          linkableNodes: kind==="node" ? [...t.linkableNodes] : [],
          relationshipType: kind==="node" ? t.relationshipType : "",
          relationshipDirection: kind==="node" ? t.relationshipDirection : "TO_CUSTOM",
          nodePairs: kind==="relationship" ? t.nodePairs.map(p=>({from:p.from,to:p.to})) : [],
        },
      };
      render();
      break;
    }
    case "graph-close-type-editor": state.graph.typeEditor = null; render(); break;
    case "graph-add-attr": state.graph.typeEditor.draft.attributes.push({key:"",desc:""}); render(); break;
    case "graph-remove-attr": state.graph.typeEditor.draft.attributes.splice(+el.dataset.idx,1); render(); break;
    case "graph-add-pair": state.graph.typeEditor.draft.nodePairs.push({from:"SoftwareSystem",to:"Container"}); render(); break;
    case "graph-remove-pair": state.graph.typeEditor.draft.nodePairs.splice(+el.dataset.idx,1); render(); break;
    case "graph-set-direction": state.graph.typeEditor.draft.relationshipDirection = el.dataset.dir; render(); break;
    case "graph-toggle-linkable": {
      const d = state.graph.typeEditor.draft;
      const v = el.dataset.value;
      const idx = d.linkableNodes.indexOf(v);
      if(idx>-1) d.linkableNodes.splice(idx,1); else d.linkableNodes.push(v);
      render();
      break;
    }
    case "graph-save-type": {
      const ed = state.graph.typeEditor;
      const d = ed.draft;
      const codePattern = ed.kind==="node" ? /^[a-z][a-z0-9_]*$/ : /^[A-Z][A-Z0-9_]*$/;
      if(!d.name.trim() || !d.code.trim() || !codePattern.test(d.code.trim())){
        showToast("Проверьте имя и формат кода типа");
        break;
      }
      const attributes = {};
      d.attributes.forEach(a=>{ if(a.key.trim()) attributes[a.key.trim()] = a.desc.trim(); });
      if(ed.kind==="node"){
        if(!d.linkableNodes.length || !d.relationshipType.trim()){ showToast("Укажите соседей и название связи"); break; }
        if(!ed.editingCode && CUSTOM_NODE_TYPES.some(t=>t.code===d.code.trim())){ showToast("Тип с таким кодом уже существует"); break; }
        const obj = {
          code:d.code.trim(), name:d.name.trim(), description:d.description.trim(), attributes,
          linkableNodes:[...d.linkableNodes], relationshipType:d.relationshipType.trim(),
          relationshipDirection:d.relationshipDirection,
          createdBy: graphViewer().label, createdAt: NOW_DATE,
        };
        if(ed.editingCode){
          const i = CUSTOM_NODE_TYPES.findIndex(t=>t.code===ed.editingCode);
          if(i>-1) CUSTOM_NODE_TYPES[i] = Object.assign({}, CUSTOM_NODE_TYPES[i], obj);
        } else {
          CUSTOM_NODE_TYPES.push(obj);
        }
      } else {
        if(!d.nodePairs.length){ showToast("Добавьте хотя бы одну пару нод"); break; }
        if(!ed.editingCode && CUSTOM_RELATIONSHIP_TYPES.some(t=>t.code===d.code.trim())){ showToast("Тип с таким кодом уже существует"); break; }
        const obj = {
          code:d.code.trim(), name:d.name.trim(), description:d.description.trim(), attributes,
          nodePairs:d.nodePairs.map(p=>({from:p.from,to:p.to})),
          createdBy: graphViewer().label, createdAt: NOW_DATE,
        };
        if(ed.editingCode){
          const i = CUSTOM_RELATIONSHIP_TYPES.findIndex(t=>t.code===ed.editingCode);
          if(i>-1) CUSTOM_RELATIONSHIP_TYPES[i] = Object.assign({}, CUSTOM_RELATIONSHIP_TYPES[i], obj);
        } else {
          CUSTOM_RELATIONSHIP_TYPES.push(obj);
        }
      }
      state.graph.typeEditor = null;
      showToast("Тип сохранён");
      render();
      break;
    }
    case "graph-delete-type": {
      const kind = el.dataset.kind, code = el.dataset.code;
      if(!confirm("Удалить тип и все его экземпляры в графе?")) break;
      if(kind==="node"){
        const i = CUSTOM_NODE_TYPES.findIndex(t=>t.code===code);
        if(i>-1) CUSTOM_NODE_TYPES.splice(i,1);
        for(let j=CUSTOM_NODE_INSTANCES.length-1;j>=0;j--) if(CUSTOM_NODE_INSTANCES[j].type===code) CUSTOM_NODE_INSTANCES.splice(j,1);
      } else {
        const i = CUSTOM_RELATIONSHIP_TYPES.findIndex(t=>t.code===code);
        if(i>-1) CUSTOM_RELATIONSHIP_TYPES.splice(i,1);
        for(let j=CUSTOM_REL_INSTANCES.length-1;j>=0;j--) if(CUSTOM_REL_INSTANCES[j].type===code) CUSTOM_REL_INSTANCES.splice(j,1);
      }
      showToast("Тип и его экземпляры удалены");
      render();
      break;
    }

    case "close-toast": closeToast(); break;
  }
}

/* ============================= INIT ============================= */
(function applyDeepLinkFromUrl(){
  try {
    const home = new URLSearchParams(location.search).get("home");
    if(["cj","e2e","projects"].includes(home)){
      state.activeSidebar = home;
      state.route = {view: home==="projects" ? "projects" : home};
      return;
    }
  } catch(e){}
  // no explicit ?home= link — fall back to wherever the user last was (see saveLocation)
  const loc = loadLocation();
  if(loc){
    if(loc.activeSidebar) state.activeSidebar = loc.activeSidebar;
    if(loc.route) state.route = loc.route;
    if(loc.appcat) Object.assign(state.appcat, loc.appcat);
  }
})();
render();

})();
</script>
</body>
</html>
